,"e":4},{"n":68,"t":"test","m":["Tema 2","2.1 Métricas de revisión: Cycle Time, Lead Time, tasa de rechazo","Diap. 16"],"d":1,"s":["Un responsable quiere bajar el Cycle Time de las revisiones. Según la Ley de Little, ¿qué medida es la correcta?"],"o":["Limitar el WIP y hacer PR más pequeños, para que la cola nunca se sature.","Eliminar la revisión humana y aprobar todo de forma automática.","Abrir más PR a la vez para que haya más trabajo disponible.","Pedir a los revisores que lean el código más rápido."],"a":0,"w":["Con λ constante, W solo baja si baja L (el trabajo en curso). Leer más rápido degrada la calidad de la revisión y no ataca la causa (diapositiva 16). (Distractor plausible: d)."],"e":4},{"n":69,"t":"test","m":["Tema 2","2.1 Métricas de revisión: Cycle Time, Lead Time, tasa de rechazo","Diap. 21"],"d":2,"s":["Tras fijar el objetivo «Cycle Time menor de un día», el Cycle Time baja, pero suben la tasa de rechazo posterior y los incidentes en producción. ¿Qué está pasando?"],"o":["Los PR son demasiado pequeños y por eso fallan más.","La métrica se está «gamificando» (Ley de Goodhart): se aprueba sin leer para cumplir el número.","Faltan métricas: hay que instalar quince indicadores más para entenderlo.","El equipo ha mejorado su eficiencia y conviene fijar un objetivo todavía más bajo."],"a":1,"w":["Es el error de optimización local ciega: si el Cycle Time baja, pero la tasa de rechazo o los incidentes suben, hay rubber- stamping. Por eso las métricas se miden en parejas (diapositiva 21). (Distractor plausible: d)."],"e":4},{"n":70,"t":"huecos","m":["Tema 2","2.i Introducción","Diaps. 6–7"],"d":0,"s":["Completad el texto (sobran dos palabras). La revisión moderna equilibra cuatro dimensiones: velocidad de entrega, seguridad de la cadena de {{1}}, diseño y arquitectura e integración segura del código generado por {{2}}. Las técnicas de revisión actúan como {{3}} tempranos. Si se hacen pocas revisiones, el flujo de trabajo queda {{4}}; si son demasiadas, el desarrollo se vuelve {{5}} hasta detenerse. Los equipos modernos delegan el {{6}} % de las revisiones en máquinas, y los ingenieros hacen el resto para evitar que los errores se conviertan en {{7}}."],"a":["I","E","D","H","F","B","C"],"w":["Sobran: 20, limpio. El 20 % es la parte humana, no la de las máquinas. «Limpio» es justo lo contrario de lo que pasa cuando faltan revisiones."],"b":[{"l":"A","w":"20"},{"l":"B","w":"80"},{"l":"C","w":"defectos"},{"l":"D","w":"filtros"},{"l":"E","w":"IA"},{"l":"F","w":"lento"},{"l":"G","w":"limpio"},{"l":"H","w":"sucio"},{"l":"I","w":"suministro"}],"k":7,"e":4},{"n":71,"t":"huecos","m":["Tema 2","2.0 El proceso de revisión","Diaps. 10–12"],"d":0,"s":["Completad el texto sobre el proceso de revisión actual (sobran dos palabras). En el modelo moderno, la reunión se volvió {{1}}, el acta se volvió comentario {{2}} y cada vez más la inspección la ejecutan {{3}} antes de que intervenga un humano. En la preparación, el autor hace un PR {{4}}, explica qué cambia y por qué y lo enlaza con el {{5}} original. En el registro, los hallazgos se clasifican por severidad: {{6}} (no debería hacerse merge), importante, menor, pregunta, sugerencia y fuera de {{7}}."],"a":["B","I","E","F","H","C","A"],"w":["Sobran: presencial, grande. La reunión presencial con actas en papel es el modelo clásico, y un PR grande es justo lo que la preparación intenta evitar."],"b":[{"l":"A","w":"alcance"},{"l":"B","w":"asíncrona"},{"l":"C","w":"bloqueantes"},{"l":"D","w":"grande"},{"l":"E","w":"máquinas"},{"l":"F","w":"pequeño"},{"l":"G","w":"presencial"},{"l":"H","w":"ticket"},{"l":"I","w":"trazable"}],"k":7,"e":4},{"n":72,"t":"huecos","m":["Tema 2","2.1 Métricas de revisión: Cycle Time, Lead Time, tasa de rechazo","Diaps. 15–16"],"d":1,"s":["Completad el texto sobre los fundamentos de las métricas (sobran dos palabras). Las métricas de revisión no sirven para vigilar a una {{1}} concreta, sino para diagnosticar la salud del flujo de valor del equipo. Heredan sus fundamentos de la Teoría de {{2}} y del Lean Manufacturing de {{3}}. La Ley de Little dice que L = λ · W; si el ritmo de llegada se mantiene, la única forma de bajar el tiempo de espera es reducir el {{4}}. Por eso el Cycle Time no baja haciendo que los humanos lean más {{5}}, sino controlando el {{6}} y la frecuencia de los PR para que el sistema de colas nunca se {{7}}."],"a":["C","A","G","I","D","F","E"],"w":["Sobran: equipo, vacíe. Las métricas diagnostican al equipo completo, no lo vigilan; por eso «equipo» no encaja en el hueco 1. El riesgo de la cola es saturarse, no vaciarse."],"b":[{"l":"A","w":"Colas"},{"l":"B","w":"equipo"},{"l":"C","w":"persona"},{"l":"D","w":"rápido"},{"l":"E","w":"sature"},{"l":"F","w":"tamaño"},{"l":"G","w":"Toyota"},{"l":"H","w":"vacíe"},{"l":"I","w":"WIP"}],"k":7,"e":4},{"n":73,"t":"huecos","m":["Tema 2","2.1 Métricas de revisión: Cycle Time, Lead Time, tasa de rechazo","Diaps. 22–23"],"d":0,"s":["Completad el texto sobre buenas prácticas de flujo (sobran dos palabras). Los micro-PR se limitan a {{1}}–400 líneas modificadas, porque a partir de unas {{2}} líneas el cerebro deja de leer y empieza a hojear. Si la columna «En revisión» alcanza su límite de {{3}}, todo el equipo deja de programar y se pone a {{4}}. En la cadena de montaje de GitHub, la entrada son los {{5}}, la estación de calidad es el {{6}} y los inspectores robóticos son las GitHub {{7}}, Grype y Dependabot."],"a":["B","C","I","H","E","G","D"],"w":["Sobran: 2 000, Milestones. Los Milestones son la planificación (Sprint Backlog), no la entrada. 2 000 líneas es el ejemplo de PR demasiado grande de la diapositiva 21."],"b":[{"l":"A","w":"2 000"},{"l":"B","w":"200"},{"l":"C","w":"400"},{"l":"D","w":"Actions"},{"l":"E","w":"Issues"},{"l":"F","w":"Milestones"},{"l":"G","w":"Pull Request"},{"l":"H","w":"revisar"},{"l":"I","w":"WIP"}],"k":7,"e":4},{"n":74,"t":"diag","m":["Tema 2","2.0 El proceso de revisión","Diaps. 10–12"],"d":0,"s":["Completad el ciclo clásico de revisión de Fagan, que hoy sigue el Pull Request."],"a":["A","B","C","D","E"],"w":["Sobran: Despliegue canario, Planificación técnica. Son las seis fases de las diapositivas 10–12. La planificación técnica es uno de los cinco niveles de la fase 1, no una fase del ciclo, y el despliegue canario no pertenece al proceso de revisión."],"b":[{"l":"A","w":"Preparación"},{"l":"B","w":"Revisión o examen"},{"l":"C","w":"Registro de defectos"},{"l":"D","w":"Corrección y seguimiento"},{"l":"E","w":"Cierre"},{"l":"F","w":"Despliegue canario"},{"l":"G","w":"Planificación técnica"}],"k":5,"e":4},{"n":75,"t":"diag","m":["Tema 2","2.1 Métricas de revisión: Cycle Time, Lead Time, tasa de rechazo","Diaps. 18–20"],"d":0,"s":["Completad la línea de tiempo del flujo de valor con el nombre de cada intervalo."],"a":["C","B","D"],"w":["Sobran: Review dump, Bus factor. El Lead Time mide todo el recorrido; el Cycle Time empieza en el primer commit; el Idle Time es el tramo con el PR listo y nadie revisándolo (diapositiva 18). Review dump y bus factor son antipatrones o riesgos, no intervalos."],"b":[{"l":"A","w":"Bus factor"},{"l":"B","w":"Cycle Time"},{"l":"C","w":"Idle Time"},{"l":"D","w":"Lead Time"},{"l":"E","w":"Review dump"}],"k":3,"e":4},{"n":76,"t":"diag","m":["Tema 2","2.1 Métricas de revisión: Cycle Time, Lead Time, tasa de rechazo","Diap. 16"],"d":1,"s":["Completad el esquema de la Ley de Little aplicado a la revisión de código."],"a":["F","A","E","C"],"w":["Sobran: MTTR, Lead Time. L = λ · W (diapositiva 16): λ es el ritmo de llegada, L lo que hay dentro y W el tiempo de permanencia. La palanca que el equipo controla es el límite de WIP."],"b":[{"l":"A","w":"L: elementos en el sistema"},{"l":"B","w":"Lead Time"},{"l":"C","w":"Límite de WIP"},{"l":"D","w":"MTTR"},{"l":"E","w":"W: tiempo en el sistema"},{"l":"F","w":"λ: tasa de llegada"}],"k":4,"e":4},{"n":77,"t":"ord","m":["Tema 2","2.0 El proceso de revisión","Diaps. 10–12"],"d":0,"s":["Ordenad las seis fases del proceso clásico de revisión. Escribid las letras en el orden correcto."],"a":["B","D","A","C","F","E"],"w":["Es el orden de Fagan (diapositiva 10), que hoy sigue el PR: se planifica, se prepara, se examina, se registran los hallazgos, se corrigen y se cierra."],"it":[{"l":"A","h":"Revisión o examen"},{"l":"B","h":"Planificación"},{"l":"C","h":"Registro de defectos"},{"l":"D","h":"Preparación"},{"l":"E","h":"Cierre"},{"l":"F","h":"Corrección y seguimiento"}],"k":6,"e":4},{"n":78,"t":"ord","m":["Tema 2","2.0 El proceso de revisión","Diap. 13"],"d":1,"s":["Ordenad los cinco niveles de la planificación, del primero al último del ciclo. Escribid las letras en el orden correcto."],"a":["D","A","B","C","E"],"w":["Ocurren en cascada y cada nivel alimenta al siguiente (diapositiva 13): qué problema, qué criterios, cómo se implementa, cómo se cuenta y quién debe auditarlo."],"it":[{"l":"A","h":"Planificación del ticket (refinamiento)"},{"l":"B","h":"Planificación técnica (asignación y desarrollo)"},{"l":"C","h":"Planificación del PR (paso a «Ready for Review»)"},{"l":"D","h":"Planificación de producto (al crear el ticket)"},{"l":"E","h":"Planificación de la revisión (asignación de Code Owners)"}],"k":5,"e":4},{"n":79,"t":"ord","m":["Tema 2","2.1 Métricas de revisión: Cycle Time, Lead Time, tasa de rechazo","Diap. 23"],"d":0,"s":["Ordenad las estaciones de GitHub vistas como una cadena de montaje. Escribid las letras en el orden correcto."],"a":["E","D","B","C","F","A"],"w":["Es el mapeo de la diapositiva 23 del sistema de producción Toyota sobre GitHub."],"it":[{"l":"A","h":"Merge tras la aprobación del Code Owner: salida"},{"l":"B","h":"Push de la rama: fabricación"},{"l":"C","h":"Pull Request: estación de calidad"},{"l":"D","h":"Milestones o Projects: se decide qué entra hoy"},{"l":"E","h":"Issues: nace la idea"},{"l":"F","h":"GitHub Actions, Grype y Dependabot: inspectores robóticos"}],"k":6,"e":4},{"n":80,"t":"calc","m":["Tema 2","2.1 Métricas de revisión: Cycle Time, Lead Time, tasa de rechazo","Diap. 16"],"d":0,"s":["Un equipo abre de media 5 PR al día y cada PR permanece 3 días en el sistema hasta fusionarse. ¿Cuántos PR hay abiertos de media (WIP)?"],"o":["0,6 PR","1,7 PR","8 PR","15 PR"],"a":3,"w":["1. ¿Qué pregunta responde? ¿Cuántos PR conviven a la vez en el sistema de revisión?","2. Datos con unidades λ = 5 PR/día (tasa de llegada). W = 3 días (tiempo medio en el sistema).","3. Fórmula y por qué L=λ·W Ley de Little: lo que entra por unidad de tiempo multiplicado por lo que tarda en salir es lo que se acumula dentro (diapositiva 16).","4. Sustitución L = 5 PR/día × 3 días = 15 PR","5. Comprobación de sentido Las unidades cuadran (PR/día × día = PR) y es lógico: entran 5 cada día y cada uno se queda tres.","6. Interpretación y decisión Por tanto, el WIP medio es de 15 PR; para bajar W hay que bajar ese número.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora b) 1,7 PR: 1,7 PR sale de dividir λ entre W: las unidades quedarían en PR/día², que no tienen sentido."],"e":4},{"n":81,"t":"calc","m":["Tema 2","2.1 Métricas de revisión: Cycle Time, Lead Time, tasa de rechazo","Diap. 16"],"d":1,"s":["Hay 12 PR abiertos de media y llegan 4 al día. ¿Cuánto tiempo pasa cada PR en el sistema? Si queréis bajar ese tiempo a 1,5 días sin cambiar el ritmo de llegada, ¿qué WIP necesitáis?"],"o":["0,33 días; WIP de 6 PR","3 días; WIP de 6 PR","3 días; WIP de 2,7 PR","48 días; WIP de 18 PR"],"a":1,"w":["1. ¿Qué pregunta responde? ¿Cuánto tarda un PR y qué trabajo en curso permite tardar 1,5 días?","2. Datos con unidades L = 12 PR. λ = 4 PR/día. W objetivo = 1,5 días.","3. Fórmula y por qué W = L / λ y L objetivo = λ · W objetivo Es la misma Ley de Little despejada: el tiempo es lo acumulado dividido entre el ritmo de llegada.","4. Sustitución W = 12 PR / 4 PR/día = 3 días L objetivo = 4 PR/día × 1,5 días = 6 PR","5. Comprobación de sentido Para tardar la mitad sin frenar la llegada, el WIP tiene que bajar a la mitad: de 12 a 6.","6. Interpretación y decisión Por tanto, limitad la columna «En revisión» a unos 6 PR.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora c) 3 días; WIP de 2,7 PR: 2,7 PR sale de dividir λ entre W objetivo (4 / 1,5), que no es la Ley de Little."],"e":4},{"n":82,"t":"calc","m":["Tema 2","2.1 Métricas de revisión: Cycle Time, Lead Time, tasa de rechazo","Diaps. 18–20"],"d":1,"s":["Una funcionalidad tiene un Lead Time de 20 días y un Cycle Time de 4 días (96 h). Durante 60 h de ese Cycle Time, el PR estuvo abierto sin que nadie lo revisara. ¿Qué porcentaje del Cycle Time es Idle Time?"],"o":["12,5 %","20 %","37,5 %","62,5 %"],"a":3,"w":["1. ¿Qué pregunta responde? ¿Qué parte del tiempo de ciclo se pierde esperando revisión?","2. Datos con unidades Cycle Time = 4 días = 96 h. Idle Time = 60 h. Lead Time = 20 días = 480 h (no hace falta).","3. Fórmula y por qué % Idle = Idle Time / Cycle Time × 100 El Idle Time es una parte del Cycle Time (diapositiva 18), así que la base es el Cycle Time, en las mismas unidades.","4. Sustitución 60 h / 96 h = 0,625 → 62,5 %","5. Comprobación de sentido 60 h es más de la mitad de 96 h: el resultado debe superar el 50 %.","6. Interpretación y decisión Por tanto, el cuello de botella es la espera de revisión, como en el ejemplo del 67 % del tema.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora a) 12,5 %: 12,5 % sale de dividir entre el Lead Time (60 / 480): se mezcla un tramo del ciclo con el recorrido completo del negocio. 37,5 % es la parte que no es espera y 20 % compara Cycle con Lead Time."],"e":4},{"n":83,"t":"calc","m":["Tema 2","2.1 Métricas de revisión: Cycle Time, Lead Time, tasa de rechazo","Diap. 19"],"d":0,"s":["En un mes se abren 120 PR y 18 de ellos se devuelven con peticiones de cambio significativas. ¿Cuál es la tasa de rechazo?"],"o":["1,5 %","15 %","17,6 %","85 %"],"a":1,"w":["1. ¿Qué pregunta responde? ¿Qué porcentaje de PR vuelve al autor con cambios significativos?","2. Datos con unidades PR totales = 120. PR devueltos = 18.","3. Fórmula y por qué Tasa de rechazo = PR devueltos / PR totales × 100 Es un porcentaje sobre todos los PR revisados (diapositiva 19).","4. Sustitución 18 / 120 = 0,15 → 15 %","5. Comprobación de sentido 18 es algo más de la décima parte de 120: un 15 % es razonable.","6. Interpretación y decisión Por tanto, uno de cada siete PR vuelve: conviene mirar si faltan criterios de aceptación.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora c) 17,6 %: 17,6 % sale de dividir entre los PR no devueltos (18 / 102): la base debe ser el total."],"e":4},{"n":84,"t":"calc","m":["Tema 2","2.1 Métricas de revisión: Cycle Time, Lead Time, tasa de rechazo","Diap. 22"],"d":0,"s":["Una funcionalidad obliga a modificar 1 700 líneas. Si seguís la práctica de micro-PR con un máximo de 400 líneas por PR, ¿cuántos PR necesitáis como mínimo?"],"o":["4 PR","5 PR","9 PR","17 PR"],"a":1,"w":["1. ¿Qué pregunta responde? ¿En cuántos PR de 400 líneas como máximo cabe el cambio?","2. Datos con unidades Líneas totales = 1 700. Máximo por PR = 400 líneas.","3. Fórmula y por qué Número de PR = ⌈1 700 / 400⌉ (redondeo hacia arriba) Cada PR admite como mucho 400 líneas; si sobra una parte, necesita su propio PR.","4. Sustitución 1 700 / 400 = 4,25 Redondeando hacia arriba: 5 PR","5. Comprobación de sentido 4 × 400 = 1 600 < 1 700, así que con 4 PR quedarían 100 líneas fuera.","6. Interpretación y decisión Por tanto, dividid el cambio en 5 PR apilados.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora a) 4 PR: 4 PR sale de redondear hacia abajo: el último PR tendría 500 líneas y superaría el límite."],"e":4},{"n":85,"t":"rel","m":["Tema 2","2.2 Revisiones de Pull Requests","Diap. 33"],"d":0,"s":["Relacionad cada tipo de Conventional Commit con su significado. Escribid la letra de la definición junto a cada número (sobran 2 definiciones)."],"a":["B","F","G","E","I","D","C"],"w":["Tabla de la diapositiva 33. Las definiciones que sobran son praise (Conventional Comments) y el Draft PR."],"c":["fix:","feat:","BREAKING CHANGE o !","build:","ci:","docs:","refactor:"],"df":[{"l":"A","h":"Comentario de revisión que destaca algo brillante del código."},{"l":"B","h":"Corrige un bug; produce un lanzamiento PATCH."},{"l":"C","h":"Cambia el código sin corregir errores ni añadir funcionalidades."},{"l":"D","h":"Cambia solo la documentación."},{"l":"E","h":"Cambia el sistema de compilación o las dependencias externas."},{"l":"F","h":"Añade una funcionalidad compatible; produce un lanzamiento MINOR."},{"l":"G","h":"Rompe la compatibilidad de la API; fuerza un lanzamiento MAJOR."},{"l":"H","h":"Marca un PR como no listo para fusionar."},{"l":"I","h":"Cambia la configuración o los scripts de integración continua."}],"k":7,"e":5},{"n":86,"t":"rel","m":["Tema 2","2.2 Revisiones de Pull Requests","Diap. 35"],"d":0,"s":["Relacionad cada etiqueta de Conventional Comments con su significado. Escribid la letra de la definición junto a cada número (sobran 2 definiciones)."],"a":["D","E","G","C","F","B","H"],"w":["Tabla de la diapositiva 35. Las que sobran son tipos de commit (ci: y perf:), no etiquetas de comentario: es la confusión más habitual entre las dos convenciones."],"c":["issue:","suggestion:","nitpick:","question:","chore:","todo:","praise:"],"df":[{"l":"A","h":"Cambio que mejora el rendimiento de forma medible."},{"l":"B","h":"Cambio pequeño y trivial, pero estrictamente necesario antes del merge."},{"l":"C","h":"Duda sobre si algo es relevante; pide aclaración sin presuponer error."},{"l":"D","h":"Problema concreto (bug, vulnerabilidad); bloqueante por defecto."},{"l":"E","h":"Propone una mejora explicando qué y por qué; no bloqueante."},{"l":"F","h":"Tarea de proceso previa a la aceptación (p. ej., actualizar el ticket)."},{"l":"G","h":"Petición trivial de estilo o preferencia; el autor puede ignorarla."},{"l":"H","h":"Refuerzo positivo: destaca algo brillante."},{"l":"I","h":"Cambio en los scripts de integración continua."}],"k":7,"e":5},{"n":87,"t":"rel","m":["Tema 2","2.2 Revisiones de Pull Requests","Diaps. 35–36"],"d":1,"s":["Relacionad cada decoración o etiqueta complementaria con su significado. Escribid la letra de la definición junto a cada número (sobran 2 definiciones)."],"a":["F","G","H","B","D","E","C"],"w":["Las definiciones son de la diapositiva 36. Sobran quibble (que no está entre los conceptos) y praise."],"c":["(blocking)","(non-blocking)","(if-minor)","thought:","note:","typo:","polish:"],"df":[{"l":"A","h":"Igual que nitpick, pero evitando la connotación de «buscar piojos»."},{"l":"B","h":"Idea surgida al revisar; sin acción inmediata, útil para el futuro o la mentoría."},{"l":"C","h":"Nada está mal, pero propone pulir y elevar la calidad de inmediato."},{"l":"D","h":"Destaca un detalle del que conviene tomar nota."},{"l":"E","h":"Como un todo:, pero para errores ortográficos o gramaticales."},{"l":"F","h":"Impide aceptar el código hasta resolver ese punto."},{"l":"G","h":"No impide aprobar el PR aunque quede sin resolver."},{"l":"H","h":"El autor lo resuelve solo si es trivial; si no, se puede posponer."},{"l":"I","h":"Destaca algo brillante del código."}],"k":7,"e":5},{"n":88,"t":"rel","m":["Tema 2","2.2 Revisiones de Pull Requests","Diaps. 28, 37–38"],"d":1,"s":["Relacionad cada concepto de colaboración con su definición. Escribid la letra de la definición junto a cada número (sobran 2 definiciones)."],"a":["C","G","B","A","H","I","E"],"w":["Diapositivas 28 y 37–38. Las dos que sobran son el rubber-stamping y la rama efímera."],"c":["CODEOWNERS","Bus factor","Silos de conocimiento","Draft PR","RFC (Request for Comments)","Sunk Cost Fallacy","Fail fast"],"df":[{"l":"A","h":"PR marcado como no listo para fusionar, abierto pronto para opinar sobre el enfoque."},{"l":"B","h":"Causa raíz de un bus factor bajo: el contexto vive en una sola persona."},{"l":"C","h":"Fichero que asocia rutas del repositorio con revisores obligatorios."},{"l":"D","h":"Rama que se crea desde main y se elimina al fusionarse."},{"l":"E","h":"Descubrir pronto y barato que un enfoque no sirve."},{"l":"F","h":"Aprobar un PR sin leerlo realmente."},{"l":"G","h":"Cuántas personas tendrían que faltar para que el proyecto quiebre."},{"l":"H","h":"Documento vivo para que los seniors validen modelos y patrones antes de la lógica."},{"l":"I","h":"Defender un mal diseño por las horas ya invertidas en él."}],"k":7,"e":5},{"n":89,"t":"test","m":["Tema 2","2.2 Revisiones de Pull Requests","Diaps. 25–26"],"d":0,"s":["¿Por qué una buena descripción de PR ahorra días en un equipo repartido por zonas horarias opuestas?"],"o":["Porque evita tener que ejecutar el pipeline de integración continua.","Porque cada pregunta no resuelta de antemano cuesta un round-trip que puede ser una jornada completa (hasta 24 h).","Porque GitHub prioriza en la cola los PR con descripciones largas.","Porque el revisor lee una descripción larga más rápido que el propio código."],"a":1,"w":["El coste de una duda no es leerla (segundos), sino esperar a que la otra persona vuelva a estar disponible (diapositiva 26). La descripción elimina rondas antes de que ocurran. (Distractor plausible: d)."],"e":5},{"n":90,"t":"test","m":["Tema 2","2.2 Revisiones de Pull Requests","Diap. 27"],"d":0,"s":["¿Qué significa que una rama sea «efímera» en GitHub Flow?"],"o":["Que nunca se sube al repositorio remoto.","Que se crea a partir de otra rama de funcionalidad, no de main.","Que vive poco tiempo (idealmente menos de dos o tres días) y se elimina en cuanto se fusiona.","Que solo puede contener un commit."],"a":2,"w":["Si la rama vive semanas, el PR crece, aumentan los round-trips y los conflictos (diapositiva 27). En GitHub Flow, las ramas salen de main. (Distractor plausible: b)."],"e":5},{"n":91,"t":"test","m":["Tema 2","2.2 Revisiones de Pull Requests","Diaps. 28, 37"],"d":0,"s":["Tenéis que refactorizar todo el modelo de datos de un servicio. ¿Qué recomienda el tema?"],"o":["Abrir un PR normal y pedir la aprobación inmediata del arquitecto.","Hacer en un par de horas el esqueleto, abrir un Draft PR y preguntar si es el camino correcto antes de escribir los tests.","Trabajar cinco días en local y abrir el PR cuando todo tenga tests, para no hacer perder el tiempo al equipo.","Hacer el cambio directamente en main para evitar conflictos."],"a":1,"w":["Es el ejemplo de la diapositiva 28: si el enfoque es malo, fracasáis rápido y barato. El distractor es la receta de la falacia del coste hundido: tras cinco días defenderéis el diseño por lo invertido. (Distractor plausible: c)."],"e":5},{"n":92,"t":"test","m":["Tema 2","2.2 Revisiones de Pull Requests","Diap. 33"],"d":1,"s":["Sobre la versión 2.1.0 se fusiona un commit con el mensaje «feat!: drop support for Node 6». ¿Qué versión se publica?"],"o":["2.1.1","3.0.0","2.1.0 (sin cambio de versión)","2.2.0"],"a":1,"w":["El ! después del tipo marca un cambio incompatible (BREAKING CHANGE) y fuerza un MAJOR, aunque el tipo sea feat. Sin el !, feat daría 2.2.0 (MINOR). (Distractor plausible: d)."],"e":5},{"n":93,"t":"test","m":["Tema 2","2.2 Revisiones de Pull Requests","Diap. 33"],"d":0,"s":["¿Qué tipo de Conventional Commit corresponde a reescribir una función para hacerla más legible aplicando SOLID, sin cambiar su comportamiento?"],"o":["refactor:","feat:","style:","fix:"],"a":0,"w":["refactor: cambia el código sin corregir ni añadir funcionalidad. style: es solo para cambios que no afectan al significado (espacios, formato, punto y coma). (Distractor plausible: c)."],"e":5},{"n":94,"t":"test","m":["Tema 2","2.2 Revisiones de Pull Requests","Diap. 36"],"d":2,"s":["Un revisor escribe: «issue (ux, non-blocking): These buttons should be red, but let's handle this in a follow-up.» ¿Qué afirmación es correcta?"],"o":["Bloquea el merge, porque issue es una etiqueta bloqueante.","Es un nitpick de estilo que el autor puede ignorar.","Es una pregunta informativa sin acción.","Señala un problema real, pero la decoración non-blocking indica que no impide el merge; (ux) da contexto."],"a":3,"w":["issue es bloqueante por defecto, pero la decoración lo modifica: aquí se deja explícito que se tratará en otro PR (diapositiva 36). Ese es el valor del formato: nadie tiene que adivinar si bloquea. (Distractor plausible: a)."],"e":5},{"n":95,"t":"test","m":["Tema 2","2.2 Revisiones de Pull Requests","Diap. 30"],"d":0,"s":["El equipo dedica dos días a debatir si una variable debe llamarse userList o list_of_users, mientras un problema de concurrencia pasa desapercibido en el mismo PR. ¿Cómo se llama este error y cómo se evita?"],"o":["Review dump; reservando dos franjas fijas al día para revisar.","Ghosting; cerrando los PR abandonados.","Rubber-stamping; exigiendo dos aprobaciones.","Bikeshedding (ley de la trivialidad de Parkinson); automatizando el estilo con linters y formatters."],"a":3,"w":["Se debate lo fácil de opinar y se ignora lo difícil. Si el estilo lo decide una herramienta, el debate no puede ni empezar (diapositiva 30). El review dump es otro error: revisar diez PR de golpe al final del día. (Distractor plausible: a)."],"e":5},{"n":96,"t":"test","m":["Tema 2","2.2 Revisiones de Pull Requests","Diaps. 38–39"],"d":2,"s":["Un junior modifica la interfaz y, sin darse cuenta, toca un fichero de /backend/payments/. En CODEOWNERS existe la regla /backend/payments/ @fintech-arch-team. ¿Qué ocurre?"],"o":["GitHub rechaza el push del junior.","Nada: CODEOWNERS solo documenta quién conoce cada carpeta.","La plataforma añade a ese equipo como revisor obligatorio y bloquea el merge hasta que apruebe.","GitHub avisa al equipo, pero el merge puede hacerse con la aprobación de cualquier revisor."],"a":2,"w":["CODEOWNERS enruta de forma algorítmica y, con la protección de rama, el merge queda bloqueado hasta la aprobación del experto (diapositiva 39). Así se evita el rubber-stamping accidental. (Distractor plausible: d)."],"e":5},{"n":97,"t":"huecos","m":["Tema 2","2.2 Revisiones de Pull Requests","Diaps. 25–27"],"d":0,"s":["Completad el texto (sobran dos palabras). El GitHub Flow es el estándar de {{1}} en la industria y es deliberadamente más simple que {{2}}. En un equipo global, la comunicación {{3}} es costosa y bloqueante, porque obliga a coincidir en el tiempo. La revisión asíncrona empaqueta el estado {{4}} del autor para que el revisor pueda {{5}} la intención sin un canal de ida y vuelta. La empatía {{6}} consiste en anticipar las preguntas del revisor y proponer mejoras sin activar sesgos {{7}} en el autor."],"a":["F","G","I","H","C","B","D"],"w":["Sobran: asíncrona, emocional. Lo costoso y bloqueante es lo síncrono (reuniones, llamadas); lo asíncrono es la solución. La empatía del tema se llama cognitiva."],"b":[{"l":"A","w":"asíncrona"},{"l":"B","w":"cognitiva"},{"l":"C","w":"decodificar"},{"l":"D","w":"defensivos"},{"l":"E","w":"emocional"},{"l":"F","w":"facto"},{"l":"G","w":"GitFlow"},{"l":"H","w":"mental"},{"l":"I","w":"síncrona"}],"k":7,"e":5},{"n":98,"t":"huecos","m":["Tema 2","2.2 Revisiones de Pull Requests","Diaps. 29–30"],"d":0,"s":["Completad el texto sobre la descripción del PR (sobran dos palabras). Un PR {{1}} no tiene descripción útil ni enlace al {{2}} y obliga al revisor a adivinar el contexto. Una buena descripción responde a cuatro cosas: {{3}} hace el cambio, {{4}} se hace, cómo {{5}} y, cuando aplica, evidencia {{6}} del antes y el después. La solución es adoptar una plantilla de PR {{7}}."],"a":["B","H","G","E","F","I","C"],"w":["Sobran: borrador, opcional. Un PR en borrador (draft) es una buena práctica, no el problema. La plantilla tiene que ser obligatoria para que fuerce a rellenar el qué, el por qué y el cómo probarlo (diapositiva 30)."],"b":[{"l":"A","w":"borrador"},{"l":"B","w":"huérfano"},{"l":"C","w":"obligatoria"},{"l":"D","w":"opcional"},{"l":"E","w":"por qué"},{"l":"F","w":"probarlo"},{"l":"G","w":"qué"},{"l":"H","w":"ticket"},{"l":"I","w":"visual"}],"k":7,"e":5},{"n":99,"t":"huecos","m":["Tema 2","2.2 Revisiones de Pull Requests","Diaps. 31–33"],"d":1,"s":["Completad el texto sobre Conventional Commits y SemVer (sobran dos palabras). El formato de un commit es <{{1}}>[optional {{2}}]: <description>. Si todo el equipo lo respeta, la CI puede deducir la versión siguiente, generar el {{3}} y publicar el release sin intervención humana. Según SemVer, fix: produce un lanzamiento {{4}}, feat: uno {{5}} y un BREAKING CHANGE, uno {{6}}. Los cambios que solo afectan a la documentación usan el tipo {{7}}."],"a":["I","H","A","F","E","D","C"],"w":["Sobran: README, chore:. El fichero que se autogenera es el CHANGELOG.md; el README es lo que modifica un commit docs:. chore: es para tareas rutinarias que no encajan en otra categoría."],"b":[{"l":"A","w":"CHANGELOG"},{"l":"B","w":"chore:"},{"l":"C","w":"docs:"},{"l":"D","w":"MAJOR"},{"l":"E","w":"MINOR"},{"l":"F","w":"PATCH"},{"l":"G","w":"README"},{"l":"H","w":"scope"},{"l":"I","w":"type"}],"k":7,"e":5},{"n":100,"t":"huecos","m":["Tema 2","2.2 Revisiones de Pull Requests","Diaps. 34–36"],"d":0,"s":["Completad el texto sobre Conventional Comments (sobran dos palabras). El formato es <{{1}}> [{{2}}]: <subject>. La etiqueta issue es {{3}} por defecto y se recomienda acompañarla de una {{4}}. La decoración (if-minor) deja que el autor lo resuelva solo si es {{5}}. Se debe intentar dejar al menos un comentario {{6}} por revisión. Escribir «bloqueante:» en español no funciona, porque estas convenciones solo sirven si todo el equipo usa las mismas {{7}}."],"a":["D","B","A","H","I","G","C"],"w":["Sobran: nitpick, opcional. issue no es opcional: es bloqueante por defecto. nitpick es lo contrario de lo que se recomienda dejar en cada revisión (diapositivas 35–36)."],"b":[{"l":"A","w":"bloqueante"},{"l":"B","w":"decorations"},{"l":"C","w":"etiquetas"},{"l":"D","w":"label"},{"l":"E","w":"nitpick"},{"l":"F","w":"opcional"},{"l":"G","w":"praise"},{"l":"H","w":"sugerencia"},{"l":"I","w":"trivial"}],"k":7,"e":5},{"n":101,"t":"huecos","m":["Tema 2","2.2 Revisiones de Pull Requests","Diaps. 37–38"],"d":1,"s":["Completad el texto (sobran dos palabras). L {"l":"I","w":"token"}],"k":7,"e":6},{"n":117,"t":"huecos","m":["Tema 2","2.3 Revisiones asistidas por IA","Diaps. 50–52"],"d":1,"s":["Completad el texto sobre buenas prácticas (sobran dos palabras). La máxima Zero-Trust es: la IA genera {{1}} y el humano certifica {{2}}. El revisor delega la sintaxis y el estilo en los {{3}} y reserva su atención para la semántica de frontera: seguridad, rendimiento bajo {{4}} y arquitectura distribuida. Las pruebas de mutación cambian, por ejemplo, un > por un <; si los tests siguen en verde, el mutante ha {{5}}. Los agentes de IA son el primer filtro, nunca el {{6}}, y no deben tener permisos de {{7}} sobre las ramas principales."],"a":["G","B","E","C","H","I","A"],"w":["Sobran: muerto, lectura. Si los tests siguen en verde, el mutante sobrevive: el test no vale. Se dice que muere cuando el test falla al encontrar el código roto (diapositiva 51)."],"b":[{"l":"A","w":"auto-merge"},{"l":"B","w":"determinismo"},{"l":"C","w":"estrés"},{"l":"D","w":"lectura"},{"l":"E","w":"linters"},{"l":"F","w":"muerto"},{"l":"G","w":"probabilidades"},{"l":"H","w":"sobrevivido"},{"l":"I","w":"único"}],"k":7,"e":6},{"n":118,"t":"huecos","m":["Tema 2","2.4 Análisis estático continuo (SAST), análisis de dependencias (SCA) y SBOM","Diaps. 54–56"],"d":0,"s":["Completad el texto sobre la cadena de suministro (sobran dos palabras). En 2020, atacantes de nivel estado-nación comprometieron el proceso de {{1}} de SolarWinds. Las dependencias {{2}} son la punta del iceberg; las {{3}}, la parte oculta. Un proyecto moderno es un grafo acíclico {{4}}. La superficie de {{5}} es todo el código donde un atacante puede encontrar un agujero. Como es imposible leer cientos de librerías, el {{6}} recorre el grafo y cruza hashes y versiones con las bases de datos de {{7}}."],"a":["B","D","I","E","A","H","C"],"w":["Sobran: SAST, distribuido. El SAST analiza vuestro propio código; el que recorre el grafo de dependencias es el SCA. DAG significa grafo acíclico dirigido."],"b" obran: 5, permanente. SLSA va del nivel 0 al 3 (diapositiva 66). La gracia de la firma keyless es que no hay ninguna clave permanente que robar."],"b":[{"l":"A","w":"3"},{"l":"B","w":"5"},{"l":"C","w":"efímero"},{"l":"D","w":"hash"},{"l":"E","w":"ingredientes"},{"l":"F","w":"OIDC"},{"l":"G","w":"permanente"},{"l":"H","w":"repudio"},{"l":"I","w":"VEX"}],"k":7,"e":6},{"n":121,"t":"diag","m":["Tema 2","2.4 Análisis estático continuo (SAST), análisis de dependencias (SCA) y SBOM","Diaps. 54–56, 61"],"d":0,"s":["Completad el iceberg de dependencias."],"a":["A","B","F","E"],"w":["Sobran: SAST, Linter. Las directas son las que elegís (la punta); las transitivas llegan de arrastre (la parte oculta). Todo junto es la superficie de ataque real, y el SCA es quien recorre ese grafo (diapositivas 54–56 y 61)."],"b":[{"l":"A","w":"Dependencias directas"},{"l":"B","w":"Dependencias transitivas"},{"l":"C","w":"Linter"},{"l":"D","w":"SAST"},{"l":"E","w":"SCA"},{"l":"F","w":"Superficie de ataque"}],"k":4,"e":6},{"n":122,"t":"diag","m":["Tema 2","2.4 Análisis estático continuo (SAST), análisis de dependencias (SCA) y SBOM","Diaps. 56–57, 60"],"d":1,"s":["Completad el recorrido que sigue un motor SAST con análisis de manchas (taint analysis)."],"a":["G","D","F","A","B"],"w":["Sobran: SBOM, CVE. El dato «contaminado» entra por el source y llega al sink; si existe una ruta sin pasar por la sanitización, el motor bloquea el código. Todo empieza compilando el código en un AST (diapositivas 56–57)."],"b":[{"l":"A","w":"Árbol sintáctico abstracto (AST)"},{"l":"B","w":"Bloqueo del código"},{"l":"C","w":"CVE"},{"l":"D","w":"Filtro de sanitización"},{"l":"E","w":"SBOM"},{"l":"F","w":"Sink"},{"l":"G","w":"Source"}],"k":5,"e":6},{"n":123,"t":"ord","m":["Tema 2","2.4 Análisis estático continuo (SAST), análisis de dependencias (SCA) y SBOM","Diaps. 56–57"],"d":0,"s":["Ordenad cómo trabaja un motor SAST con análisis de manchas. Escribid las letras en el orden correcto."],"a":["C","B","A","E","D"],"w":["Es el razonamiento de las diapositivas 56–57: primero la estructura, después el recorrido de la mancha y, por último, la decisión."],"it":[{"l":"A","h":"Traza los caminos del grafo hasta los destinos críticos (sink)"},{"l":"B","h":"Marca las entradas de datos del usuario como source"},{"l":"C","h":"Compila el código fuente en un árbol sintáctico abstracto (AST)"},{"l":"D","h":"Bloquea el código si encuentra una ruta directa sin purificar"},{"l":"E","h":"Comprueba si cada camino cruza un filtro de sanitización"}],"k":5,"e":6},{"n":124,"t":"ord","m":["Tema 2","2.4 Análisis estático continuo (SAST), análisis de dependencias (SCA) y SBOM","Diap. 62"],"d":0,"s":["Ordenad la cadena de herramientas del SBOM del tema. Escribid las letras en el orden correcto."],"a":["B","C","A","D"],"w":["Primero se genera el inventario y después se analiza; Trivy confirma (diapositiva 62)."],"it":[{"l":"A","h":"Grype lee el SBOM y consulta su base de datos de vulnerabilidades"},{"l":"B","h":"Syft lee el fichero de dependencias (requirements.txt)"},{"l":"C","h":"Syft escribe el SBOM en CycloneDX con dependencias directas y transitivas"},{"l":"D","h":"Trivy hace una verificación cruzada de lo que dijo Grype"}],"k":4,"e":6},{"n":125,"t":"ord","m":["Tema 2","2.4 Análisis estático continuo (SAST), análisis de dependencias (SCA) y SBOM","Diap. 68"],"d":1,"s":["Ordenad los pasos de una firma keyless con Sigstore y Cosign. Escribid las letras en el orden correcto."],"a":["A","C","F","E","D","B"],"w":["Es el caso de uso de la diapositiva 68: identidad del pipeline → certificado efímero → firma → registro inmutable → destrucción de la clave → verificación pública."],"it":[{"l":"A","h":"El servidor de CI/CD se autentica en la nube mediante OIDC"},{"l":"B","h":"Cualquier cliente verifica la procedencia sin ninguna contraseña"},{"l":"C","h":"Se genera un certificado efímero, válido unos minutos"},{"l":"D","h":"La clave se destruye automáticamente"},{"l":"E","h":"La firma se sube al registro público  / mutantes generados × 100 La métrica mide el porcentaje de mutantes que vuestros tests identifican (diapositiva 51).","4. Sustitución 60 / 80 = 0,75 → 75 %","5. Comprobación de sentido Debe estar entre 0 y 100 % y, como mueren más de los que sobreviven, por encima del 50 %.","6. Interpretación y decisión Por tanto, uno de cada cuatro fallos inyectados pasa sin que los tests se enteren: hay que reforzar esos casos.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora a) 25 %: 25 % es el porcentaje de supervivientes (20 / 80), justo el complemento. 33,3 % y 300 % comparan muertos y supervivientes entre sí."],"e":6},{"n":129,"t":"rel","m":["Tema 2","2.5 Revisión estructural","Diaps. 91–93"],"d":1,"s":["Relacionad cada code smell con su síntoma y su refactorización. Escribid la letra de la definición junto a cada número (sobran 2 definiciones)."],"a":["C","E","H","G","A","D","B"],"w":["Catálogo de las diapositivas 91–93. Las que sobran son Middle Man y Dead Code, que no están en la lista."],"c":["Long Method","Large Class / God Class","Long Parameter List","Primitive Obsession","Shotgun Surgery","Feature Envy","Switch Statements"],"df":[{"l":"A","h":"Un cambio obliga a tocar muchas clases → Move Method y Move Field."},{"l":"B","h":"switch sobre un tipo repetido en varios sitios → Replace Conditional with Polymorphism."},{"l":"C","h":"Método que no cabe en pantalla, con comentarios que separan pasos → Extract Method."},{"l":"D","h":"Un método usa más datos de otra clase que de la suya → moverlo a esa clase."},{"l":"E","h":"Clase con demasiadas responsabilidades y dependencias → Extract Class."},{"l":"F","h":"Clase que solo delega en otra → Remove Middle Man."},{"l":"G","h":"Importes o DNI como string sueltos → Replace Primitive with Object (Value Object)."},{"l":"H","h":"Más de 4 parámetros, varios del mismo tipo → Introduce Parameter Object."},{"l":"I","h":"Código que nunca se llama → Remove Dead Code."}],"k":7,"e":7},{"n":130,"t":"rel","m":["Tema 2","2.5 Revisión estructural","Diaps. 94–99"],"d":0,"s":["Relacionad cada principio o concepto con lo que dice. Escribid la letra de la definición junto a cada número (sobran 2 definiciones)."],"a":["E","I","D","C","G","B","F"],"w":["Diapositivas 94–99. Sobran DRY y la ley de Demeter (tell, don't ask), que son reglas de código limpio."],"c":["SRP","OCP","LSP","ISP","DIP","Inyección de dependencias","Contenedor IoC"],"df":[{"l":"A","h":"Pedir al objeto lo que necesitas en vez de encadenar getters."},{"l":"B","h":"Técnica de pasar las dependencias desde fuera."},{"l":"C","h":"Ningún cliente debe depender de métodos que no usa."},{"l":"D","h":"Los subtipos deben poder sustituir a su tipo base sin comportamientos incorrectos."},{"l":"E","h":"Un módulo debe tener una sola razón para cambiar: responde ante un único actor."},{"l":"F","h":"Herramienta (Spring, NestJS) que automatiza la inyección."},{"l":"G","h":"Alto y bajo nivel dependen de abstracciones que define el dominio."},{"l":"H","h":"Una única fuente de verdad para cada regla de negocio."},{"l":"I","h":"Abierto a la extensión y cerrado a la modificación."}],"k":7,"e":7},{"n":131,"t":"rel","m":["Tema 2","2.5 Revisión estructural","Diaps. 74–75, 85–86"],"d":1,"s":["Relacionad cada ley o métrica con su definición. Escribid la letra de la definición junto a cada número (sobran 2 definiciones)."],"a":["F","D","I","A","H","B","E"],"w":["Diapositivas 74–75 y 85–86. Sobran las definiciones de D y de la complejidad ciclomática, que no están en la lista de conceptos: leed con cuidado, porque D se parece a A y a I."],"c":["Hotspot","Leyes de Lehman","Ley de Conway","Ca (acoplamiento aferente)","Ce (acoplamiento eferente)","Inestabilidad (I)","Abstracción (A)"],"df":[{"l":"A","h":"Cuántos módulos dependen del tuyo."},{"l":"B","h":"Facilidad con la que el módulo cambia por sus dependencias."},{"l":"C","h":"Número de caminos independientes de un método."},{"l":"D","h":"Un sistema en uso cambia y su complejidad crece salvo que se trabaje para reducirla."},{"l":"E","h":"Proporción de clases abstractas e interfaces del módulo."},{"l":"F","h":"Archivo complejo que se modifica con frecuencia: ahí vive la deuda técnica."},{"l":"G","h":"Distancia del módulo a la línea de equilibrio entre abstracción e inestabilidad."},{"l":"H","h":"De cuántos módulos depende el tuyo."},{"l":"I","h":"La estructura del software copia la estructura de comunicación de la organización."}],"k":7,"e":7},{"n":132,"t":"test","m":["Tema 2","2.5 Revisión estructural","Diap. 72"],"d":0,"s":["¿Qué pregunta central hace una revisión estructural?"],"o":["¿Cuántas líneas tiene el PR?","¿Hace lo que pide el ticket?","¿Quién escribió el código?","¿Es fácil de cambiar, probar y extender?"],"a":3,"w":["La revisión funcional pregunta si hace lo que pide el ticket; la estructural, si aguantará el próximo cambio (diapositiva 72). (Distractor plausible: b)."],"e":7},{"n":133,"t":"test","m":["Tema 2","2.5 Revisión estructural","Diap. 73"],"d":0,"s":["¿Cuál es la regla de oro de un hallazgo estructural?"],"o":["Opinión del revisor → votación del equipo.","Síntoma → principio violado → refactorización propuesta.","Métrica → umbral → rechazo automático del PR.","Síntoma → autor responsable → plazo de corrección."],"a":1,"w":["Cada comentario debe permitir al autor entender qué pasa, por qué es un problema y cómo arreglarlo (diapositiva 73). Buscar culpables no forma parte de la regla. (Distractor plausible: d)."],"e":7},{"n":134,"t":"test","m":["Tema 2","2.5 Revisión estructural","Diap. 74"],"d":1,"s":["Según la técnica popularizada por Adam Tornhill, ¿por dónde debe empezar un revisor profesional?"],"o":["Por los archivos más complejos del repositorio, aunque nadie los toque.","Por los archivos complejos que además se modifican con frecuencia (hotspots), cruzando métricas con el historial de Git.","Por los archivos en orden alfabético.","Por los archivos que se crearon más recientemente."],"a":1,"w":["Un archivo complejo que nadie toca es un riesgo latente: se vigila, pero no se toca sin motivo de negocio. La deuda vive donde se cruzan complejidad y cambio (diapositiva 74). (Distractor plausible: a)."],"e":7},{"n":135,"t":"test","m":["Tema 2","2.5 Revisión estructural","Diaps. 75, 77"],"d":2,"s":["Dos equipos chocan una y otra vez modificando la misma clase y los merges son asfixiantes. ¿Qué diagnóstico y qué acción propone el tema?"],"o":["Hay que fusionar los dos equipos en uno solo.","La clase agrupa dos responsabilidades (Ley de Conway): exigir un refactor bloqueante que la divida según las fronteras de cada equipo.","Es un problema de Git: resolver los conflictos con más cuidado y establecer turnos de edición.","Falta formación: los desarrolladores no saben usar git merge."],"a":1,"w":["El tema insiste en que la falla no es técnica ni de destreza: el archivo agrupa dos responsabilidades. El revisor de élite no parchea el conflicto mecánico (diapositiva 77). (Distractor plausible: c)."],"e":7},{"n":136,"t":"test","m":["Tema 2","2.5 Revisión estructural","Diap. 80"],"d":1,"s":["En la pasada macro encontráis una consulta directa a la base de datos dentro del código de la interfaz web. ¿Qué hacéis?"],"o":["Aprobar, porque la consulta funciona.","Dejar un issue (blocking) y cerrar la revisión sin seguir leyendo el resto del código.","Dejar un suggestion (non-blocking) y continuar con las pasadas meso y micro.","Corregir vosotros mismos la consulta en el PR."],"a":1,"w":["Si la arquitectura está rota, no tiene sentido revisar nombres de variables: el orden importa (diapositiva 80). (Distractor plausible: c)."],"e":7},{"n":137,"t":"test","m":["Tema 2","2.5 Revisión estructural","Diap. 82"],"d":0,"s":["¿Cómo se trata la deuda preexistente que el PR no empeora?"],"o":["Se ignora, porque no la escribió el autor.","Como blocking: no se aprueba hasta que el autor la corrija.","Como nitpick opcional dentro del mismo PR.","Como fuera de alcance: se abre un issue de deuda técnica, sin bloquear el PR."],"a":3,"w":["Es la aplicación de Clean as You Code: se exige calidad al código nuevo, sin obligar a arreglar todo el legado, pero sin olvidarlo (diapositiva 82). (Distractor plausible: b)."],"e":7},{"n":138,"t":"test","m":["Tema 2","2.5 Revisión estructural","Diap. 99"],"d":2,"s":["¿Qué afirmación es correcta sobre DIP, inyección de dependencias e IoC?"],"o":["DIP obliga a crear las dependencias con new dentro del dominio.","Los tres términos son sinónimos.","DIP es un principio de diseño; la inyección de dependencias es una técnica, y un contenedor IoC es una herramienta que automatiza la inyección.","Usar un contenedor IoC como Spring garantiza por sí solo que se cumple el DIP."],"a":2,"w":["La diapositiva 99 lo resume: DIP ≠ DI ≠ IoC container. Se puede usar Spring y seguir teniendo el dominio dependiente de la infraestructura; lo que decide el DIP es hacia dónde apuntan las dependencias. (Distractor plausible: d)."],"e":7},{"n":139,"t":"huecos","m":["Tema 2","2.5 Revisión estructural","Diaps. 72–73"],"d":0,"s":["Completad el texto (sobran dos palabras). Una revisión estructural no pregunta «¿funciona?», sino «¿aguantará el próximo {{1}}?». Su defecto típico es la clase «{{2}}», el acoplamiento o la duplicación, y su coste, si se ignora, es la deuda técnica, que funciona como un interés {{3}}. El código se {{4}} muchas más veces de las que se escribe. La IA generativa {{5}} el problema, porque duplica lógica y acopla capas. Cada hallazgo debe llevar síntoma, principio {{6}} y {{7}} propuesta."],"a":["B","D","C","E","A","I","G"],"w":["Sobran: simple, reduce. La diapositiva 73 dice que la IA amplifica el problema, no que lo reduzca, y la deuda es interés compuesto, no simple."],"b":[{"l":"A","w":"amplifica"},{"l":"B","w":"cambio"},{"l":"C","w":"compuesto"},{"l":"D","w":"Dios"},{"l":"E","w":"lee"},{"l":"F","w":"reduce"},{"l":"G","w":"refactorización"},{"l":"H","w":"simple"},{"l":"I","w":"violado"}],"k":7,"e":7},{"n":140,"t":"huecos","m":["Tema 2","2.5 Revisión estructural","Diaps. 78–79, 84"],"d":1,"s":["Completad el texto sobre cómo se trabaja en la industria (sobran dos palabras). La revisión estructural tiene dos filtros en {{1}}: primero la máquina, con un Quality {{2}}, y después el humano. Antes de pedir revisión, el autor hace un PR pequeño y, si es grande, lo divide en PR {{3}}; analiza en local sin avisos nuevos (Clean as You {{4}}), se autorrevisa y describe el diseño. Acuerdos habituales: primera respuesta en menos de un día {{5}}, sesiones de {{6}} minutos como máximo y, tras dos rondas de desacuerdo, una conversación {{7}} de 15 minutos."],"a":["H","E","C","D","F","B","I"],"w":["Sobran: paralelo, 120. Los filtros van en serie: el humano solo entra si la máquina aprueba lo mecánico. La atención cae a partir de unos 60 minutos (diapositiva 84)."],"b":[{"l":"A","w":"120"},{"l":"B","w":"60"},{"l":"C","w":"apilados"},{"l":"D","w":"Code"},{"l":"E","w":"Gate"},{"l":"F","w":"laborable"},{"l":"G","w":"paralelo"},{"l":"H","w":"serie"},{"l":"I","w":"síncrona"}],"k":7,"e":7},{"n":141,"t":"huecos","m":["Tema 2","2.5 Revisión estructural","Diaps. 85–86"],"d":0,"s":["Completad el texto sobre las métricas de Martin (sobran dos palabras). La abstracción A = Na / {{1}} mide la proporción de clases abstractas e interfaces. La inestabilidad es I = Ce / (Ca + Ce); si I = 0, el módulo es muy {{2}}. La distancia D = |A + I − 1| mide lo lejos que está de la línea de {{3}}. La zona de {{4}} es un módulo concreto y estable del que dependen muchos: es {{5}}. La zona de {{6}} es un módulo abstracto e inestable que casi nadie usa: quizá está {{7}}."],"a":["G","C","B","A","H","F","I"],"w":["Sobran: inestable, flexible. I = 0 significa que todos dependen de él y él de nadie: estable. Un módulo en la zona de dolor es rígido, lo contrario de flexible."],"b":[{"l":"A","w":"dolor"},{"l":"B","w":"equilibrio"},{"l":"C","w":"estable"},{"l":"D","w":"flexible"},{"l":"E","w":"inestable"},{"l":"F","w":"inutilidad"},{"l":"G","w":"Nc"},{"l":"H","w":"rígido"},{"l":"I","w":"sobrando"}],"k":7,"e":7},{"n":142,"t":"huecos","m":["Tema 2","2.5 Revisión estructural","Diaps. 89–90"],"d":1,"s":["Completad el texto sobre código limpio (sobran dos palabras). Los nombres deben revelar la {{1}}: daysSinceLastLogin, mejor que d. Un método de 60 líneas con comentarios que separan pasos se corrige con Extract {{2}}. Un argumento booleano como render(true) indica que la función hace {{3}} cosas. Según la separación comando-consulta, una función cambia el estado o devuelve un valor, nunca {{4}}. La pirámide de if anidados se corrige con cláusulas de {{5}}. Los problemas de código limpio suelen ser non-blocking, salvo que afecten a la {{6}}. Si el linter puede detectarlo, no lo comentéis a mano: pedid que se añada la {{7}} al linter."],"a":["G","H","D","A","F","C","I"],"w":["Sobran: Class, estilo. Extract Class es la cura de una clase grande, no de un método largo. Los problemas de código limpio pasan a blocking cuando afectan a la corrección (excepciones tragadas, efectos ocultos), no al estilo."],"b":[{"l":"A","w":"ambas"},{"l":"B","w":"Class"},{"l":"C","w":"corrección"},{"l":"D","w":"dos"},{"l":"E","w":"estilo"},{"l":"F","w":"guarda"},{"l":"G","w":"intención"},{"l":"H","w":"Method"},{"l":"I","w":"regla"}],"k":7,"e":7},{"n":143,"t":"diag","m":["Tema 2","2.5 Revisión estructural","Diap. 86"],"d":1,"s":["Completad el diagrama de abstracción frente a inestabilidad de Robert C. Martin."],"a":["F","G","C","E","A"],"w":["Sobran: Hotspot, Bus factor. Eje horizontal: inestabilidad; eje vertical: abstracción. La diagonal A + I = 1 es la línea de equilibrio (D = 0). Abajo a la izquierda, la zona de dolor; arriba a la derecha, la de inutilidad (diapositiva 86)."],"b":[{"l":"A","w":"Abstracción (A)"},{"l":"B","w":"Bus factor"},{"l":"C","w":"Equilibrio (D = 0)"},{"l":"D","w":"Hotspot"},{"l":"E","w":"Inestabilidad (I)"},{"l":"F","w":"Zona de dolor"},{"l":"G","w":"Zona de inutilidad"}],"k":5,"e":7},{"n":144,"t":"diag","m":["Tema 2","2.5 Revisión estructural","Diaps. 74–75"],"d":0,"s":["Completad la matriz que usa el revisor para decidir por dónde empezar."],"a":["D","E","C","B"],"w":["Sobran: Zona de dolor, Bus factor. Se cruza la frecuencia de cambio (historial de Git) con la complejidad (SonarQube). Complejo y muy cambiado: hotspot, la prioridad. Complejo y quieto: riesgo latente (diapositivas 74–75)."],"b":[{"l":"A","w":"Bus factor"},{"l":"B","w":"Complejidad (SonarQube)"},{"l":"C","w":"Frecuencia de cambio (git log)"},{"l":"D","w":"Hotspot"},{"l":"E","w":"Riesgo latente"},{"l":"F","w":"Zona de dolor"}],"k":4,"e":7},{"n":145,"t":"ord","m":["Tema 2","2.5 Revisión estructural","Diaps. 78–81"],"d":0,"s":["Ordenad el recorrido completo de una revisión estructural. Escribid las letras en el orden correcto."],"a":["B","A","E","D","C"],"w":["Dos filtros en serie (máquina → humano) y, dentro del humano, de lo grande a lo pequeño: no tiene sentido corregir un nombre dentro de una clase que hay que partir en tres (diapositivas 78–81)."],"it":[{"l":"A","h":"La máquina ejecuta la CI y el Quality Gate"},{"l":"B","h":"El autor deja el PR pequeño, sin avisos nuevos en local, y describe el diseño"},{"l":"C","h":"Pasada micro: funciones, nombres y manejo de errores"},{"l":"D","h":"Pasada meso: clases, módulos y responsabilidades"},{"l":"E","h":"Pasada macro: arquitectura, capas y dependencias"}],"k":5,"e":7},{"n":146,"t":"ord","m":["Tema 2","2.5 Revisión estructural","Diaps. 82, 93"],"d":0,"s":["Ordenad las partes de un comentario estructural bien escrito. Escribid las letras en el orden correcto."],"a":["E","C","F","B","A","D"],"w":["Estructura de la diapositiva 82: <label> [decorations]: <asunto> + síntoma + principio + propuesta. Ejemplo: «issue: Feature Envy — calculateShipping() reads 6 fields of Customer… Move Method to Customer»."],"it":[{"l":"A","h":"Principio violado"},{"l":"B","h":"Síntoma observado"},{"l":"C","h":"Decoración (p. ej., blocking)"},{"l":"D","h":"Refactorización propuesta"},{"l":"E","h":"Label (p. ej., issue)"},{"l":"F","h":"Asunto"}],"k":6,"e":7},{"n":147,"t":"calc","m":["Tema 2","2.5 Revisión estructural","Diap. 85"],"d":0,"s":["El módulo billing tiene 9 módulos que dependen de él (Ca = 9) y él depende de 3 (Ce = 3). ¿Cuál es su inestabilidad?"],"o":["I = 0,25","I = 0,33","I = 0,75","I = 3"],"a":0,"w":["1. ¿Qué pregunta responde? ¿Lo fácil que es que billing cambie por culpa de sus dependencias?","2. Datos con unidades Ca = 9 (aferente: dependen de él). Ce = 3 (eferente: él depende de ellos).","3. Fórmula y por qué I = Ce / (Ca + Ce) Un módulo es inestable cuando depende de muchos (Ce alto) y pocos dependen de él. Dividir entre el total da un valor entre 0 y 1 (diapositiva 85).","4. Sustitución I = 3 / (9 + 3) = 3 / 12 = 0,25","5. Comprobación de sentido Muchos dependen de él y él depende de pocos: debe ser bastante estable, cerca de 0.","6. Interpretación y decisión Por tanto, billing es estable: conviene que sea abstracto para no caer en la zona de dolor.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora c) I = 0,75: 0,75 sale de poner Ca en el numerador (9 / 12): es la fórmula al revés."],"e":7},{"n":148,"t":"calc","m":["Tema 2","2.5 Revisión estructural","Diap. 86"],"d":2,"s":["Un módulo core es totalmente concreto (A = 0), tiene I = 0,1 y de él dependen muchos componentes. ¿Cuánto vale D y en qué zona está?"],"o":["0,1; cerca de la línea de equilibrio","0,9; zona de dolor","0,9; zona de inutilidad","1,1; zona de dolor"],"a":1,"w":["1. ¿Qué pregunta responde? ¿A qué distancia está del equilibrio entre abstracción e inestabilidad, y qué riesgo indica?","2. Datos con unidades A = 0 (sin clases abstractas ni interfaces). I = 0,1 (muy estable).","3. Fórmula y por qué D = |A + I − 1| La línea de equilibrio es A + I = 1; D mide cuánto se aleja el módulo de ella (diapositiva 86).","4. Sustitución A + I − 1 = 0 + 0,1 − 1 = −0,9 D = |−0,9| = 0,9","5. Comprobación de sentido D debe estar entre 0 y 1; 0,9 está muy lejos del equilibrio. A bajo e I bajo es la combinación de la zona de dolor.","6. Interpretación y decisión Por tanto, es rígido: cambiarlo rompe a muchos dependientes. Conviene introducir abstracciones.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora a) 0,1; cerca de la línea de equilibrio: 0,1 sale de olvidar el «− 1» (A + I). La zona de inutilidad corresponde a A alto e I alto, no a este caso."],"e":7},{"n":149,"t":"calc","m":["Tema 2","2.5 Revisión estructural","Diap. 86"],"d":0,"s":["Un módulo tiene 12 clases: 2 interfaces, 1 clase abstracta y 9 clases concretas. ¿Cuál es su abstracción A?"],"o":["A = 0,17","A = 0,25","A = 0,33","A = 0,75"],"a":1,"w":["1. ¿Qué pregunta responde? ¿Qué proporción del módulo son abstracciones?","2. Datos con unidades Na = 2 interfaces + 1 abstracta = 3. Nc = 12 clases en total.","3. Fórmula y por qué A = Na / Nc Na cuenta clases abstractas e interfaces; Nc, todas las clases del módulo (diapositiva 86).","4. Sustitución A = 3 / 12 = 0,25","5. Comprobación de sentido Hay pocas abstracciones respecto al total: A debe estar más cerca de 0 que de 1.","6. Interpretación y decisión Por tanto, el módulo es bastante concreto; si además es estable, vigilad la zona de dolor.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora c) A = 0,33: 0,33 sale de dividir entre las clases concretas (3 / 9) en lugar de entre el total. 0,17 olvida la clase abstracta y 0,75 es la proporción de concretas."],"e":7},{"n":150,"t":"calc","m":["Tema 2","2.5 Revisión estructural","Diaps. 87–88"],"d":1,"s":["Un PR añade 2 400 líneas nuevas, de las que 84 están duplicadas. El repositorio tiene 12 000 líneas. ¿Pasa el Quality Gate Sonar way, que exige duplicación ≤ 3 % en el código nuevo?"],"o":["0,7 %; lo pasa","3,5 %; no lo pasa","3,5 %; lo pasa","35 %; no lo pasa"],"a":1,"w":["1. ¿Qué pregunta responde? ¿Qué porcentaje del código nuevo está duplicado y supera el umbral?","2. Datos con unidades Líneas nuevas = 2 400. Líneas duplicadas en lo nuevo = 84. Umbral: ≤ 3 % en código nuevo. Tamaño del repositorio = 12 000 líneas (no hace falta).","3. Fórmula y por qué % duplicación = líneas duplicadas nuevas / líneas nuevas × 100 Clean as You Code: la métrica se aplica al código nuevo, no a todo el legado (diapositivas 87– 88).","4. Sustitución 84 / 2 400 = 0,035 → 3,5 % 3,5 % > 3 % → el gate falla","5. Comprobación de sentido 3 % de 2 400 son 72 líneas; 84 lo supera, así que debe fallar.","6. Interpretación y decisión Por tanto, el PR no pasa: extraed la lógica repetida antes de pedir revisión humana.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora a) 0,7 %; lo pasa: 0,7 % sale de dividir entre todo el repositorio (84 / 12 000): diluye el problema en el legado y contradice Clean as You Code."],"e":7},{"n":151,"t":"rel","m":["Tema 3","3.1 Elementos del ACS en la era DevSecOps","Diaps. 11–12"],"d":0,"s":["Relacionad cada término del ACS en DevSecOps con su definición. Escribid la letra de la definición junto a cada número (sobran 2 definiciones)."],"a":["H","D","G","E","F","A","I"],"w":["Definiciones de las diapositivas 11–12. Las que sobran describen el SBOM y el DAST, que también están en los conceptos clave, pero no en la lista de la izquierda."],"c":["DevOps","DevSecOps","Rama protegida","Definition of Done","Policy as Code","ADR","Artefacto inmutable"],"df":[{"l":"A","h":"Documento breve que registra una decisión de arquitectura: contexto, opciones, decisión y consecuencias."},{"l":"B","h":"Análisis de la aplicación en ejecución atacándola desde fuera."},{"l":"C","h":"Inventario formal de todos los componentes de un producto, en CycloneDX o SPDX."},{"l":"D","h":"DevOps con la seguridad integrada en cada fase, no añadida al final."},{"l":"E","h":"Lista acordada de condiciones que un trabajo debe cumplir para darse por terminado."},{"l":"F","h":"Reglas de la organización escritas como código ejecutable, por ejemplo con Open Policy Agent."},{"l":"G","h":"Configuración de Git que impide modificar main sin PR, revisión y checks."},{"l":"H","h":"Cultura y prácticas que unen desarrollo y operaciones en un equipo con objetivos compartidos."},{"l":"I","h":"Resultado del build que no se modifica después de crearse."}],"k":7,"e":8},{"n":152,"t":"rel","m":["Tema 3","3.1 Elementos del ACS en la era DevSecOps","Diaps. 20–21"],"d":0,"s":["Relacionad cada rol con su responsabilidad de calidad en un equipo DevSecOps. Escribid la letra de la definición junto a cada número (sobran 2 definiciones)."],"a":["G","C","E","F","I","D","A"],"w":["Es el reparto de la diapositiva 20 («de todos» sin dueño termina siendo de nadie). Las dos frases que sobran describen el modelo antiguo de QA como fase final y una tarea de auditoría que no es de ningún rol del equipo."],"c":["Desarrollador/a","Revisor/a de PR","Tech Lead / Arquitecto","Quality / Platform Engineering","SRE","Security Champion","Product Owner"],"df":[{"l":"A","h":"Acepta el riesgo de negocio y prioriza deuda técnica frente a funcionalidad."},{"l":"B","h":"Certifica el sistema de gestión de calidad ante un organismo externo."},{"l":"C","h":"Bloquea los cambios que incumplen la Definition of Done."},{"l":"D","h":"Referente de seguridad dentro del equipo; prioriza vulnerabilidades."},{"l":"E","h":"Define estándares, ADR y umbrales de los Quality Gates."},{"l":"F","h":"Construye la plataforma de pruebas, CI y métricas."},{"l":"G","h":"Escribe pruebas, mantiene el pipeline verde y responde a sus alertas."},{"l":"H","h":"Ejecuta las pruebas manuales al final, cuando el producto está terminado."},{"l":"I","h":"Define SLOs, gestiona incidentes y el presupuesto de error."}],"k":7,"e":8},{"n":153,"t":"test","m":["Tema 3","3.0 Introducción","Diap. 8"],"d":0,"s":["Según la idea clave del Tema 3, ¿qué pregunta responde el ACS moderno?"],"o":["¿Cuántas herramientas de análisis tiene instaladas el equipo?","¿Se ha alcanzado el 100 % de cobertura de pruebas?","¿Tenemos evidencia suficiente para confiar en este cambio en producción?","¿Ha aprobado el equipo de QA la versión antes de publicarla?"],"a":2,"w":["La calidad no se inspecciona al final: se diseña, s
