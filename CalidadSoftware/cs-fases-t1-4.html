LO del 99,99 % «porque suena bien» y el equipo lo incumple todos los meses. ¿Qué error es y cómo se corrige?"],"o":["El SLA es demasiado alto; hay que subirlo al 100 %.","Es un problema de alertas; basta con silenciarlas.","Un SLO elegido por aspiración; el primer SLO se fija a partir del rendimiento histórico real.","Faltan SLOs; hay que definir uno por cada servidor."],"a":2,"w":["Es el primer error común de la diapositiva 55. Además, se recomiendan entre uno y tres SLOs por viaje crítico, no uno por servidor. (Distractor plausible: d)."],"e":9},{"n":174,"t":"test","m":["Tema 3","3.2 SRE: SLA, SLO, SLI y presupuestos de error","Diaps. 44, 57"],"d":2,"s":["Un cliente pide un SLO del 99,99 % mensual para un servicio que hoy se recupera con una persona de guardia que recibe la alerta y diagnostica a mano. ¿Qué tendríais que cambiar antes de aceptarlo?"],"o":["Automatizar la recuperación: con unos 4,3 minutos de presupuesto al mes no hay tiempo para que un humano reciba la alerta, abra el portátil y diagnostique.","Nada: basta con subir el SLA al mismo valor.","Aumentar el número de personas de guardia para que respondan antes.","Cambiar la ventana de 30 días móviles por una de calendario."],"a":0,"w":["Diapositivas 44 y 57: con 99,99 % el presupuesto es de 4,32 min en 30 días; cada nueve adicional exige redundancia y recuperación automática. Más guardias ayuda, pero ningún humano diagnostica en ese margen. (Distractor plausible: c)."],"e":9},{"n":175,"t":"huecos","m":["Tema 3","3.2 SRE: SLA, SLO, SLI y presupuestos de error","Diaps. 33, 41"],"d":0,"s":["Completad el texto (sobran dos palabras). La disciplina SRE nació en {{1}} en 2003. Se mide un indicador ({{2}}), se fija un objetivo ({{3}}) y la diferencia hasta el 100 % es un presupuesto de {{4}} que el equipo puede gastar en {{5}}. El SLA, en cambio, es un {{6}} con consecuencias. El presupuesto resuelve el conflicto entre desarrollo y operaciones porque deja un {{7}} de riesgo acordado con producto."],"a":["C","H","I","B","D","A","E"],"w":["Sobran: Netflix, SLA. Diapositivas 30, 33 y 41. Netflix es el origen de la Ingeniería del Caos, no de SRE."],"b":[{"l":"A","w":"contrato"},{"l":"B","w":"error"},{"l":"C","w":"Google"},{"l":"D","w":"innovar"},{"l":"E","w":"margen"},{"l":"F","w":"Netflix"},{"l":"G","w":"SLA"},{"l":"H","w":"SLI"},{"l":"I","w":"SLO"}],"k":7,"e":9},{"n":176,"t":"huecos","m":["Tema 3","3.2 SRE: SLA, SLO, SLI y presupuestos de error","Diaps. 37–38"],"d":0,"s":["Completad el texto sobre cómo se calcula un SLI (sobran dos palabras). El SLI es una {{1}} entre eventos buenos y eventos {{2}}. Al dividir, el resultado no depende del {{3}}: un 99,9 % significa lo mismo un martes tranquilo que en el Black Friday. Los 4xx del cliente salen del denominador, salvo un {{4}} provocado por un límite mal dimensionado. Si el SLI sale por encima del {{5}} %, habéis contado como {{6}} eventos que no eran válidos. La definición de evento válido se acuerda con {{7}} y no se cambia sin avisar."],"a":["F","I","H","C","A","D","E"],"w":["Sobran: 404, suma. Diapositivas 31 y 37–38. Un 404 es un error típico del cliente; el 429 es la excepción que sí es culpa del servicio."],"b":[{"l":"A","w":"100"},{"l":"B","w":"404"},{"l":"C","w":"429"},{"l":"D","w":"bueno"},{"l":"E","w":"producto"},{"l":"F","w":"proporción"},{"l":"G","w":"suma"},{"l":"H","w":"tráfico"},{"l":"I","w":"válidos"}],"k":7,"e":9},{"n":177,"t":"huecos","m":["Tema 3","3.2 SRE: SLA, SLO, SLI y presupuestos de error","Diaps. 43–44"],"d":1,"s":["Completad el texto sobre cómo se gasta el presupuesto (sobran dos palabras). La política de presupuesto actúa como un juez {{1}}. El presupuesto no se gasta solo con caídas totales, sino con cada petición {{2}}; por eso se mide mejor en {{3}} que en minutos. Cada nueve adicional reduce el presupuesto a una {{4}} parte. Cuando se agota, se aplica congelación de {{5}}, reasignación de recursos o pausa hasta el {{6}} de la ventana. Si al agotarse no pasa nada, el SLO es {{7}}."],"a":["G","D","C","A","E","I","B"],"w":["Sobran: minutos, quinta. Diapositivas 41, 43–44, 46 y 55. «Minutos» es justo lo que no conviene usar como unidad principal."],"b":[{"l":"A","w":"décima"},{"l":"B","w":"decorativo"},{"l":"C","w":"eventos"},{"l":"D","w":"fallida"},{"l":"E","w":"funcionalidades"},{"l":"F","w":"minutos"},{"l":"G","w":"neutral"},{"l":"H","w":"quinta"},{"l":"I","w":"reinicio"}],"k":7,"e":9},{"n":178,"t":"huecos","m":["Tema 3","3.2 SRE: SLA, SLO, SLI y presupuestos de error","Diaps. 48–51"],"d":1,"s":["Completad el texto sobre las alertas por burn rate (sobran dos palabras). El burn rate es un {{1}} de la velocidad ideal de consumo. Con BR = 1 el presupuesto se agota justo al {{2}} de la ventana; con BR = 10 en una ventana de 30 días, en {{3}} días. Google recomienda paginar con un BR de {{4}} mantenido 1 hora, que consume el {{5}} % del presupuesto. Con BR = {{6}} durante 3 días solo se abre un ticket. Además, se alerta por {{7}}, no por causas: una CPU al 90 % no es un problema si los usuarios están bien."],"a":["G","F","D","B","C","A","H"],"w":["Sobran: 6, sumando. Diapositivas 48–51 y 181. BR = 6 en 6 horas también avisa a la guardia; el ticket corresponde a BR = 1."],"b":[{"l":"A","w":"1"},{"l":"B","w":"14,4"},{"l":"C","w":"2"},{"l":"D","w":"3"},{"l":"E","w":"6"},{"l":"F","w":"final"},{"l":"G","w":"multiplicador"},{"l":"H","w":"síntomas"},{"l":"I","w":"sumando"}],"k":7,"e":9},{"n":179,"t":"diag","m":["Tema 3","3.2 SRE: SLA, SLO, SLI y presupuestos de error","Diaps. 35–36"],"d":0,"s":["Completad la barra que compara el SLI medido con el SLO y el SLA."],"a":["D","F","A","C"],"w":["Sobran: SLI, Penalización. Diapositivas 35–36: el SLA (99,5 %) queda por debajo del SLO (99,9 %); entre ambos está el margen para reaccionar, y entre el SLO y el 100 % está el presupuesto de error. El SLI ya viene marcado."],"b":[{"l":"A","w":"Margen"},{"l":"B","w":"Penalización"},{"l":"C","w":"Presupuesto"},{"l":"D","w":"SLA"},{"l":"E","w":"SLI"},{"l":"F","w":"SLO"}],"k":4,"e":9},{"n":180,"t":"diag","m":["Tema 3","3.2 SRE: SLA, SLO, SLI y presupuestos de error","Diaps. 46–47"],"d":0,"s":["Completad el semáforo de la política de presupuesto de error con la acción de cada banda."],"a":["D","A","E","B"],"w":["Sobran: Subir el SLO un nueve, Desactivar todas las alertas. Es la tabla de la diapositiva 46. Ninguna banda propone cambiar el SLO ni apagar las alertas: el semáforo regula los despliegues."],"b":[{"l":"A","w":"Canary obligatorio y revisión adicional"},{"l":"B","w":"Congelación de funcionalidad"},{"l":"C","w":"Desactivar todas las alertas"},{"l":"D","w":"Despliegue normal; experimentos y caos"},{"l":"E","w":"Solo cambios de bajo riesgo"},{"l":"F","w":"Subir el SLO un nueve"}],"k":4,"e":9},{"n":181,"t":"calc","m":["Tema 3","3.2 SRE: SLA, SLO, SLI y presupuestos de error","Diaps. 37–38"],"d":0,"s":["En un día, una API recibe 2 050 000 peticiones. 50 000 son errores 4xx de clientes que envían datos mal formados y 3 000 son errores 5xx del servidor. ¿Cuál es el SLI de disponibilidad?"],"o":["97,41 %","97,56 %","99,70 %","99,85 %"],"a":3,"w":["1. ¿Qué pregunta responde? ¿Qué proporción de las peticiones válidas se sirvió bien?","2. Datos con unidades Total = 2 050 000 peticiones. 4xx del cliente = 50 000 peticiones (no válidas). 5xx del servidor = 3 000 peticiones (válidas, pero malas).","3. Fórmula y por qué SLI = eventos buenos / eventos válidos × 100 % El SLI mide la experiencia del usuario como proporción de éxitos; los errores del cliente no son responsabilidad del servicio y salen del denominador (diapositiva 37).","4. Sustitución Válidos = 2 050 000 − 50 000 = 2 000 000 peticiones Buenos = 2 000 000 − 3 000 = 1 997 000 peticiones SLI = 1 997 000 / 2 000 000 × 100 % = 99,85 %","5. Comprobación de sentido Está entre 0 y 100 % y es un poco menor que el 100 %: fallaron 15 de cada 10 000.","6. Interpretación y decisión Por tanto, con un SLO del 99,9 % ese día no se cumplió (99,85 % < 99,9 %).","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora a) 97,41 %: 97,41 % sale de contar los 4xx como fallos: 1 997 000 / 2 050 000. Castiga al equipo por errores que no son suyos."],"e":9},{"n":182,"t":"calc","m":["Tema 3","3.2 SRE: SLA, SLO, SLI y presupuestos de error","Diaps. 31, 37"],"d":1,"s":["Una API recibe 1 000 000 de peticiones. 25 000 son errores 4xx de datos mal formados; además hay 5 000 errores 429 provocados por un límite de peticiones mal dimensionado del propio servicio y 1 000 errores 5xx. ¿Cuál es el SLI de disponibilidad?"],"o":["96,90 %","99,38 %","99,49 %","99,90 %"],"a":1,"w":["1. ¿Qué pregunta responde? ¿Qué proporción de las peticiones válidas se sirvió bien, si los 429 son culpa del servicio?","2. Datos con unidades Total = 1 000 000 peticiones. 4xx del cliente = 25 000 (no válidas). 429 del servicio = 5 000 (válidas y malas). 5xx = 1 000 (válidas y malas).","3. Fórmula y por qué SLI = eventos buenos / eventos válidos × 100 % Un 429 causado por un límite mal dimensionado es responsabilidad del servicio: cuenta como evento válido y como fallo (diapositivas 31 y 37).","4. Sustitución Válidos = 1 000 000 − 25 000 = 975 000 peticiones Buenos = 975 000 − 5 000 − 1 000 = 969 000 peticiones SLI = 969 000 / 975 000 × 100 % ≈ 99,38 %","5. Comprobación de sentido Sale por debajo del 99,90 % que daría tratar los 429 como errores del cliente: el límite mal dimensionado tiene un coste visible.","6. Interpretación y decisión Por tanto, el equipo debe corregir el límite de peticiones; esconder los 429 falsearía el SLI.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora d) 99,90 %: 99,90 % sale de excluir también los 429 como si fueran del cliente: 969 000 / 970 000."],"e":9},{"n":183,"t":"calc","m":["Tema 3","3.2 SRE: SLA, SLO, SLI y presupuestos de error","Diaps. 42–43"],"d":0,"s":["Un servicio tiene un SLO del 99,95 % y recibe 4 000 000 de peticiones válidas al mes. ¿Cuántas peticiones fallidas puede permitirse en el mes?"],"o":["200 peticiones","2 000 peticiones","20 000 peticiones","3 998 000 peticiones"],"a":1,"w":["1. ¿Qué pregunta responde? ¿Cuántos fallos caben en el presupuesto de error del mes?","2. Datos con unidades SLO = 99,95 % = 0,9995. N = 4 000 000 peticiones válidas al mes.","3. Fórmula y por qué Presupuesto en eventos = (1 − SLO) · N Lo que queda hasta el 100 % es la fracción que se puede fallar; multiplicada por el número de eventos, da los fallos permitidos (diapositiva 42).","4. Sustitución 1 − 0,9995 = 0,0005 0,0005 × 4 000 000 = 2 000 peticiones","5. Comprobación de sentido Es el 0,05 % de cuatro millones: un número pequeño frente al total, como debe ser.","6. Interpretación y decisión Por tanto, cuando se acerquen los 2 000 fallos en el mes habrá que frenar los despliegues de riesgo.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora d) 3 998 000 peticiones: 3 998 000 sale de multiplicar por el SLO en lugar de por 1 − SLO: son las peticiones buenas exigidas, no las fallidas permitidas."],"e":9},{"n":184,"t":"calc","m":["Tema 3","3.2 SRE: SLA, SLO, SLI y presupuestos de error","Diaps. 42–44"],"d":0,"s":["¿Cuántos minutos de caída total admite un SLO de disponibilidad del 99,5 % en una ventana de 30 días?"],"o":["21,6 min","43,2 min","216 min","2 160 min"],"a":2,"w":["1. ¿Qué pregunta responde? ¿Cuánto tiempo de caída total cabe en el presupuesto de 30 días?","2. Datos con unidades SLO = 99,5 % = 0,995. T = 30 días × 24 h × 60 min = 43 200 min.","3. Fórmula y por qué Presupuesto en tiempo = (1 − SLO) · T La fracción de fallo permitida, aplicada a la duración de la ventana, da los minutos de caída equivalentes (diapositivas 42 y 44).","4. Sustitución 1 − 0,995 = 0,005 0,005 × 43 200 min = 216 min = 3 h 36 min","5. Comprobación de sentido Coincide con la tabla de los nueves (99,5 % → 3 h 36 min) y es cinco veces el de 99,9 % (43,2 min).","6. Interpretación y decisión Por tanto, el servicio dispone de 3 h 36 min al mes para repartir entre caídas, degradaciones y despliegues fallidos.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora a) 21,6 min: 21,6 min sale de pasar mal el porcentaje a fracción (0,0005 en lugar de 0,005): es el presupuesto del 99,95 %."],"e":9},{"n":185,"t":"calc","m":["Tema 3","3.2 SRE: SLA, SLO, SLI y presupuestos de error","Diap. 43"],"d":1,"s":["Con un SLO del 99,9 % en 30 días, una degradación hace fallar el 5 % de las peticiones durante 120 minutos. ¿Qué parte del presupuesto mensual se ha gastado?"],"o":["2,8 %","5 %","13,9 %","277,8 %"],"a":2,"w":["1. ¿Qué pregunta responde? ¿Cuánto del presupuesto mensual consume una degradación parcial?","2. Datos con unidades Presupuesto = 0,001 × 43 200 min = 43,2 min. Fracción que falla = 0,05. Duración = 120 min.","3. Fórmula y por qué Minutos equivalentes = fracción que falla × duración; gasto = minutos equivalentes / presupuesto Una degradación parcial gasta lo mismo que una caída total más corta: 10 % durante 100 min equivale a 10 min de caída (diapositiva 43).","4. Sustitución Minutos equivalentes = 0,05 × 120 min = 6 min Gasto = 6 min / 43,2 min ≈ 0,139 = 13,9 %","5. Comprobación de sentido Menos de una sexta parte del presupuesto: tiene sentido, porque solo falla una de cada veinte peticiones.","6. Interpretación y decisión Por tanto, el incidente es relevante, pero quedan unos 37 minutos; se puede seguir desplegando con cuidado.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora d) 277,8 %: 277,8 % sale de tratar los 120 minutos como caída total: 120 / 43,2. Olvida que solo falla el 5 % de las peticiones."],"e":9},{"n":186,"t":"calc","m":["Tema 3","3.2 SRE: SLA, SLO, SLI y presupuestos de error","Diaps. 49–50"],"d":0,"s":["Un servicio con SLO del 99,9 % en 30 días (T = 720 h) registra en la última hora un 0,3 % de peticiones fallidas. ¿Cuál es el burn rate y en cuánto tiempo se agotaría el presupuesto si nada cambia?"],"o":["BR = 0,3; 720 h","BR = 0,33; 2 160 h","BR = 3; 240 h (10 días)","BR = 30; 24 h"],"a":2,"w":["1. ¿Qué pregunta responde? ¿A qué velocidad se gasta el presupuesto y cuánto tarda en agotarse?","2. Datos con unidades e = 0,3 % = 0,003. 1 − SLO = 0,001. T = 720 h.","3. Fórmula y por qué BR = e / (1 − SLO); t_agotar = T / BR El burn rate es un cociente de velocidades: la tasa real de fallo entre la permitida. Como «tiempo = distancia / velocidad», el presupuesto dura T / BR (diapositiva 49).","4. Sustitución BR = 0,003 / 0,001 = 3 t_agotar = 720 h / 3 = 240 h = 10 días","5. Comprobación de sentido BR > 1, así que se agota antes del final de la ventana: en un tercio de los 30 días.","6. Interpretación y decisión Por tanto, si dura varias horas conviene avisar; mantenido 6 horas gastaría un 2,5 % del presupuesto.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora b) BR = 0,33; 2 160 h: BR = 0,33 sale de invertir el cociente ((1 − SLO) / e); llevaría a pensar que sobra presupuesto."],"e":9},{"n":187,"t":"calc","m":["Tema 3","3.2 SRE: SLA, SLO, SLI y presupuestos de error","Diaps. 49–51"],"d":1,"s":["Un servicio con SLO del 99,9 % en una ventana de 30 días ha tenido un burn rate de 10 durante 3 horas. ¿Qué fracción del presupuesto mensual ha gastado?"],"o":["0,42 %","4,17 %","30 %","100 %"],"a":1,"w":["1. ¿Qué pregunta responde? ¿Qué parte del presupuesto mensual se ha consumido en esas 3 horas?","2. Datos con unidades BR = 10. t = 3 h. T = 30 días = 720 h (misma unidad que t).","3. Fórmula y por qué Fracción gastada = BR · t / T A ritmo BR, el presupuesto entero dura T / BR; en un tiempo t se consume la proporción t / (T / BR) (diapositiva 49).","4. Sustitución Fracción = 10 × 3 h / 720 h = 30 / 720 ≈ 0,0417 = 4,17 %","5. Comprobación de sentido Un BR de 10 agota todo en 72 h; 3 h son 1/24 de eso: 4,17 %.","6. Interpretación y decisión Por tanto, supera el umbral de aviso de 6 horas (5 %) casi por completo; hay que actuar ya.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora d) 100 %: 100 % sale de mezclar unidades: t en horas y T en días (10 × 3 / 30). Siempre en la misma unidad."],"e":9},{"n":188,"t":"calc","m":["Tema 3","3.2 SRE: SLA, SLO, SLI y presupuestos de error","Diaps. 51, 178"],"d":1,"s":["Con un SLO del 99,5 %, queréis una alerta que salte con un burn rate de 6. ¿Qué tasa de error debe escribirse como umbral en la regla de Prometheus?"],"o":["0,08 %","0,6 %","3 %","6 %"],"a":2,"w":["1. ¿Qué pregunta responde? ¿Qué tasa de error corresponde a un burn rate de 6?","2. Datos con unidades BR = 6. 1 − SLO = 1 − 0,995 = 0,005.","3. Fórmula y por qué Umbral = BR × (1 − SLO) Despejando BR = e / (1 − SLO) se obtiene e = BR × (1 − SLO). En el YAML del caso se escribe 14.4 * 0.001 (diapositivas 51 y 178).","4. Sustitución Umbral = 6 × 0,005 = 0,03 = 3 %","5. Comprobación de sentido Seis veces la tasa permitida (0,5 %): 3 %. Si fuera BR = 1, el umbral sería el propio presupuesto.","6. Interpretación y decisión Por tanto, la regla debe decir «error_ratio > 6 * 0.005»; poner directamente 0,5 % equivale a BR = 1.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora a) 0,08 %: 0,08 % sale de dividir el presupuesto entre el BR (0,005 / 6) en lugar de multiplicarlo."],"e":9},{"n":189,"t":"calc","m":["Tema 3","3.2 SRE: SLA, SLO, SLI y presupuestos de error","Diaps. 53–54"],"d":2,"s":["Durante una semana, un servicio con SLO del 99,9 % mensual recibe 5 000 000 de peticiones válidas y falla en 4 500. Suponiendo tráfico constante, ¿qué parte del presupuesto del mes se ha gastado?"],"o":["0,09 %","4,5 %","21 %","90 %"],"a":2,"w":["1. ¿Qué pregunta responde? ¿Qué fracción del presupuesto mensual ha consumido la semana y a qué ritmo?","2. Datos con unidades Peticiones en 7 días = 5 000 000. Fallos = 4 500. SLO = 0,999; ventana = 30 días. Supuesto declarado: tráfico constante.","3. Fórmula y por qué N_mes = N_semana × 30 / 7; presupuesto = (1 − SLO) · N_mes; gasto = fallos / presupuesto El presupuesto es mensual, así que primero se extrapola el tráfico al mes; luego se compara lo gastado con lo permitido (diapositiva 53).","4. Sustitución N_mes = 5 000 000 × 30 / 7 ≈ 21 430 000 peticiones Presupuesto = 0,001 × 21 430 000 ≈ 21 430 fallos Gasto = 4 500 / 21 430 ≈ 0,21 = 21 % Comprobación: e = 4 500 / 5 000 000 = 0,0009 → BR = 0,9; 0,21 / (7/30) ≈ 0,9","5. Comprobación de sentido Ha pasado el 23 % del mes y se ha gastado el 21 %: BR < 1, se gasta un poco más despacio de lo permitido.","6. Interpretación y decisión Por tanto, vamos bien, aunque justos: a este ritmo se terminaría el mes con un 10 % del presupuesto sin gastar; despliegue normal.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora d) 90 %: 90 % sale de confundir el burn rate (0,9) con la fracción gastada. El BR es una velocidad, no una cantidad."],"e":9},{"n":190,"t":"calc","m":["Tema 3","3.2 SRE: SLA, SLO, SLI y presupuestos de error","Diaps. 57, 179–180"],"d":2,"s":["Vuestro servicio depende en serie de tres componentes con disponibilidades del 99,9 %, 99,9 % y 99,95 %. ¿Cuál es la disponibilidad máxima que podéis prometer?"],"o":["99,75 %","99,90 %","99,92 %","99,95 %"],"a":0,"w":["1. ¿Qué pregunta responde? ¿Cuál es el techo de disponibilidad si deben funcionar los tres componentes a la vez?","2. Datos con unidades A₁ = 0,999; A₂ = 0,999; A₃ = 0,9995. Supuesto: fallan de forma independiente.","3. Fórmula y por qué En serie: A = A₁ · A₂ · A₃ Si deben funcionar todos, la probabilidad de que funcione la cadena es el producto de las probabilidades (diapositiva 179).","4. Sustitución A = 0,999 × 0,999 = 0,998001 A = 0,998001 × 0,9995 ≈ 0,997502 = 99,75 %","5. Comprobación de sentido Es menor que el componente más débil (99,9 %): en serie la cadena siempre es peor que cada eslabón.","6. Interpretación y decisión Por tanto, un SLO del 99,9 % sería imposible; el techo es 99,75 % (unos 108 min al mes de presupuesto).","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora c) 99,92 %: 99,92 % es la media de las tres: el error frecuente de la diapositiva 57. La disponibilidad de una cadena se multiplica."],"e":9},{"n":191,"t":"calc","m":["Tema 3","3.2 SRE: SLA, SLO, SLI y presupuestos de error","Diaps. 179–180"],"d":1,"s":["Para no depender de un único proveedor, ponéis en paralelo dos proveedores redundantes, cada uno con una disponibilidad del 99,5 %. ¿Cuál es la disponibilidad teórica del conjunto?"],"o":["99,0 %","99,5 %","99,9975 %","100 %"],"a":2,"w":["1. ¿Qué pregunta responde? ¿Con qué probabilidad funciona al menos uno de los dos proveedores?","2. Datos con unidades A₁ = A₂ = 0,995. Supuesto: fallan de forma independiente.","3. Fórmula y por qué En paralelo: A = 1 − (1 − A₁) · (1 − A₂) El conjunto solo cae si caen los dos a la vez; esa probabilidad es el producto de las indisponibilidades (diapositiva 179).","4. Sustitución 1 − A₁ = 0,005; 1 − A₂ = 0,005 A = 1 − 0,005 × 0,005 = 1 − 0,000025 = 0,999975 = 99,9975 %","5. Comprobación de sentido Mayor que cada proveedor por separado y menor que el 100 %: la redundancia mejora, pero nunca llega a la perfección.","6. Interpretación y decisión Por tanto, la redundancia sube el techo teórico, aunque el valor real será menor si los fallos no son independientes.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora a) 99,0 %: 99,0 % sale de multiplicar como si estuvieran en serie (0,995 × 0,995): justo lo contrario de la redundancia."],"e":9},{"n":192,"t":"rel","m":["Tema 3","3.3 Tareas, metas y métricas del ACS","Diaps. 68–69"],"d":0,"s":["Relacionad cada métrica DORA o concepto con su definición. Escribid la letra de la definición junto a cada número (sobran 2 definiciones)."],"a":["B","H","A","I","F","C","E"],"w":["Diapositivas 61, 68 y 69. Sobran la cobertura de código y el marco SPACE, que complementan DORA pero no son métricas DORA."],"c":["Deployment frequency","Lead time for changes","Failed deployment recovery time","Change failure rate","Deployment rework rate","Ley de Goodhart","Métrica de vanidad"],"df":[{"l":"A","h":"Cuánto se tarda en recuperarse de un despliegue fallido."},{"l":"B","h":"Con qué frecuencia se despliega a producción."},{"l":"C","h":"Cuando una medida se convierte en objetivo, deja de ser una buena medida."},{"l":"D","h":"Porcentaje de líneas o ramas que ejecutan las pruebas."},{"l":"E","h":"Métrica que queda bien en una presentación, pero no ayuda a decidir."},{"l":"F","h":"Proporción de despliegues no planificados para corregir problemas de producción."},{"l":"G","h":"Marco que mide satisfacción, rendimiento, actividad, comunicación y flujo del desarrollador."},{"l":"H","h":"Tiempo desde el commit hasta que el cambio está en producción."},{"l":"I","h":"Proporción de despliegues que causan un fallo en producción."}],"k":7,"e":10},{"n":193,"t":"rel","m":["Tema 3","3.3 Tareas, metas y métricas del ACS","Diaps. 59–61, 193"],"d":0,"s":["Relacionad cada término de medición de la calidad con su definición. Escribid la letra de la definición junto a cada número (sobran 2 definiciones)."],"a":["I","C","G","F","A","B","H"],"w":["Diapositivas 59–61 y 193. Sobran la mediana y el incidente, que están en los conceptos clave, pero no en la lista."],"c":["Indicador","Densidad de defectos","DRE","Defecto escapado","Deuda técnica","Prueba inestable (flaky)","Churn"],"df":[{"l":"A","h":"Coste futuro de atajos o diseños deficientes que habrá que corregir."},{"l":"B","h":"Prueba que a veces pasa y a veces falla sin que cambie el código."},{"l":"C","h":"Defectos por cada mil líneas de código."},{"l":"D","h":"Evento no planificado que degrada o interrumpe el servicio y exige respuesta."},{"l":"E","h":"Valor central de una serie ordenada."},{"l":"F","h":"Defecto que llega al cliente sin haber sido detectado internamente."},{"l":"G","h":"Defectos encontrados antes de la entrega entre los encontrados antes y después."},{"l":"H","h":"Frecuencia y volumen de cambios de un archivo."},{"l":"I","h":"Métrica interpretada respecto a una referencia: 12 defectos, el doble que el trimestre pasado."}],"k":7,"e":10},{"n":194,"t":"rel","m":["Tema 3","3.4 Quality Gates en pipelines automatizados","Diaps. 76–78"],"d":1,"s":["Relacionad cada concepto de los Quality Gates con su definición. Escribid la letra de la definición junto a cada número (sobran 2 definiciones)."],"a":["B","G","I","A","H","D","C"],"w":["Diapositivas 76–78. Sobran CODEOWNERS y el linter. Ojo con el pre-commit: es el gate más barato, pero se puede saltar con -- no-verify, por eso lo crítico se repite en CI."],"c":["Required check","Hook de pre-commit","Security hotspot","Fail fast","Break-glass","Promoción de artefactos","Cuarentena de pruebas"],"df":[{"l":"A","h":"Ordenar los controles para fallar lo antes posible con el menor coste."},{"l":"B","h":"Resultado de un job en el PR que bloquea el merge si está en rojo."},{"l":"C","h":"Sacar temporalmente una prueba inestable del gate obligatorio, con una tarea para corregirla."},{"l":"D","h":"Mover el mismo artefacto de preproducción a producción sin reconstruirlo."},{"l":"E","h":"Herramienta que analiza el código buscando errores de estilo y patrones peligrosos."},{"l":"F","h":"Fichero que asigna responsables a carpetas del repositorio."},{"l":"G","h":"Script que Git ejecuta en el equipo del desarrollador antes de cada commit."},{"l":"H","h":"Procedimiento de emergencia para saltarse un control, con aprobación y registro."},{"l":"I","h":"Código sensible marcado para revisión humana, sin afirmar que sea vulnerable."}],"k":7,"e":10},{"n":195,"t":"test","m":["Tema 3","3.3 Tareas, metas y métricas del ACS","Diaps. 66–67"],"d":0,"s":["Según el método GQM, ¿por dónde se empieza a elegir las métricas de un equipo?"],"o":["Por copiar las métricas de Google.","Por la meta; después se formulan las preguntas y solo entonces se eligen las métricas.","Por medir todo lo que se pueda y filtrar después.","Por las métricas que ofrece la herramienta; después se buscan metas que encajen."],"a":1,"w":["GQM (Goal–Question–Metric) evita medir por medir (diapositiva 66). Empezar por la herramienta es justo el error que el método combate. (Distractor plausible: d)."],"e":10},{"n":196,"t":"test","m":["Tema 3","3.3 Tareas, metas y métricas del ACS","Diaps. 69, 189"],"d":0,"s":["Vuestro jefe quiere premiar a la persona que más cobertura añada. ¿Qué le respondéis?"],"o":["Que mejor premiar a quien despliegue más veces.","Que es buena idea si además se premia a quien más commits haga.","Que, por la ley de Goodhart, aparecerán pruebas sin aserciones; propongo objetivos de equipo sobre defectos escapados.","Que es buena idea porque la cobertura mide la calidad de las pruebas."],"a":2,"w":["Diapositivas 69 y 189: si se premia la cobertura, aparecen pruebas sin aserciones. Premiar commits o despliegues tiene el mismo problema y, además, usa métricas para evaluar individuos. (Distractor plausible: b)."],"e":10},{"n":197,"t":"test","m":["Tema 3","3.3 Tareas, metas y métricas del ACS","Diaps. 71–72"],"d":0,"s":["La frecuencia de despliegue de un equipo se ha duplicado. Según la lectura en parejas, ¿qué debéis vigilar también?"],"o":["La change failure rate y la rework rate.","El tamaño del equipo.","La cobertura de pruebas.","El número de commits por persona."],"a":0,"w":["Desplegar más a menudo con más fallos no es progreso (diapositiva 71). La cobertura se empareja con la puntuación de mutación, no con la frecuencia. (Distractor plausible: c)."],"e":10},{"n":198,"t":"test","m":["Tema 3","3.4 Quality Gates en pipelines automatizados","Diap. 75"],"d":0,"s":["¿Qué convierte un informe de análisis en un Quality Gate?"],"o":["Que lo revise un responsable cada mes.","Que su resultado decida si el cambio avanza: si no cumple el criterio, el cambio se detiene.","Que se publique en un panel visible para todo el equipo.","Que el informe se genere automáticamente en cada commit."],"a":1,"w":["Idea clave de la diapositiva 75: un control que no bloquea es solo una sugerencia. Generarlo de forma automática es necesario, pero no suficiente. (Distractor plausible: d)."],"e":10},{"n":199,"t":"test","m":["Tema 3","3.4 Quality Gates en pipelines automatizados","Diaps. 88, 90"],"d":1,"s":["Acabáis de introducir un análisis SAST y el 30 % de sus bloqueos son falsos positivos. ¿Qué tipo de gate debe ser por ahora?"],"o":["Ninguno: se elimina el análisis.","Blando: informa sin bloquear mientras se calibra, porque supera el 10–20 % de falsos positivos.","Duro: bloquea siempre, porque la seguridad no admite excepciones.","Duro solo los viernes."],"a":1,"w":["Regla práctica de la diapositiva 88: si más del 10–20 % de los bloqueos son falsos positivos, el control todavía no está listo para ser duro. Un gate injusto acaba saltado o desactivado. (Distractor plausible: c)."],"e":10},{"n":200,"t":"test","m":["Tema 3","3.4 Quality Gates en pipelines automatizados","Diap. 84"],"d":1,"s":["Heredáis un sistema con mucha deuda técnica. ¿Qué propone el principio Clean as You Code?"],"o":["Desactivar los gates en el código heredado para no frenar.","Exigir calidad solo al código nuevo o modificado: la deuda existente no empeora y la parte limpia crece con cada cambio.","Exigir el mismo umbral a todo el código desde el primer día.","Congelar el desarrollo hasta eliminar toda la deuda existente."],"a":1,"w":["Diapositiva 84. Exigir el umbral a todo el código heredado bloquearía cualquier cambio; no exigir nada dejaría crecer la deuda. (Distractor plausible: d)."],"e":10},{"n":201,"t":"test","m":["Tema 3","3.4 Quality Gates en pipelines automatizados","Diaps. 86, 194, 196"],"d":2,"s":["Un workflow usa una acción de terceros referenciada por etiqueta (@0.28.0). ¿Por qué el tema recomienda fijarla al SHA completo de un commit?"],"o":["Porque una etiqueta se puede mover a otro código, y el SHA no: en marzo de 2026 se reescribieron las etiquetas de trivy-action para que apuntaran a código malicioso con acceso a los secretos.","Porque el SHA hace que el workflow se ejecute más rápido al evitar la descarga.","Porque así la acción se actualiza sola a la última versión.","Porque GitHub no admite etiquetas en las acciones."],"a":0,"w":["Diapositivas 194 y 196: el SHA fija la acción a un contenido inmutable. Es una práctica muy recomendada (diapositiva 86) contra los ataques a la cadena de suministro. (Distractor plausible: b)."],"e":10},{"n":202,"t":"huecos","m":["Tema 3","3.3 Tareas, metas y métricas del ACS","Diaps. 59–60"],"d":0,"s":["Completad el texto (sobran dos palabras). Una métrica es un valor medido; un {{1}} es esa métrica interpretada respecto a una referencia. La pirámide de pruebas de Mike {{2}} recomienda muchas pruebas {{3}} rápidas y pocas E2E lentas. La cobertura dice qué no se prueba, nunca si lo probado está bien {{4}}. La prueba de mutación mide la calidad real de las {{5}}. DORA usa {{6}} porque unos pocos valores extremos no las distorsionan. La deuda técnica es una metáfora de Ward {{7}}."],"a":["E","A","I","B","H","F","C"],"w":["Sobran: medias, Fowler. Diapositivas 59–60. Las medias son justo lo que se deja arrastrar por los valores extremos."],"b":[{"l":"A","w":"Cohn"},{"l":"B","w":"comprobado"},{"l":"C","w":"Cunningham"},{"l":"D","w":"Fowler"},{"l":"E","w":"indicador"},{"l":"F","w":"medianas"},{"l":"G","w":"medias"},{"l":"H","w":"pruebas"},{"l":"I","w":"unitarias"}],"k":7,"e":10},{"n":203,"t":"huecos","m":["Tema 3","3.3 Tareas, metas y métricas del ACS","Diaps. 62, 64–65"],"d":0,"s":["Completad el texto sobre tareas y metas del ACS (sobran dos palabras). El estándar IEEE {{1}}-2014 recoge el núcleo de tareas del ACS. Hoy el plan de ACS es un documento {{2}} en el repositorio, revisado cada trimestre. Las inspecciones formales programadas se han convertido en revisión de {{3}} y de diseño; las auditorías manuales, en Quality {{4}} automáticos; y el comité de control de cambios, en PR + pipeline + feature {{5}}. La cuarta meta del ACS es la {{6}} del control de calidad, que se mide con la {{7}}."],"a":["A","I","H","F","E","D","C"],"w":["Sobran: 9001, muerto. Diapositivas 62 y 64–65. ISO 9001 es otra norma (3.7), y el «documento muerto» es el error que el plan vivo evita."],"b":[{"l":"A","w":"730"},{"l":"B","w":"9001"},{"l":"C","w":"DRE"},{"l":"D","w":"eficacia"},{"l":"E","w":"flags"},{"l":"F","w":"Gates"},{"l":"G","w":"muerto"},{"l":"H","w":"PR"},{"l":"I","w":"vivo"}],"k":7,"e":10},{"n":204,"t":"huecos","m":["Tema 3","3.3 Tareas, metas y métricas del ACS","Diaps. 68–69, 73, 190–191"],"d":1,"s":["Completad el texto sobre las métricas DORA (sobran dos palabras). Las métricas DORA miden a la vez velocidad y {{1}}, y su investigación demuestra que no hay que elegir entre ambas. En 2024 DORA añadió la tasa de {{2}}: despliegues no planificados para corregir problemas de producción. El antiguo MTTR se llama hoy failed deployment {{3}} time. El lead time for changes es la {{4}} de (hora del despliegue − hora del {{5}}). Conviene recopilarlas de forma automática desde Git, CI y el sistema de {{6}}. DORA advierte que sus métricas son de equipo y nunca deben usarse para evaluar a {{7}}."],"a":["B","H","G","F","A","C","D"],"w":["Sobran: media, ticket. Diapositivas 68–69, 73 y 190–191. La media se deja arrastrar por los cambios lentos; el lead time se cuenta desde el commit, no desde el ticket."],"b":[{"l":"A","w":"commit"},{"l":"B","w":"estabilidad"},{"l":"C","w":"incidentes"},{"l":"D","w":"individuos"},{"l":"E","w":"media"},{"l":"F","w":"mediana"},{"l":"G","w":"recovery"},{"l":"H","w":"retrabajo"},{"l":"I","w":"ticket"}],"k":7,"e":10},{"n":205,"t":"huecos","m":["Tema 3","3.4 Quality Gates en pipelines automatizados","Diaps. 75, 79, 81"],"d":0,"s":["Completad el texto sobre la anatomía de un gate (sobran dos palabras). Todo gate tiene cinco atributos: {{1}} (¿qué se mide?), {{2}} (¿qué valor es aceptable?), {{3}} (¿qué pasa si falla?), responsable y {{4}} (¿dónde queda constancia?). Un gate {{5}} bloquea siempre; uno {{6}} informa sin bloquear y se usa al introducir un control nuevo. «Formal» también se refiere a los métodos formales, como {{7}}, que Amazon Web Services usa desde 2011 en S3 y DynamoDB."],"a":["C","I","A","E","D","B","H"],"w":["Sobran: opinión, Kubernetes. Diapositivas 79 y 81. Kubernetes orquesta contenedores; no es un método formal."],"b":[{"l":"A","w":"acción"},{"l":"B","w":"blando"},{"l":"C","w":"criterio"},{"l":"D","w":"duro"},{"l":"E","w":"evidencia"},{"l":"F","w":"Kubernetes"},{"l":"G","w":"opinión"},{"l":"H","w":"TLA+"},{"l":"I","w":"umbral"}],"k":7,"e":10},{"n":206,"t":"huecos","m":["Tema 3","3.4 Quality Gates en pipelines automatizados","Diaps. 85, 88–89"],"d":1,"s":["Completad el texto sobre errores y criterio con los gates (sobran dos palabras). Un gate que nadie puede saltarse ni en una emergencia necesita un procedimiento {{1}} documentado. Las pruebas {{2}} no deben estar en un gate duro: se ponen en cuarentena. La etapa de commit debería responder en menos de {{3}} minutos. Exigir un 100 % de {{4}} genera pruebas inútiles: el umbral se {{5}} con datos del propio proyecto. La gravedad no es {{6}}: si una CVE crítica está en código no alcanzable, se documenta en un {{7}} con una excepción que caduca."],"a":["C","G","A","E","D","H","I"],"w":["Sobran: 90, copia. Diapositivas 85 y 88–89. Un pipeline de 90 minutos es justo el error, y el umbral nunca se copia."],"b":[{"l":"A","w":"10"},{"l":"B","w":"90"},{"l":"C","w":"break-glass"},{"l":"D","w":"calibra"},{"l":"E","w":"cobertura"},{"l":"F","w":"copia"},{"l":"G","w":"inestables"},{"l":"H","w":"riesgo"},{"l":"I","w":"VEX"}],"k":7,"e":10},{"n":207,"t":"huecos","m":["Tema 3","3.4 Quality Gates en pipelines automatizados","Diaps. 194–196"],"d":2,"s":["Completad el texto sobre el workflow de GitHub Actions del caso práctico (sobran dos palabras). needs: g1-ci hace que solo se analice la calidad si el código {{1}} y pasan las pruebas. fetch-depth: 0 descarga el {{2}} para que Sonar distinga código nuevo de antiguo. --error y exit-code: '1' convierten el hallazgo en un {{3}} del job. -Dsonar.qualitygate.wait=true espera el {{4}} del Quality Gate. El token se guarda en {{5}} y no en el repositorio. Si g1-ci y g2-sonar no se marcan como required status {{6}} en la protección de rama, el pipeline es solo un {{7}}."],"a":["C","E","D","I","H","B","F"],"w":["Sobran: aviso, README. Diapositivas 194–196. Sin exit-code la herramienta solo daría un aviso y el pipeline seguiría verde."],"b":[{"l":"A","w":"aviso"},{"l":"B","w":"checks"},{"l":"C","w":"compila"},{"l":"D","w":"fallo"},{"l":"E","w":"historial"},{"l":"F","w":"informe"},{"l":"G","w":"README"},{"l":"H","w":"secrets"},{"l":"I","w":"veredicto"}],"k":7,"e":10},{"n":208,"t":"diag","m":["Tema 3","3.4 Quality Gates en pipelines automatizados","Diap. 83"],"d":1,"s":["Completad el pipeline de referencia con el nombre de los gates G1 a G5."],"a":["C","F","E","B","G"],"w":["Sobran: Auditoría ISO, Congelación de código. Es el pipeline G0–G6 de la diapositiva 83. Ni la auditoría ISO ni la congelación de código son gates del pipeline."],"b":[{"l":"A","w":"Auditoría ISO"},{"l":"B","w":"Cadena de suministro"},{"l":"C","w":"CI del PR"},{"l":"D","w":"Congelación de código"},{"l":"E","w":"Revisión humana"},{"l":"F","w":"SonarQube"},{"l":"G","w":"Validación"}],"k":5,"e":10},{"n":209,"t":"diag","m":["Tema 3","3.4 Quality Gates en pipelines automatizados","Diaps. 81–82"],"d":0,"s":["Completad los cinco atributos de un Quality Gate."],"a":["B","G","A","F","C"],"w":["Sobran: Presupuesto, Opinión. Diapositivas 81–82: criterio (cobertura del código nuevo), umbral (≥ 80 %), acción (bloquear o avisar), responsable (Tech Lead con ADR) y evidencia (informe adjunto al PR)."],"b":[{"l":"A","w":"Acción"},{"l":"B","w":"Criterio"},{"l":"C","w":"Evidencia"},{"l":"D","w":"Opinión"},{"l":"E","w":"Presupuesto"},{"l":"F","w":"Responsable"},{"l":"G","w":"Umbral"}],"k":5,"e":10},{"n":210,"t":"calc","m":["Tema 3","3.3 Tareas, metas y métricas del ACS","Diaps. 65, 186, 193"],"d":0,"s":["En una versión se encontraron 342 defectos antes de producción y 18 en los 90 días siguientes al lanzamiento. ¿Cuál es la DRE?"],"o":["5 %","90 %","94,74 %","95 %"],"a":3,"w":["1. ¿Qué pregunta responde? ¿Qué proporción de los defectos detectamos antes de producción?","2. Datos con unidades Antes = 342 defectos. Después = 18 defectos (medidos tras 90 días).","3. Fórmula y por qué DRE = antes / (antes + después) × 100 % Mide la eficacia del filtro: lo que se retuvo dentro sobre el total de defectos que había (diapositivas 65 y 193).","4. Sustitución Total = 342 + 18 = 360 defectos DRE = 342 / 360 × 100 % = 95 %","5. Comprobación de sentido Está entre 0 y 100 %; escapa 1 de cada 20 defectos, justo en el umbral de los equipos maduros.","6. Interpretación y decisión Por tanto, el equipo está en el nivel de élite (≥ 95 %), siempre que se haya medido tras un periodo fijo y no al día siguiente.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora c) 94,74 %: 94,74 % sale de restar en lugar de sumar ((342 − 18) / 342): el denominador debe ser el total de defectos."],"e":10},{"n":211,"t":"calc","m":["Tema 3","3.3 Tareas, metas y métricas del ACS","Diaps. 183–185"],"d":1,"s":["Una herramienta de mutación genera 300 mutantes; 12 son equivalentes y las pruebas eliminan 216. ¿Cuál es la puntuación de mutación?"],"o":["25 %","72 %","75 %","96 %"],"a":2,"w":["1. ¿Qué pregunta responde? ¿Qué proporción de los mutantes detectables detectan nuestras pruebas?","2. Datos con unidades Generados = 300 mutantes. Equivalentes = 12 (indetectables). Eliminados = 216.","3. Fórmula y por qué Mutación = eliminados / (generados − equivalentes) × 100 % Un mutante equivalente no cambia el comportamiento y ninguna prueba puede detectarlo; si no se resta, la puntuación sale injustamente baja (diapositiva 184).","4. Sustitución Detectables = 300 − 12 = 288 mutantes Mutación = 216 / 288 × 100 % = 75 %","5. Comprobación de sentido Sobreviven 72 de 288 mutantes: una cuarta parte de la lógica no la vigila ninguna prueba.","6. Interpretación y decisión Por tanto, con un mutationThreshold de 70 el build pasaría, pero conviene revisar los 72 mutantes vivos del código crítico.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora b) 72 %: 72 % sale de dividir entre los 300 generados sin restar los equivalentes (216 / 300)."],"e":10},{"n":212,"t":"calc","m":["Tema 3","3.3 Tareas, metas y métricas del ACS","Diap. 184"],"d":1,"s":["Un proyecto tiene 20 000 líneas. Con el valor por defecto de SonarQube (30 min por línea) y una remediación estimada de 750 h, ¿cuál es el ratio de deuda técnica y su rating?"],"o":["0,75 % (rating A)","3,75 % (rating A)","7,5 % (rating B)","15 % (rating C)"],"a":2,"w":["1. ¿Qué pregunta responde? ¿Cuánto costaría arreglar la deuda comparado con lo que costó escribir el código?","2. Datos con unidades Líneas = 20 000. Coste por línea = 30 min = 0,5 h. Remediación = 750 h.","3. Fórmula y por qué Ratio = coste de remediación / coste de desarrollo × 100 % Compara lo que cuesta arreglar con lo que costó construir; SonarQube estima el desarrollo con 30 min por línea (diapositiva 184).","4. Sustitución Desarrollo = 20 000 × 0,5 h = 10 000 h Ratio = 750 h / 10 000 h × 100 % = 7,5 %","5. Comprobación de sentido Las dos cantidades están en horas y el resultado es un porcentaje entre el 6 % y el 10 %.","6. Interpretación y decisión Por tanto, el rating es B (6–10 %); para llegar a A habría que bajar la remediación por debajo de 500 h.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora b) 3,75 % (rating A): 3,75 % sale de tomar 1 h por línea (20 000 h) en lugar de 30 min: subestima la deuda y da un rating A falso."],"e":10},{"n":213,"t":"calc","m":["Tema 3","3.3 Tareas, metas y métricas del ACS","Diaps. 68, 190–191"],"d":0,"s":["En un mes, un equipo hace 36 despliegues: 4 causaron un incidente y 6 fueron despliegues no planificados para corregir algo de producción. ¿Cuáles son la change failure rate y la rework rate?"],"o":["CFR = 4 %; rework = 6 %","CFR = 11,1 %; rework = 16,7 %","CFR = 16,7 %; rework = 11,1 %","CFR = 40 %; rework = 60 %"],"a":1,"w":["1. ¿Qué pregunta responde? ¿Qué proporción de despliegues causa fallos y cuál obliga a corregir?","2. Datos con unidades Despliegues = 36. Con incidente = 4. No planificados = 6.","3. Fórmula y por qué CFR = con incidente / despliegues; rework = no planificados / despliegues Son proporciones de los mismos despliegues: una mide los que fallan y otra los que hay que rehacer (diapositivas 68 y 190).","4. Sustitución CFR = 4 / 36 ≈ 0,111 = 11,1 % Rework = 6 / 36 ≈ 0,167 = 16,7 %","5. Comprobación de sentido La rework rate sale mayor que la CFR (6 > 4), como es habitual: incluye correcciones que no llegan a incidente formal.","6. Interpretación y decisión Por tanto, 1 de cada 6 despliegues es para arreglar algo: hay que reforzar la calidad de cada cambio, no desplegar menos.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora c) CFR = 16,7 %; rework = 11,1 %: Los valores intercambiados salen de confundir qué mide cada métrica: la CFR cuenta incidentes; la rework, despliegues no planificados."],"e":10},{"n":214,"t":"calc","m":["Tema 3","3.3 Tareas, metas y métricas del ACS","Diaps. 60, 191–192"],"d":0,"s":["Los tiempos de entrega de siete cambios fueron 3, 1, 50, 2, 6, 4 y 30 horas. ¿Qué valor debe informarse como lead time for changes según DORA?"],"o":["2 h","4 h","13,71 h","50 h"],"a":1,"w":["1. ¿Qué pregunta responde? ¿Cuál es el tiempo de entrega típico de un cambio?","2. Datos con unidades Tiempos = 3, 1, 50, 2, 6, 4 y 30 h (n = 7).","3. Fórmula y por qué Lead time = mediana de (hora en producción − hora del commit) DORA usa la mediana porque unos pocos valores extremos no la distorsionan (diapositivas 60 y 191).","4. Sustitución Ordenados: 1, 2, 3, 4, 6, 30, 50 h Con n = 7, la mediana es el 4.º valor: 4 h","5. Comprobación de sentido Cinco de los siete cambios tardaron 6 h o menos; 4 h describe bien el caso típico.","6. Interpretación y decisión Por tanto, se informa 4 h; los dos cambios de 30 y 50 h se analizan aparte como casos extremos.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora c) 13,71 h: 13,71 h es la media (96 / 7): dos cambios lentos la arrastran hacia arriba."],"e":10},{"n":215,"t":"rel","m":["Tema 3","3.5 ACS estadístico y Machine Learning","Diaps. 93–95"],"d":1,"s":["Relacionad cada concepto del ACS estadístico con su definición. Escribid la letra de la defi "Una vulnerabilidad: una CVE publicada.","Un error: la acción humana equivocada.","Un fallo: el comportamiento incorrecto observable en ejecución.","Un defecto: la imperfección del código."],"a":2,"w":["Diapositiva 120: el olvido es el error, la línea sin comprobación es el defecto y el 500 que ve el usuario es el fallo. La fiabilidad se mide sobre fallos. (Distractor plausible: d)."],"e":11},{"n":224,"t":"test","m":["Tema 3","3.8 El plan de ACS para despliegues continuos","Diap. 163"],"d":1,"s":["Una empresa B2B tiene 50 clientes y quiere desplegar con poco riesgo. ¿Por qué no es buena idea un canary automático y qué haríais?"],"o":["Porque con pocos clientes se puede desplegar sin estrategia.","Porque el canary es demasiado caro; mejor un rolling update sin vigilancia.","Porque un 5 % de casi nada no da señal estadística; mejor blue-green o feature flags por cliente.","Porque el canary solo funciona en aplicaciones móviles."],"a":2,"w":["Diapositiva 163: el canary necesita mucho tráfico y métricas fiables. Con 50 clientes no hay señal en minutos. (Distractor plausible: b)."],"e":11},{"n":225,"t":"huecos","m":["Tema 3","3.5 ACS estadístico y Machine Learning","Diaps. 96–97, 99, 101–102, 110"],"d":0,"s":["Completad el texto (sobran dos palabras). Pressman describe el ACS estadístico así: se clasifican los defectos, se rastrea cada uno hasta su causa {{1}} y se aplica el principio de {{2}} para corregir primero las pocas causas {{3}}. El Pareto mira hacia atrás; el ML permite mirar hacia {{4}} y cambio a cambio. El historial se etiqueta con {{5}}, que usa git blame. Las características más predictivas son sorprendentemente {{6}}. El modelo se evalúa con una división {{7}}: entrenar con el pasado y probar con el futuro."],"a":["E","D","I","C","G","F","H"],"w":["Sobran: atrás, aleatorio. Diapositivas 96–97, 99, 101–102 y 110. Una división aleatoria mezclaría pasado y futuro y daría resultados falsamente buenos."],"b":[{"l":"A","w":"aleatorio"},{"l":"B","w":"atrás"},{"l tando el orden temporal"},{"l":"D","h":"Entrenar un clasificador"},{"l":"E","h":"Etiquetar el historial con SZZ"}],"k":5,"e":11},{"n":236,"t":"ord","m":["Tema 3","3.6 Confiabilidad e ingeniería del caos","Diaps. 119, 141"],"d":0,"s":["Ordenad lo que se hace durante un incidente real. Escribid las letras en el orden correcto."],"a":["D","B","A","E","C"],"w":["Diapositivas 119 y 141: primero se mitiga y la causa se analiza después; el post-mortem cierra el ciclo."],"it":[{"l":"A","h":"Mitigar el daño (revertir o desactivar un flag)"},{"l":"B","h":"Nombrar un comandante del incidente"},{"l":"C","h":"Escribir el post-mortem sin culpa"},{"l":"D","h":"Declarar el incidente pronto"},{"l":"E","h":"Comunicar con regularidad a los afectados"}],"k":5,"e":11},{"n":237,"t":"calc","m":["Tema 3","3.6 Confiabilidad e ingeniería del caos","Diaps. 122–123"],"d":0,"s":["Un servicio funciona de media 720 h entre fallos y tarda 90 minutos en recuperarse. ¿Cuál es su disponibilidad?"],"o":["88,89 %","98,00 %","99,79 %","99,99 %"],"a":2,"w":["1. ¿Qué pregunta responde? ¿Qué parte del tiempo está operativo el servicio?","2. Datos con unidades MTTF = 720 h. MTTR = 90 min = 1,5 h (todo a horas).","3. Fórmula y por qué A = MTTF / (MTTF + MTTR) La vida del sistema es un ciclo: funciona MTTF y está parado MTTR; la disponibilidad es la parte útil del ciclo (diapositiva 122).","4. Sustitución MTTR = 90 min / 60 = 1,5 h A = 720 / (720 + 1,5) = 720 / 721,5 ≈ 0,99792 = 99,79 %","5. Comprobación de sentido Está justo por debajo del 100 % y por debajo del 99,72 % que tendría con 2 h de MTTR: tiene sentido.","6. Interpretación y decisión Por tanto, cumpliría un SLO del 99,5 %, pero no uno del 99,9 %.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora a) 88,89 %: 88,89 % sale de mezclar unidades: 720 h con 90 min (720 / 810). Es el error frecuente de la diapositiva 122."],"e":11},{"n":238,"t":"calc","m":["Tema 3","3.6 Confiabilidad e ingeniería del caos","Diaps. 123–124, 141"],"d":2,"s":["Un servicio tiene MTTF = 500 h y MTTR = 4 h. Podéis elegir una sola mejora: A) duplicar el MTTF a 1 000 h o B) bajar el MTTR a 1 h. ¿Cuál da más disponibilidad?"],"o":["Las dos dan 99,21 %","B: 99,80 % frente a 99,60 % de A","A: 99,80 % frente a 99,60 % de B","A: 99,90 % frente a 99,50 % de B"],"a":1,"w":["1. ¿Qué pregunta responde? ¿Qué palanca mejora más la disponibilidad: fallar menos o recuperarse antes?","2. Datos con unidades Actual: MTTF = 500 h; MTTR = 4 h. A: MTTF = 1 000 h; MTTR = 4 h. B: MTTF = 500 h; MTTR = 1 h.","3. Fórmula y por qué A = MTTF / (MTTF + MTTR) Las dos estrategias cambian una sola palanca del ciclo; se calcula la disponibilidad de cada escenario y se comparan (diapositiva 123).","4. Sustitución Actual: 500 / 504 ≈ 99,21 % A: 1 000 / 1 004 ≈ 99,60 % B: 500 / 501 ≈ 99,80 %","5. Comprobación de sentido Las dos mejoran el 99,21 % actual. Dividir el MTTR entre 4 equivale a multiplicar el MTTF por 4, por eso B gana a A.","6. Interpretación y decisión Por tanto, B: recuperarse rápido (reversión en un clic, flags, runbooks) rinde más y suele costar menos, salvo en sistemas con daños irreversibles.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora c) A: 99,80 % frente a 99,60 % de B: El resultado contrario sale de intercambiar las palancas al sustituir: aplicar el MTTR de 1 h al escenario A y el MTTF de 1 000 h al B."],"e":11},{"n":239,"t":"calc","m":["Tema 3","3.5 ACS estadístico y Machine Learning","Diaps. 96–98"],"d":0,"s":["Se han clasificado 500 defectos por causa: A 60, B 160, C 30, D 120, E 40 y F 90. Aplicando el análisis de Pareto, ¿cuántas causas hacen falta para alcanzar al menos el 80 % de los defectos?"],"o":["2 causas (56 %)","3 causas (74 %)","4 causas (86 %)","5 causas (82 %)"],"a":2,"w":["1. ¿Qué pregunta responde? ¿Cuáles son las pocas causas vitales que explican al menos el 80 % de los defectos?","2. Datos con unidades Total = 500 defectos. A = 60; B = 160; C = 30; D = 120; E = 40; F = 90.","3. Fórmula y por qué Ordenar de mayor a menor; % de cada causa = defectos / total; acumular hasta llegar al 80 % Pareto busca la minoría de causas que produce la mayoría de los efectos: solo se ve si se ordenan primero (diapositiva 97).","4. Sustitución Orden: B 160, D 120, F 90, A 60, E 40, C 30 Porcentajes: 32 %, 24 %, 18 %, 12 %, 8 %, 6 % Acumulado: 32 %, 56 %, 74 %, 86 % (cuarta causa) → se alcanza el 80 %","5. Comprobación de sentido Cuatro de seis causas explican el 86 %: es una tendencia de Pareto, no un 80/20 exacto.","6. Interpretación y decisión Por tanto, se corrigen primero B, D, F y A; C y E quedan para después.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora d) 5 causas (82 %): 5 causas (82 %) sale de acumular en el orden en que vienen los datos (A, B, C, D, E) sin ordenarlos."],"e":11},{"n":240,"t":"calc","m":["Tema 3","3.5 ACS estadístico y Machine Learning","Diaps. 200–202"],"d":1,"s":["De 2 000 commits, 100 introdujeron un defecto. Un modelo marca 160 commits como de riesgo y, de esos, 64 eran realmente defectuosos. ¿Cuáles son su precisión y su exhaustividad?"],"o":["Precisión 8 %; exhaustividad 64 %","Precisión 40 %; exhaustividad 64 %","Precisión 40 %; exhaustividad 3,2 %","Precisión 64 %; exhaustividad 40 %"],"a":1,"w":["1. ¿Qué pregunta responde? Cuando el modelo da la alarma, ¿cuántas veces acierta? ¿Y cuántos defectuosos detecta?","2. Datos con unidades Total = 2 000 commits. Defectuosos = 100. Marcados = 160. VP = 64.","3. Fórmula y por qué Precisión = VP / (VP + FP); exhaustividad = VP / (VP + FN) La precisión mira las alarmas; la exhaustividad mira los defectuosos reales (diapositiva 200).","4. Sustitución FP = 160 − 64 = 96; FN = 100 − 64 = 36 Precisión = 64 / 160 = 0,40 = 40 % Exhaustividad = 64 / 100 = 0,64 = 64 %","5. Comprobación de sentido VN = 2 000 − 64 − 96 − 36 = 1 804; las cuatro casillas suman 2 000. La exactitud (93,4 %) no informa de nada útil.","6. Interpretación y decisión Por tanto, con 6 de cada 10 alarmas falsas, el modelo sirve para priorizar la revisión, no para bloquear s pasos de la prueba del camino básico. Escribid las letras en el orden correcto."],"a":["D","A","B","C","E"],"w":["Diapositivas 30 y 36: V(G) da el número de caminos básicos y cada camino necesita una prueba."],"it":[{"l":"A","h":"Contar las decisiones (o las aristas y los nodos)"},{"l":"B","h":"Calcular V(G)"},{"l":"C","h":"Identificar los caminos linealmente independientes"},{"l":"D","h":"Dibujar el grafo de flujo de la función"},{"l":"E","h":"Diseñar una prueba por camino"}],"k":5,"e":12},{"n":265,"t":"calc","m":["Tema 4","4.1 Shift-left y shift-right","Diap. 25"],"d":0,"s":["Un servicio recibe T = 8 000 reservas/h. Un defecto hace fallar el 10 % de las reservas que lo ven. Con un canary al 5 % y una ventana de 15 minutos hasta revertir, ¿cuántas reservas fallan?"],"o":["0,5 reservas","10 reservas","40 reservas","800 reservas"],"a":1,"w":["1. ¿Qué pregunta responde? ¿Cuántas reservas fallan durante el canary antes de revertir?","2. Datos con unidades T = 8 000 reservas/h. p = 0,10. f = 0,05. w = 15 min = 0,25 h.","3. Fórmula y por qué Fallidas = T × f × p × w Del tráfico solo una fracción ve la versión nueva; de esa, solo una parte falla, y solo durante la ventana hasta revertir (diapositiva 25).","4. Sustitución Fallidas = 8 000 × 0,05 × 0,10 × 0,25 = 10 reservas","5. Comprobación de sentido Las unidades cuadran (reservas/h × h). Si p fuera 0, no fallaría nada.","6. Interpretación y decisión Por tanto, el canary limita el daño a 10 reservas; con un despliegue completo de una hora serían 800.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora c) 40 reservas: 40 reservas sale de olvidar la ventana w: 8 000 × 0,05 × 0,10 son reservas fallidas por hora, no en 15 minutos."],"e":12},{"n":266,"t":"calc","m":["Tema 4","4.1 Shift-left y shift-right","Diap. 25"],"d":2,"s":["Un despliegue completo (f = 1) tarda 1,5 h en detectarse y revertirse. Con canary al 2 % y análisis automático, la ventana baja a 0,25 h. Con el mismo tráfico y la misma tasa de error, ¿cuántas veces menos daño hace el canary?"],"o":["6 veces","50 veces","75 veces","300 veces"],"a":3,"w":["1. ¿Qué pregunta responde? ¿Por cuánto se divide el daño al pasar del despliegue completo al canary?","2. Datos con unidades Completo: f = 1; w = 1,5 h. Canary: f = 0,02; w = 0,25 h. T y p iguales en los dos casos.","3. Fórmula y por qué Cociente = (T · f₁ · p · w₁) / (T · f₂ · p · w₂) = (f₁ / f₂) · (w₁ / w₂) Es un producto de factores; T y p se cancelan, así que el canary gana a la vez por exponer menos y por reaccionar antes (diapositiva 25).","4. Sustitución f₁ / f₂ = 1 / 0,02 = 50 w₁ / w₂ = 1,5 / 0,25 = 6 Cociente = 50 × 6 = 300","5. Comprobación de sentido Mayor que cada factor por separado: los dos efectos se multiplican, como el 20 × 3,75 = 75 del tema.","6. Interpretación y decisión Por tanto, automatizar la detección y la reversión multiplica el beneficio de exponer poco tráfico.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora b) 50 veces: 50 veces sale de comparar solo la fracción expuesta y olvidar que la ventana también se reduce."],"e":12},{"n":267,"t":"calc","m":["Tema 4","4.2 Software convencional","Diaps. 33–34"],"d":0,"s":["Una reserva de hotel admite de 1 a 30 noches: de 1 a 6, tarifa normal; de 7 a 30, tarifa semanal. Fuera de ese rango se rechaza. ¿Cuántos casos exige el análisis de valores límite de dos valores?"],"o":["3 casos","4 casos","6 casos","8 casos"],"a":2,"w":["1. ¿Qué pregunta responde? ¿Cuántos valores hay que probar para cubrir todas las fronteras con dos valores por frontera?","2. Datos con unidades Clases: inválida (< 1), 1–6, 7–30, inválida (> 30). Fronteras: 0|1, 6|7 y 30|31 → 3 fronteras.","3. Fórmula y por qué Casos = 2 × fronteras Cada frontera separa dos clases y se prueba el último valor de una y el primero de la siguiente (diapositiva 34).","4. Sustitución Casos = 2 × 3 = 6: 0, 1, 6, 7, 30 y 31","5. Comprobación de sentido Cuatro clases tienen tres fronteras; dos valores por frontera dan seis casos distintos.","6. Interpretación y decisión Por tanto, 6 pruebas parametrizadas cubren las fronteras de la entrada «noches».","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora a) 3 casos: 3 casos sale de contar las fronteras sin multiplicar por 2: se prueba un solo lado de cada frontera."],"e":12},{"n":268,"t":"calc","m":["Tema 4","4.2 Software convencional","Diap. 34"],"d":2,"s":["Para la misma entrada (1–6 normal, 7–30 semanal, el resto inválido), ¿cuántos valores distintos exige el análisis de tres valores (cada límite válido con sus dos vecinos)?"],"o":["6 valores","9 valores","10 valores","12 valores"],"a":2,"w":["1. ¿Qué pregunta responde? ¿Cuántos valores distintos salen al probar cada límite válido con sus dos vecinos?","2. Datos con unidades Límites válidos: 1, 6, 7 y 30.","3. Fórmula y por qué Valores = unión de {límite − 1, límite, límite + 1} para cada límite válido, sin repetir Es el método de tres valores de la diapositiva 34; los vecinos de límites contiguos (6 y 7) se solapan y no se cuentan dos veces.","4. Sustitución 1 → 0, 1, 2; 6 → 5, 6, 7; 7 → 6, 7, 8; 30 → 29, 30, 31 Unión: 0, 1, 2, 5, 6, 7, 8, 29, 30, 31 → 10 valores","5. Comprobación de sentido Más que los 6 del análisis de dos valores y menos que 4 × 3 = 12: los solapes entre 6 y 7 lo explican.","6. Interpretación y decisión Por tanto, el análisis de tres valores añade 4 casos: más caro y más exhaustivo.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora d) 12 valores: 12 valores sale de multiplicar 4 límites × 3 sin eliminar los repetidos (6 y 7 aparecen dos veces)."],"e":12},{"n":269,"t":"calc","m":["Tema 4","4.2 Software convencional","Diaps. 30, 36"],"d":0,"s":["El grafo de flujo de una función tiene E = 11 aristas y N = 9 nodos. ¿Cuál es su complejidad ciclomática?"],"o":["V(G) = 2","V(G) = 3","V(G) = 4","V(G) = 20"],"a":2,"w":["1. ¿Qué pregunta responde? ¿Cuántos caminos linealmente independientes hay que probar?","2. Datos con unidades E = 11 aristas. N = 9 nodos.","3. Fórmula y por qué V(G) = E − N + 2 Es la fórmula de McCabe (1976) sobre el grafo de flujo; da el número mínimo de pruebas para cubrir los caminos básicos (diapositiva 30).","4. Sustitución V(G) = 11 − 9 + 2 = 4","5. Comprobación de sentido Equivale a 3 decisiones binarias + 1, como la función porcentaje_descuento del tema.","6. Interpretación y decisión Por tanto, se diseñan al menos 4 pruebas, una por camino básico.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora a) V(G) = 2: V(G) = 2 sale de olvidar el «+ 2» de la fórmula (E − N)."],"e":12},{"n":270,"t":"calc","m":["Tema 4","4.2 Software convencional","Diaps. 30, 36"],"d":0,"s":["Una función tiene cuatro decisiones binarias: dos if, un while y un operador &&. ¿Cuál es su complejidad ciclomática?"],"o":["V(G) = 3","V(G) = 4","V(G) = 5","V(G) = 8"],"a":2,"w":["1. ¿Qué pregunta responde? ¿Cuántos caminos básicos tiene la función?","2. Datos con unidades Decisiones binarias = 4 (if, if, while, &&).","3. Fórmula y por qué V(G) = decisiones binarias + 1 Cada decisión binaria añade un camino independiente al camino base (diapositivas 30 y 36).","4. Sustitución V(G) = 4 + 1 = 5","5. Comprobación de sentido Con 0 decisiones habría un solo camino (V(G) = 1); con cuatro, cinco.","6. Interpretación y decisión Por tanto, la prueba del camino básico exige al menos 5 casos.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora b) V(G) = 4: V(G) = 4 sale de contar las decisiones y olvidar el «+ 1» del camino base."],"e":12},{"n":271,"t":"calc","m":["Tema 4","4.2 Software convencional","Diap. 41"],"d":1,"s":["Una suite tiene 2 000 pruebas unitarias de 5 ms, 400 de integración de 200 ms y 50 E2E de 20 s, ejecutadas en serie. ¿Cuánto tarda?"],"o":["1 000 s","1 090 s","10 900 s","91 000 s"],"a":1,"w":["1. ¿Qué pregunta responde? ¿Cuánto tarda la suite completa en serie?","2. Datos con unidades Unitarias: 2 000 × 5 ms = 2 000 × 0,005 s. Integración: 400 × 0,200 s. E2E: 50 × 20 s.","3. Fórmula y por qué Tiempo = Σ (pruebas del nivel × duración media del nivel) Cada nivel aporta su número de pruebas por su coste; todo en la misma unidad (diapositiva 41).","4. Sustitución Unitarias: 2 000 × 0,005 s = 10 s Integración: 400 × 0,2 s = 80 s E2E: 50 × 20 s = 1 000 s Total = 10 + 80 + 1 000 = 1 090 s ≈ 18 min","5. Comprobación de sentido Las E2E son solo el 2 % de las pruebas, pero aportan el 92 % del tiempo: son la palanca.","6. Interpretación y decisión Por tanto, para acelerar la suite hay que actuar sobre las E2E (menos, o en paralelo).","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora d) 91 000 s: 91 000 s sale de no convertir los milisegundos a segundos (2 000 × 5 + 400 × 200 + 50 × 20)."],"e":12},{"n":272,"t":"calc","m":["Tema 4","4.2 Software convencional","Diap. 41"],"d":2,"s":["En la suite anterior (10 s de unitarias, 80 s de integración y 1 000 s de E2E), repartís las E2E en 8 navegadores en paralelo y el resto sigue en serie. ¿Cuánto tarda ahora?"],"o":["125 s","136 s","215 s","1 000 s"],"a":2,"w":["1. ¿Qué pregunta responde? ¿Cuánto tarda la suite si solo se paralelizan las E2E?","2. Datos con unidades Unitarias = 10 s. Integración = 80 s. E2E = 1 000 s en 8 navegadores.","3. Fórmula y por qué Tiempo = unitarias + integración + E2E / navegadores Solo las E2E se reparten; los demás niveles siguen sumando lo mismo (diapositiva 41: la pirámide baja a unos 176 s con 8 navegadores).","4. Sustitución E2E en paralelo = 1 000 / 8 = 125 s Total = 10 + 80 + 125 = 215 s","5. Comprobación de sentido Baja de 1 090 s a 215 s: unas 5 veces, menos que 8 porque la parte en serie no se acelera.","6. Interpretación y decisión Por tanto, paralelizar las E2E convierte una suite de 18 min en una de unos 3,6 min, apta como gate de PR.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora b) 136 s: 136 s sale de dividir toda la suite entre 8 (1 090 / 8), como si también se paralelizaran las unitarias y las de integración."],"e":12},{"n":273,"t":"rel","m":["Tema 4","4.3 Software orientado a objetos","Diap. 47"],"d":0,"s":["Relacionad cada concepto de las pruebas orientadas a objetos con su definición. Escribid la letra de la definición junto a cada número (sobran 2 definiciones)."],"a":["I","E","H","F","D","G","C"],"w":["Diapositiva 47. Sobran la prueba intermitente y la prueba de componente, que son conceptos de 4.4."],"c":["Encapsulamiento","Prueba basada en estado","Prueba basada en interacción","LSP","Prueba de contrato abstracta","Doble de prueba","Prueba frágil"],"df":[{"l":"A","h":"Monta un componente de interfaz aislado en un navegador o DOM simulado."},{"l":"B","h":"Prueba que unas veces pasa y otras falla con el mismo código."},{"l":"C","h":"Falla al cambiar la implementación aunque el comportamiento siga siendo correcto."},{"l":"D","h":"Batería escrita una vez contra una interfaz y ejecutada con cada implementación."},{"l":"E","h":"Observa el resultado final: valor devuelto u objeto guardado."},{"l":"F","h":"Un subtipo debe poder usarse donde se espera el tipo base sin alterar la corrección."},{"l":"G","h":"Objeto que sustituye a un colaborador real."},{"l":"H","h":"Comprueba que se llamó a un colaborador de cierta forma."},{"l":"I","h":"El objeto oculta su estado e implementación y solo expone una interfaz pública."}],"k":7,"e":13},{"n":274,"t":"rel","m":["Tema 4","4.3 Software orientado a objetos","Diaps. 54–56"],"d":0,"s":["Relacionad cada doble de prueba o escuela con su descripción. Escribid la letra de la definición junto a cada número (sobran 2 definiciones)."],"a":["D","F","A","E","H","C","I"],"w":["Diapositivas 54–56. Sobran el driver (integración ascendente, 4.2) y el navegador headless (4.4)."],"c":["Dummy","Stub","Spy","Mock","Fake","Escuela clásica","Escuela mockista"],"df":[{"l":"A","h":"Registra cómo se le llamó y puede delegar en el real."},{"l":"B","h":"Navegador sin ventana visible, controlado por programa."},{"l":"C","h":"Usa objetos reales o fakes y comprueba el estado."},{"l":"D","h":"Rellena un parámetro y nunca se usa."},{"l":"E","h":"Lleva expectativas sobre las llamadas y falla si no se cumplen."},{"l":"F","h":"Devuelve respuestas preparadas para forzar un camino."},{"l":"G","h":"Programa que llama al componente, le pasa datos y recoge resultados."},{"l":"H","h":"Implementación funcional simplificada, como un repositorio en memoria."},{"l":"I","h":"Sustituye cada colaborador por un mock y comprueba interacciones."}],"k":7,"e":13},{"n":275,"t":"rel","m":["Tema 4","4.4 Webapps y API","Diaps. 62, 71"],"d":0,"s":["Relacionad cada concepto de las pruebas web con su definición. Escribid la letra de la definición junto a cada número (sobran 2 definiciones)."],"a":["E","H","B","G","A","D","I"],"w":["Diapositivas 62 y 71. Las dos que sobran son antipatrones: la espera fija y el localizador frágil."],"c":["Prueba de componente","Navegador headless","Accesibilidad","OpenAPI y JSON Schema","p99","Prueba intermitente","Aserción web-first"],"df":[{"l":"A","h":"Valor por debajo del cual está el 99 % de las mediciones de latencia."},{"l":"B","h":"Grado en que personas con discapacidad pueden usar el producto, medido con WCAG."},{"l":"C","h":"Espera fija de cinco segundos antes de comprobar."},{"l":"D","h":"Prueba que unas veces pasa y otras falla con el mismo código."},{"l":"E","h":"Monta un componente aislado y comprueba su comportamiento; es la «unitaria» del frontend."},{"l":"F","h":"Localizar un elemento por su clase CSS."},{"l":"G","h":"Especificación de una API HTTP y descripción formal de la forma de un JSON."},{"l":"H","h":"Navegador sin ventana visible, controlado por programa."},{"l":"I","h":"Comprobación que reintenta hasta cumplirse o hasta que vence el plazo."}],"k":7,"e":13},{"n":276,"t":"rel","m":["Tema 4","4.3 Software orientado a objetos","4.4 Webapps y API","Diaps. 58, 74"],"d":1,"s":["Relacionad cada herramienta gratuita con su uso. Escribid la letra de la definición junto a cada número (sobran 2 definiciones)."],"a":["H","I","A","G","B","C","E"],"w":["Diapositivas 58 y 74. Sobran Argo Rollouts y PIT, que aparecen en 4.1 y 4.2."],"c":["Playwright","Testing Library","axe-core","Schemathesis","k6","WireMock","ArchUnit"],"df":[{"l":"A","h":"Infracciones de accesibilidad WCAG."},{"l":"B","h":"Pruebas de carga con umbrales."},{"l":"C","h":"Simular respuestas HTTP de un tercero."},{"l":"D","h":"Canary con análisis automático en Kubernetes."},{"l":"E","h":"Pruebas de arquitectura, como «el dominio no importa adaptadores»."},{"l":"F","h":"Pruebas de mutación."},{"l":"G","h":"Fuzzing de una API a partir de su OpenAPI."},{"l":"H","h":"Componentes y E2E con espera automática."},{"l":"I","h":"Componentes React o Vue en un DOM simulado."}],"k":7,"e":13},{"n":277,"t":"test","m":["Tema 4","4.3 Software orientado a objetos","Diap. 48"],"d":0,"s":["Sentís la necesidad de escribir una prueba para un método privado. ¿Qué indica eso según el tema?"],"o":["Nada: los métodos privados se prueban igual que los públicos.","Que el método tiene una responsabilidad propia y debería extraerse a una clase con su propia interfaz pública.","Que hay que probarlo con reflexión para mejorar la cobertura.","Que hay que hacerlo público solo durante las pruebas."],"a":1,"w":["Diapositiva 48: las pruebas no deben romper el encapsulamiento. Probarlo con reflexión acopla la prueba al interior (diapositiva 59). (Distractor plausible: c)."],"e":13},{"n":278,"t":"test","m":["Tema 4","4.3 Software orientado a objetos","Diap. 49"],"d":0,"s":["Refactorizáis el interior de una clase sin cambiar lo que hace y una prueba se rompe porque comprobaba el orden exacto de las llamadas internas. ¿Qué tipo de prueba es?"],"o":["Una prueba intermitente: falla de forma aleatoria.","Una prueba frágil: prueba la implementación en lugar del comportamiento.","Una prueba robusta: ha detectado un defecto real.","Una prueba de contrato abstracta."],"a":1,"w":["Diapositiva 49: comprobad el resultado observable (valor devuelto, estado guardado o mensaje enviado al exterior). No es intermitente: falla siempre con el nuevo código. (Distractor plausible: a)."],"e":13},{"n":279,"t":"test","m":["Tema 4","4.3 Software orientado a objetos","Diaps. 50–51"],"d":1,"s":["Pinguino hereda de Ave, que promete volar(), y lanza una excepción al volar. ¿Cuál es la corrección que propone el tema?"],"o":["Borrar la prueba heredada que falla con Pinguino.","Hacer que Pinguino.volar() no haga nada y devuelva éxito.","Capturar la excepción en todo el código que hace volar a un ave.","Que solo AveVoladora prometa volar() y que todas las aves prometan desplazarse()."],"a":3,"w":["Diapositivas 50–51: el defecto está en el diseño (viola LSP) y la prueba heredada lo revela. Que volar() no haga nada en silencio sigue rompiendo la promesa del tipo base. (Distractor plausible: c)."],"e":13},{"n":280,"t":"test","m":["Tema 4","4.3 Software orientado a objetos","Diaps. 52–53"],"d":0,"s":["Un fixture parametrizado ejecuta 3 pruebas de contrato con 2 implementaciones de la pasarela. ¿Qué pasa al añadir una tercera pasarela?"],"o":["Las ejecuciones siguen siendo 6.","Hay que crear un mock por cada prueba.","Hay que copiar las tres pruebas para la nueva pasarela.","Basta con añadirla a params: se pasa de 6 a 9 ejecuciones sin duplicar código."],"a":3,"w":["Diapositivas 52–53: tres pruebas escritas una vez y dos implementaciones dan 6 ejecuciones; una tercera pasarela solo se añade a params. (Distractor plausible: c)."],"e":13},{"n":281,"t":"test","m":["Tema 4","4.3 Software orientado a objetos","Diaps. 54–55"],"d":0,"s":["Sustituís la base de datos por un RepositorioMemoria que guarda y lee de un diccionario. ¿Qué tipo de doble es?"],"o":["Un fake.","Un driver.","Un dummy.","Un mock."],"a":0,"w":["Diapositiva 55: «mock» no es un nombre genérico. Un repositorio en memoria con comportamiento real simplificado es un fake. (Distractor plausible: d)."],"e":13},{"n":282,"t":"test","m":["Tema 4","4.3 Software orientado a objetos","Diaps. 56, 60"],"d":1,"s":["¿Cuándo está justificado comprobar la interacción con un mock en lugar del estado?"],"o":["Cuando la llamada es el propio efecto, como cobrar en una pasarela o enviar una notificación.","Siempre: la escuela mockista es la recomendada por defecto.","Cuando el colaborador es un repositorio con estado.","Cuando la clase tiene métodos privados."],"a":0,"w":["Regla práctica de las diapositivas 56 y 60: estado por defecto; interacción solo cuando el efecto es la propia llamada a un sistema externo. (Distractor plausible: b)."],"e":13},{"n":283,"t":"test","m":["Tema 4","4.3 Software orientado a objetos","Diap. 60"],"d":2,"s":["Un caso de uso usa un calculador de descuentos vuestro, sin efectos externos, y un repositorio lento con estado. Según el criterio del tema, ¿qué usáis en las pruebas?"],"o":["Ningún doble: todo real, incluida la base de datos de producción.","El calculador real y un fake del repositorio validado con el mismo contrato que el real.","Un mock para cada uno, con expectativas sobre todas sus llamadas.","El calculador real y un mock del repositorio que compruebe cada consulta."],"a":1,"w":["Diapositiva 60: si es vuestro y sin efectos externos, el real; si tiene estado y es lento, un fake con contrato; mock solo si la llamada es el efecto. El distractor mockea un repositorio, cuyo efecto es el estado. (Distractor plausible: c)."],"e":13},{"n":284,"t":"test","m":["Tema 4","4.4 Webapps y API","Diap. 64"],"d":0,"s":["¿Qué localizador recomienda el tema para pulsar el botón «Pagar» en una prueba de Playwright?"],"o":["Un XPath absoluto desde la raíz del documento.","Esperar 5 segundos y pulsar en unas coordenadas fijas.","page.get_by_role(\"button\", name=\"Pagar\")","page.locator(\"div.form > div:nth-child(3) > button\")"],"a":2,"w":["Diapositiva 64: se localiza por rol y etiqueta accesible, como lo usa una persona. El selector CSS depende de la estructura, que cambia sin cambiar la conducta. (Distractor plausible: d)."],"e":13},{"n":285,"t":"test","m":["Tema 4","4.4 Webapps y API","Diap. 65"],"d":1,"s":["Vuestra herramienta axe-core no encuentra ninguna infracción en la página de pago. ¿Cumplís con la European Accessibility Act?"],"o":["No, porque la EAA solo se aplica desde 2030.","No necesariamente: la ley exige que el servicio sea accesible y las herramientas detectan solo en torno al 57 % de los problemas; hace falta revisión humana.","Sí, porque la ley solo exige pruebas automáticas.","Sí: cero infracciones automáticas equivale a cumplir WCAG 2.1 AA."],"a":1,"w":["Diapositiva 65: orden lógico, textos alternativos con sentido o uso con lector de pantalla requieren revisión humana. La ley se aplica desde el 28 de junio de 2025. (Distractor plausible: d)."],"e":13},{"n":286,"t":"test","m":["Tema 4","4.4 Webapps y API","Diaps. 69–70"],"d":0,"s":["En una prueba de carga, el 95 % de las peticiones tarda 120 ms y el 5 % tarda 3 s. ¿Por qué no basta con la media?"],"o":["Porque la media (unos 264 ms) parece aceptable y oculta que 1 de cada 20 usuarios espera 3 segundos; se fijan umbrales sobre percentiles.","Porque la media no se puede calcular en k6.","Porque la media siempre es mayor que el p99.","Porque la latencia no se mide en las pruebas de carga."],"a":0,"w":["Diapositivas 69–70. En k6 se escribe un umbral como p(99)<500 para que falle el job si no se cumple el SLI. (Distractor plausible: c)."],"e":13},{"n":287,"t":"test","m":["Tema 4","4.4 Webapps y API","Diap. 73"],"d":2,"s":["Un equipo «arregla» la intermitencia reintentando cada prueba fallida una vez, y la suite pasa del 22 % al 99,25 % de ejecuciones verdes. ¿Qué riesgo corre?"],"o":["Ocultar defectos reales intermitentes, como condiciones de carrera; el reintento es un parche temporal y cada prueba que solo pasa al reintentar va a cuarentena con responsable y fecha.","Que la cobertura baje a la mitad.","Que la suite tarde el doble en todas las ejecuciones.","Ninguno: el 99,25 % demuestra que el problema está resuelto."],"a":0,"w":["Diapositiva 73: un reintento baja la probabilidad efectiva de fallo de 0,005 a 0,000025, pero esconde los fallos que solo aparecen a veces. (Distractor plausible: d)."
