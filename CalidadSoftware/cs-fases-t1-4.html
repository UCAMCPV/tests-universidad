"l":"E","w":"5xx"},{"l":"F","w":"99"},{"l":"G","w":"duplicado"},{"l":"H","w":"esquema"},{"l":"I","w":"negocio"}],"k":7,"e":13},{"n":295,"t":"huecos","m":["Tema 4","4.4 Webapps y API","Diaps. 71–73"],"d":0,"s":["Completad el texto sobre la intermitencia (sobran dos palabras). Google publicó en 2016 que alrededor del {{1}} % de las ejecuciones de sus pruebas daban un resultado intermitente. En la web, la causa típica son las esperas {{2}}: con sleep(5), si la página tarda 5,1 s la prueba {{3}}. La solución es esperar a una {{4}}: las aserciones web-{{5}} reintentan hasta cumplirse o vencer el plazo. Los reintentos son un parche {{6}}: cada prueba que solo pasa al reintentar va a {{7}} con responsable y fecha."],"a":["A","G","F","C","H","I","D"],"w":["Sobran: 16, definitivo. Diapositivas 71–73. El 16 % es la proporción de pruebas con algo de intermitencia, no de ejecuciones."],"b":[{"l":"A","w":"1,5"},{"l":"B","w":"16"},{"l":"C","w":"condición"},{"l":"D","w":"cuarentena"},{"l":"E","w":"definitivo"},{"l":"F","w":"falla"},{"l":"G","w":"fijas"},{"l":"H","w":"first"},{"l":"I","w":"temporal"}],"k":7,"e":13},{"n":296,"t":"diag","m":["Tema 4","4.3 Software orientado a objetos","Diaps. 54–55"],"d":0,"s":["Completad los cinco dobles de prueba de Meszaros, de menos a más comportamiento."],"a":["B","G","F","D","C"],"w":["Sobran: Driver, Proxy. Diapositivas 54–55: dummy, stub, spy, mock y fake. El driver pertenece a la integración ascendente."],"b":[{"l":"A","w":"Driver"},{"l":"B","w":"Dummy"},{"l":"C","w":"Fake"},{"l":"D","w":"Mock"},{"l":"E","w":"Proxy"},{"l":"F","w":"Spy"},{"l":"G","w":"Stub"}],"k":5,"e":13},{"n":297,"t":"ord","m":["Tema 4","4.3 Software orientado a objetos","Diaps. 56, 58"],"d":0,"s":["Ordenad los pasos de una prueba de interacción con un mock. Escribid las letras en el orden correcto."],"a":["D","C","A","E","B"],"w":["Diapositivas 56 y 58: crear el doble, programar la respuesta, ejecutar y verificar."],"it":[{"l":"A","h":"Inyectarlo en el caso de uso"},{"l":"B","h":"Verificar la llamada (assert_called_once_with)"},{"l":"C","h":"Programar su respuesta (return_value)"},{"l":"D","h":"Crear el doble (Mock())"},{"l":"E","h":"Ejecutar la acción"}],"k":5,"e":13},{"n":298,"t":"ord","m":["Tema 4","4.4 Webapps y API","Diaps. 73, 76"],"d":1,"s":["Ordenad cómo debe tratarse una prueba intermitente. Escribid las letras en el orden correcto."],"a":["B","D","E","A","C"],"w":["Diapositivas 73 y 76: la intermitencia se trata como un incidente, con responsable, causa raíz y fecha; la cuarentena no puede convertirse en un cementerio."],"it":[{"l":"A","h":"Buscar la causa raíz"},{"l":"B","h":"Detectar la prueba que solo pasa al reintentar"},{"l":"C","h":"Corregirla y devolverla al gate obligatorio"},{"l":"D","h":"Registrarla en el informe del pipeline"},{"l":"E","h":"Ponerla en cuarentena con responsable y fecha"}],"k":5,"e":13},{"n":299,"t":"calc","m":["Tema 4","4.4 Webapps y API","Diap. 72"],"d":1,"s":["Una suite tiene 50 pruebas E2E y cada una falla en falso con una probabilidad del 0,4 % por ejecución, de forma independiente. ¿Con qué probabilidad sale verde la suite cuando el código es correcto?"],"o":["0,4 %","80,0 %","81,8 %","99,6 %"],"a":2,"w":["1. ¿Qué pregunta responde? ¿Qué probabilidad hay de que pasen las 50 pruebas a la vez sin ningún defecto real?","2. Datos con unidades N = 50 pruebas. p = 0,4 % = 0,004 por prueba y ejecución. Supuesto: independencia.","3. Fórmula y por qué P(suite verde) = (1 − p)^N Cada prueba pasa con probabilidad 1 − p y la suite solo es verde si pasan todas; con independencia, las probabilidades se multiplican (diapositiva 72).","4. Sustitución 1 − p = 0,996 P = 0,996^50 ≈ 0,818 = 81,8 %","5. Comprobación de sentido Si p = 0, P = 1; si N = 1, P = 0,996. Con 50 pruebas cae al 81,8 %.","6. Interpretación y decisión Por tanto, casi 1 de cada 5 ejecuciones saldrá roja sin defecto: hay que atacar la intermitencia.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora b) 80,0 %: 80,0 % sale de restar linealmente (1 − 50 × 0,004): las probabilidades de pasar se multiplican, no se restan."],"e":13},{"n":300,"t":"calc","m":["Tema 4","4.4 Webapps y API","Diaps. 69–70"],"d":1,"s":["En una prueba de carga, el 98 % de las peticiones tarda 100 ms y el 2 % tarda 4 000 ms. ¿Cuáles son la latencia media y el p99?"],"o":["Media 98 ms; p99 = 100 ms","Media 178 ms; p99 = 4 000 ms","Media 178 ms; p99 = 100 ms","Media 2 050 ms; p99 = 4 000 ms"],"a":1,"w":["1. ¿Qué pregunta responde? ¿Qué dicen la media y el p99 de la experiencia de los usuarios?","2. Datos con unidades 98 % de las peticiones: 100 ms. 2 % de las peticiones: 4 000 ms.","3. Fórmula y por qué Media = Σ (fracción × valor); p99 = valor por debajo del cual está el 99 % de las mediciones La media pondera cada valor por su peso; el percentil mira la cola de la distribución (diapositiva 69).","4. Sustitución Media = 0,98 × 100 + 0,02 × 4 000 = 98 + 80 = 178 ms Las peticiones lentas ocupan el 2 % superior, que incluye el 1 % por encima del p99 → p99 = 4 000 ms","5. Comprobación de sentido La media queda cerca de lo rápido; el p99 refleja a los usuarios que esperan 4 s.","6. Interpretación y decisión Por tanto, con el umbral p(99)<500 de k6 el job fallaría aunque la media parezca aceptable.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora d) Media 2 050 ms; p99 = 4 000 ms: 2 050 ms sale de promediar los dos valores sin ponderarlos por su frecuencia ((100 + 4 000) / 2)."],"e":13}],"exc":[10,27,28,29,30,31,92,112,154,158,171,250,281,284,288,113,168],"tie":[113,168],"form":{"intro":"Todas las fórmulas del PDF. Método de seis pasos: pregunta del cálculo; datos y unidades; fórmula y su porqué; sustitución paso a paso; comprobación de sentido; interpretación y decisión.","temas":[{"t":"Formulario · Temas 1–4","rows":[["Disponibilidad: <b>1 − tiempo de caída / tiempo total<\/b>","1.6","86–88"],["Sobrecoste de detectar tarde: <b>n × (coste en la fase tardía − coste en la fase temprana)<\/b>","1.8","117"],["Factor de escalada: <b>coste tardío / coste temprano<\/b>","1.8","117"],["% de retrabajo: <b>horas de retrabajo / horas totales de ingeniería<\/b>","1.8","115"],["Ley de Little: <b>L = λ · W (W = L / λ)<\/b>","2.1","16"],["% de Idle Time: <b>Idle Time / Cycle Time (mismas unidades)<\/b>","2.1","20"],["Tasa de rechazo: <b>PR devueltos / PR revisados<\/b>","2.1","19"],["Número de micro-PR: <b>⌈líneas totales / máximo por PR⌉ (redondeo hacia arriba)<\/b>","2.1","22"],["Mutation score: <b>mutantes detectados (muertos) / mutantes generados<\/b>","2.3","51"],["Inestabilidad: <b>I = Ce / (Ca + Ce)<\/b>","2.5","85"],["Abstracción: <b>A = Na / Nc<\/b>","2.5","86"],["Distancia a la línea de equilibrio: <b>D = |A + I − 1|<\/b>","2.5","86"],["% de duplicación: <b>líneas duplicadas en código nuevo / líneas nuevas<\/b>","2.5","88"],["SLI: <b>eventos buenos / eventos válidos × 100 %<\/b>","3.2","37"],["Presupuesto de error: <b>1 − SLO; × N (eventos); × T (tiempo)<\/b>","3.2","42"],["Minutos de un mes: <b>30 × 24 × 60 = 43 200 min<\/b>","3.0","174"],["Burn rate: <b>BR = e / (1 − SLO)<\/b>","3.2","49"],["Tiempo hasta agotar: <b>t_agotar = T / BR<\/b>","3.2","49"],["Fracción gastada: <b>BR · t / T (t y T en la misma unidad)<\/b>","3.2","49"],["Umbral de alerta: <b>tasa de error = BR × (1 − SLO)<\/b>","3.2","51, 178"],["Serie y paralelo: <b>A = A₁ · A₂ · …; A = 1 − (1 − A₁)(1 − A₂)<\/b>","3.2","179"],["Densidad de defectos: <b>defectos / KLOC<\/b>","3.3","183"],["DRE: <b>antes / (antes + después) × 100 %<\/b>","3.3","65, 193"],["Puntuación de mutación: <b>eliminados / (generados − equivalentes) × 100 %<\/b>","3.3","183"],["Complejidad ciclomática: <b>nº de decisiones + 1<\/b>","3.3","183"],["Ratio de deuda técnica: <b>remediación / desarrollo (30 min por línea)<\/b>","3.3","184"],["Change failure rate: <b>despliegues con incidente / despliegues<\/b>","3.3","68, 190"],["Rework rate: <b>despliegues no planificados / despliegues<\/b>","3.3","68, 190"],["Precisión: <b>VP / (VP + FP)<\/b>","3.5","200"],["Exhaustividad (recall): <b>VP / (VP + FN)<\/b>","3.5","200"],["Exactitud: <b>(VP + VN) / total<\/b>","3.5","200"],["Pareto: <b>ordenar de mayor a menor y acumular %<\/b>","3.5","97"],["MTBF: <b>MTTF + MTTR<\/b>","3.6","122"],["Daño de un despliegue: <b>T×f×p×w<\/b>","4.1","25"],["Valores límite (dos valores): <b>casos = 2 × fronteras<\/b>","4.2","34"],["Tiempo de la suite: <b>Σ (pruebas del nivel × duración media)<\/b>","4.2","41"],["Suite verde con intermitencia: <b>P = (1 − p)^N<\/b>","4.4","72"],["Con un reintento: <b>p efectiva = p²<\/b>","4.4","73"],["Media ponderada: <b>Σ (fracción × valor)<\/b>","4.4","69"]]}]}}</script>

  { id: "fase-3", name: "Fase 3", sub: "Huecos y relacionar", time: "1 h 45 min", read: true,
    intro: "<p>Lo que más pesa (3,5 puntos). No las resuelvas despacio: usa el <b>Modo lectura</b> o rellena rápido, pulsa <b>Comprobar</b> y lee el texto ya completo, en voz alta si puedes. Marca con <b>?</b> las que te cuesten.</p>",
    secs: [{ t: "Rellenar huecos", ns: ofType("huecos") }, { t: "Relacionar", ns: ofType("rel") }] },
  { id: "fase-4", name: "Fase 4", sub: "Cálculo", time: "1 h 30 min", form: true,
    intro: "<p>Lee el formulario una vez y haz los cálculos en orden de prioridad: SRE (P181–P191), Etapa 12 (P265–P272), Etapa 4 (P80–P84) y el resto. Si no te sale en 2 min, mira la solución y apunta la fórmula. <b>Si vas justo de tiempo, recorta aquí.</b></p>",
    secs: [{ t: "Cálculos en orden de prioridad", ns: calcOrder }] },
  { id: "fase-5", name: "Fase 5", sub: "Repaso", time: "lo que quede", review: true, read: true,
    intro: "<p>Aquí aparecen solas las preguntas que fallaste (o no sacaste completas) y las que marcaste con <b>?</b>. Repítelas hasta que salgan.</p>", secs: [] }
];

function reviewNs() { return D.qs.filter(function (q) { var r = S.res[q.n]; return S.dud[q.n] || (r && r.s < r.m); }).map(function (q) { return q.n; }); }
function phaseNs(p) { if (p.review) return reviewNs(); var a = []; p.secs.forEach(function (s) { a = a.concat(s.ns); }); return a; }
function stats(ns) {
  var done = 0, s = 0, m = 0, tot = 0;
  ns.forEach(function (n) { var r = S.res[n]; tot += pts(QM[n]); if (r) { done++; s += r.s; m += r.m; } });
  return { done: done, total: ns.length, s: s, ko: m - s, tot: tot };
}

var cur = "fase-1", filt = "all", readMode = false, formOpen = false;
var live = {}, optOrder = {}, mixed = {};

function sectionsFor(p) {
  var secs;
  if (p.review) {
    var ns = reviewNs();
    secs = ["test", "ord", "diag", "huecos", "rel", "calc"].map(function (t) { return { t: TIPO[t], ns: ns.filter(function (n) { return QM[n].t === t; }) }; });
  } else if (p.id === "fase-1" && S.nohint) secs = [{ t: "Test", ns: D.exc.concat(testRest), mixAlways: true }];
  else secs = p.secs;
  return secs.map(function (s) {
    if (!(S.mix || s.mixAlways)) return s;
    var key = p.id + "|" + s.t;
    if (!mixed[key] || mixed[key].length !== s.ns.length) mixed[key] = shuffle(s.ns);
    return { t: s.t + " · orden aleatorio", ns: mixed[key] };
  });
}

function renderNav() {
  var h = "";
  PH.forEach(function (p) {
    var ns = phaseNs(p), st = stats(ns), cls = "";
    if (!p.review && st.done === st.total && st.total) cls = st.ko ? "g-done-ko" : "g-done-ok";
    else if (!p.review && st.done) cls = "g-doing";
    var info = p.review ? ns.length + " pendientes" : st.done + "/" + st.total;
    h += '<a href="#' + p.id + '" class="' + cls + '"' + (p.id === cur ? ' aria-current="page"' : "") + ">" + p.name + " · " + p.sub + "<small>" + info + "</small></a>";
  });
  h += '<a href="#formulas"' + (cur === "formulas" ? ' aria-current="page"' : "") + ">Formulario<small>39 fórmulas</small></a>";
  document.getElementById("nav").innerHTML = h;
}

function formTable() {
  var h = '<p class="g-muted" style="margin:4px 0 8px">' + rich(D.form.intro) + '</p><div class="tbl-wrap"><table class="tbl f-form"><thead><tr><th>Fórmula</th><th>Sección</th><th>Diap.</th></tr></thead><tbody>';
  D.form.temas.forEach(function (t) { t.rows.forEach(function (r) { h += "<tr><td>" + rich(r[0]) + "</td><td>" + esc(r[1]) + "</td><td>" + esc(r[2]) + "</td></tr>"; }); });
  return h + "</tbody></table></div>";
}

function bar(ns) {
  var st = stats(ns), okw = st.tot ? 100 * st.s / st.tot : 0, kow = st.tot ? 100 * st.ko / st.tot : 0;
  return '<div class="test-bar f-bar"><div class="row"><span class="stats">Hechas <b>' + st.done + "</b>/" + st.total +
    ' · <span class="ok">Aciertos <b>' + st.s + '</b></span> · <span class="ko">Fallos <b>' + st.ko + "</b></span></span>" +
    '<div class="track"><div class="f-ok" style="width:' + okw + '%"></div><div class="f-ko" style="width:' + kow + '%"></div></div></div></div>';
}

function render() {
  renderNav();
  var v = document.getElementById("view");
  if (cur === "formulas") { v.innerHTML = '<section class="cat"><h2 class="cat-title">Formulario · Temas 1–4</h2><div class="bloque">' + formTable() + "</div></section>"; return; }
  var p = PH.filter(function (x) { return x.id === cur; })[0];
  var ns = phaseNs(p);
  var h = '<div class="g-box hilo"><div class="g-box-h">' + p.name + " · " + p.sub + " · " + p.time + "</div>" + p.intro + "</div>";
  if (!p.review) h += bar(ns);
  if (p.form) h += '<details class="g-box idea"' + (formOpen ? " open" : "") + ' id="fd"><summary class="g-box-h">Formulario (39 fórmulas)</summary>' + formTable() + "</details>";
  h += '<div class="f-tools">';
  if (!p.review) [["all", "Todas"], ["pend", "Pendientes"], ["ko", "Falladas"], ["dud", "Dudosas"]].forEach(function (f) {
    h += '<button class="btn small" type="button" data-f="' + f[0] + '" aria-pressed="' + (filt === f[0]) + '">' + f[1] + "</button>";
  });
  h += '<span class="sp"></span>';
  if (p.read) h += '<button class="btn small" type="button" id="rm" aria-pressed="' + readMode + '">📖 Modo lectura</button>';
  h += "</div>";
  var any = false;
  sectionsFor(p).forEach(function (s) {
    var list = s.ns.filter(pass);
    if (!list.length) return;
    any = true;
    var st = stats(s.ns);
    h += '<section class="cat"><h2 class="cat-title">' + esc(s.t) + ' <span class="cat-score">' + st.done + "/" + s.ns.length + "</span></h2>";
    list.forEach(function (n) { h += card(QM[n]); });
    h += "</section>";
  });
  if (!any) h += '<p class="empty-msg">' + (p.review ? "No tienes fallos ni dudosas todavía. ¡Bien!" : "No hay preguntas con este filtro.") + "</p>";
  v.innerHTML = h;
  syncAll();
  var fd = document.getElementById("fd"); if (fd) fd.addEventListener("toggle", function () { formOpen = fd.open; });
}
function pass(n) {
  var r = S.res[n];
  if (filt === "pend") return !r;
  if (filt === "ko") return r && r.s < r.m;
  if (filt === "dud") return !!S.dud[n];
  return true;
}

/* ---------- Tarjeta de pregunta ---------- */
function card(q) {
  var L = live[q.n] || {}, r = S.res[q.n], cls = "q g-q";
  if (L.done && L.sc !== "—") cls += L.sc === pts(q) ? " correct" : " wrong";
  if (D.exc.indexOf(q.n) >= 0) cls += " f-exc";
  return '<article class="' + cls + '" id="q' + q.n + '">' + inner(q, L, r) + "</article>";
}
function inner(q, L, r) {
  var verdict = "";
  if (L.done && L.sc !== "—") verdict = L.sc === pts(q) ? "✓ Correcta" : (pts(q) > 1 ? L.sc + "/" + pts(q) : "✗ Incorrecta");
  else if (r) verdict = '<span class="' + (r.s === r.m ? "g-pass" : "g-fail") + '">' + (r.m > 1 ? r.s + "/" + r.m : (r.s ? "acertada" : "fallada")) + "</span>";
  var tag = D.exc.indexOf(q.n) >= 0 ? '<span class="f-tag">' + (D.tie.indexOf(q.n) >= 0 ? "empate de longitud" : "no es la más larga") + "</span>" : "";
  var h = '<div class="q-top"><span><span class="g-pn d' + q.d + '">P' + q.n + '</span> <span class="g-leg">' + TIPO[q.t] +
    '<span class="g-leg-x"> · Etapa ' + q.e + " · " + esc(q.m.join(" · ")) + " · " + DIF[q.d] + "</span></span></span>" +
    '<span class="g-top-r">' + tag + '<span class="verdict">' + verdict + "</span>" +
    '<button class="g-doubt" type="button" data-dud="' + q.n + '" aria-pressed="' + !!S.dud[q.n] + '" title="Marcar como dudosa">?</button></span></div>';
  var show = L.done || (readMode && q.t !== "test" && q.t !== "calc");
  if (q.t === "test" || q.t === "calc") return h + choice(q, L);
  if (q.t === "huecos") return h + huecos(q, L, show);
  if (q.t === "rel") return h + rel(q, L, show);
  if (q.t === "ord") return h + ord(q, L, show);
  return h + diag(q, L, show);
}
function stemHtml(q) { return '<div class="q-text">' + q.s.map(function (s) { return "<p>" + hintWrap(rich(s)) + "</p>"; }).join("") + "</div>"; }
function explain(q, head) {
  var h = '<div class="explain"><div class="head">' + (head || "Por qué") + "</div>";
  (q.w || []).forEach(function (w) { h += "<p style=\"margin:4px 0 0\">" + rich(w) + "</p>"; });
  return h + "</div>";
}
function actions(q, L) {
  if (L.done) return '<div class="g-actions btnrow">' + (L.sc !== "—" ? '<span class="f-score">' + L.sc + " / " + pts(q) + "</span>" : "") + '<button class="btn small" type="button" data-redo="' + q.n + '">Repetir</button></div>';
  return '<div class="g-actions btnrow"><button class="btn primary" type="button" data-check="' + q.n + '">Comprobar</button><button class="btn" type="button" data-show="' + q.n + '">Ver solución</button></div>';
}

function choice(q, L) {
  if (!optOrder[q.n]) optOrder[q.n] = shuffle(q.o.map(function (_, i) { return i; }));
  var show = L.done || readMode, h = stemHtml(q) + '<div class="opts">';
  optOrder[q.n].forEach(function (i, k) {
    var cls = "opt" + (show ? " locked" : "");
    if (show && i === q.a) cls += L.pick === i ? " pick-ok" : (L.done ? " show-ok" : " pick-ok");
    else if (show && L.pick === i) cls += " pick-ko";
    h += '<button type="button" class="' + cls + '" data-q="' + q.n + '" data-o="' + i + '"' + (show ? " disabled" : "") + '><span class="letter">' + LET[k] + ")</span><span>" + rich(q.o[i]) + "</span></button>";
  });
  h += "</div>";
  if (show) {
    var head = !L.done ? "Solución" : (L.pick === q.a ? "¡Correcta!" : "Incorrecta");
    h += explain(q, head) + (L.done ? '<div class="g-actions btnrow"><button class="btn small" type="button" data-redo="' + q.n + '">Repetir</button></div>' : "");
  }
  return h;
}

function word(q, l) { var f = q.b.filter(function (x) { return x.l === l; })[0]; return f ? f.w : l; }
function choiceHtml(text) { return '<span class="g-choice-text">' + text + '</span><span class="g-choice-status" hidden> · En uso</span>'; }
function bankHtml(q) {
  var b = q.b.slice().sort(function (x, y) { return plain(x.w).localeCompare(plain(y.w), "es"); });
  return '<div class="g-bank"><div class="g-bank-h">BANCO DE PALABRAS · sobran ' + (q.b.length - q.k) + '</div><div class="g-chips">' +
    b.map(function (x) { return '<span class="g-chip" data-choice="' + x.l + '">' + choiceHtml(rich(x.w)) + "</span>"; }).join("") + "</div></div>";
}
function wordSlot(q, i, L) {
  var v = (L.v || [])[i] || "", cls = "slot" + (L.done ? (L.chk[i] ? " s-ok" : " s-ko") : "");
  var b = q.b.slice().sort(function (x, y) { return plain(x.w).localeCompare(plain(y.w), "es"); });
  var h = '<select class="' + cls + '" data-q="' + q.n + '" data-i="' + i + '"' + (L.done ? " disabled" : "") + '><option value="">' + (i + 1) + " …</option>";
  b.forEach(function (x) { h += '<option value="' + x.l + '"' + (v === x.l ? " selected" : "") + ">" + esc(plain(x.w)) + "</option>"; });
  return h + "</select>";
}
function letterSlot(q, i, L, letters) {
  var v = (L.v || [])[i] || "", cls = "slot" + (L.done ? (L.chk[i] ? " s-ok" : " s-ko") : "");
  return '<select class="' + cls + '" data-q="' + q.n + '" data-i="' + i + '"' + (L.done ? " disabled" : "") + '><option value="">—</option>' +
    letters.map(function (l) { return '<option value="' + l + '"' + (v === l ? " selected" : "") + ">" + l + "</option>"; }).join("") + "</select>";
}

function huecos(q, L, show) {
  var txt = hintWrap(q.s.map(rich).join("<br>"));
  if (show && !L.done) {
    txt = txt.replace(/\{\{(\d+)\}\}/g, function (_, d) { return '<span class="g-fill">' + rich(word(q, q.a[d - 1])) + "</span>"; });
    return '<div class="q-text"><p class="g-sub">' + txt + "</p></div>" + explain(q, "Sobran · por qué");
  }
  txt = txt.replace(/\{\{(\d+)\}\}/g, function (_, d) {
    var i = d - 1, s = wordSlot(q, i, L);
    if (L.done && !L.chk[i]) s += '<span class="g-fix">→ ' + rich(word(q, q.a[i])) + "</span>";
    return s;
  });
  var h = bankHtml(q) + '<div class="q-text"><p class="g-sub">' + txt + "</p></div>" + actions(q, L);
  return L.done ? h + explain(q) : h;
}

function defText(q, l) { var f = q.df.filter(function (x) { return x.l === l; })[0]; return f ? f.h : ""; }
function rel(q, L, show) {
  var h = stemHtml(q);
  if (show && !L.done) {
    h += '<div class="g-items">';
    q.c.forEach(function (c, i) { h += '<div class="g-rel-row"><span class="g-num">' + (i + 1) + "</span><span><b>" + rich(c) + '</b><br><span class="g-fill">→ ' + rich(defText(q, q.a[i])) + "</span></span></div>"; });
    var extra = q.df.filter(function (x) { return q.a.indexOf(x.l) < 0; });
    return h + "</div>" + explain(q, "Sobran: " + extra.map(function (x) { return plain(x.h); }).join(" · "));
  }
  var letters = q.df.map(function (x) { return x.l; });
  h += '<div class="g-rel"><div class="g-rel-col"><div class="g-col-h">Conceptos</div>';
  q.c.forEach(function (c, i) {
    h += '<div class="g-rel-row"><span class="g-num">' + (i + 1) + "</span><span>" + rich(c) + "</span>" + letterSlot(q, i, L, letters) +
      (L.done && !L.chk[i] ? '<span class="g-fix">→ ' + q.a[i] + "</span>" : "") + "</div>";
  });
  h += '</div><div class="g-rel-col"><div class="g-col-h">Definiciones · sobran ' + (q.df.length - q.k) + '</div><ul class="g-defs">' +
    q.df.map(function (x) { return '<li data-choice="' + x.l + '">' + choiceHtml("<b>" + x.l + ".</b> " + rich(x.h)) + "</li>"; }).join("") + "</ul></div></div>" + actions(q, L);
  return L.done ? h + explain(q) : h;
}

function itText(q, l) { var f = q.it.filter(function (x) { return x.l === l; })[0]; return f ? f.h : ""; }
function seq(q) { return '<ol class="f-seq">' + q.a.map(function (l) { return "<li>" + rich(itText(q, l)) + "</li>"; }).join("") + "</ol>"; }
function ord(q, L, show) {
  var h = stemHtml(q);
  if (show && !L.done) return h + seq(q) + explain(q);
  var letters = q.it.map(function (x) { return x.l; });
  h += '<ul class="g-defs g-items">' + q.it.map(function (x) { return '<li data-choice="' + x.l + '">' + choiceHtml("<b>" + x.l + ".</b> " + rich(x.h)) + "</li>"; }).join("") + '</ul><div class="g-grid">';
  for (var i = 0; i < q.k; i++) h += '<label class="g-cell">Posición ' + (i + 1) + letterSlot(q, i, L, letters) + "</label>";
  h += "</div>" + actions(q, L);
  return L.done ? h + seq(q) + explain(q) : h;
}

function img(n, sol) { var s = String(n); while (s.length < 3) s = "0" + s; return IMG + "p" + s + (sol ? "-sol" : "") + ".webp"; }
function fig(q, sol) { return '<figure class="figure g-fig"><img src="' + img(q.n, sol) + '" alt="Diagrama de P' + q.n + (sol ? " resuelto" : "") + '" loading="lazy">' + (sol ? '<figcaption class="figcaption">P' + q.n + " resuelta</figcaption>" : "") + "</figure>"; }
function diag(q, L, show) {
  var h = stemHtml(q);
  if (show && !L.done) return h + fig(q, true) + explain(q);
  h += fig(q, false) + bankHtml(q) + (q.unordered ? '<p class="g-diagram-help pista">Las casillas admiten cualquier orden.</p>' : "") + '<div class="g-grid">';
  for (var i = 0; i < q.k; i++) h += '<label class="g-cell">Casilla ' + (i + 1) + wordSlot(q, i, L) + (L.done && !L.chk[i] && !q.unordered ? '<span class="g-fix">→ ' + rich(word(q, q.a[i])) + "</span>" : "") + "</label>";
  h += "</div>" + actions(q, L);
  return L.done ? h + fig(q, true) + explain(q) : h;
}

/* ---------- Pokémon (mismos efectos que las guías) ---------- */
function poke(name) { return '<img class="g-pokemon" src="' + POKE + name + '.png" width="96" height="96" alt="">'; }
function outcome(n, ok) {
  document.querySelectorAll(".g-pokemon-effect").forEach(function (el) { el.remove(); });
  var el = document.getElementById("q" + n); if (!el) return;
  var fx = document.createElement("div"), h = "";
  fx.className = "g-pokemon-effect g-outcome " + (ok ? "g-outcome-ok" : "g-outcome-ko");
  fx.setAttribute("aria-hidden", "true");
  var btn = el.querySelector(".explain, .g-actions"), top = btn ? btn.offsetTop : 60;
  fx.style.top = Math.max(32, top - 48) + "px";
  if (ok) { h = '<div class="g-outcome-party">'; for (var k = 0; k < 16; k++) h += '<i class="g-confetti" style="--i:' + k + '"></i>'; h += "</div>" + poke("pikachu") + poke("eevee"); }
  else h = poke("gengar");
  fx.innerHTML = h;
  el.appendChild(fx);
  setTimeout(function () { fx.remove(); }, 2800);
}
document.addEventListener("visibilitychange", function () { if (document.hidden) document.querySelectorAll(".g-pokemon-effect").forEach(function (el) { el.remove(); }); });

/* ---------- Opciones en uso (como en las guías) ---------- */
function syncChoices(cardEl, selected) {
  if (!cardEl) return;
  var slots = Array.from(cardEl.querySelectorAll("select.slot"));
  if (!slots.length) return;
  var used = slots.map(function (sel) { return sel.value; }).filter(Boolean);
  slots.forEach(function (sel) {
    Array.from(sel.options).forEach(function (opt) {
      var taken = !!opt.value && opt.value !== sel.value && used.indexOf(opt.value) !== -1;
      opt.disabled = taken; opt.hidden = taken;
    });
  });
  cardEl.querySelectorAll("[data-choice]").forEach(function (choice) {
    var letter = choice.getAttribute("data-choice"), taken = used.indexOf(letter) !== -1;
    choice.classList.toggle("g-used", taken);
    var stEl = choice.querySelector(".g-choice-status"); if (stEl) stEl.hidden = !taken;
    if (selected && selected.value === letter) {
      document.querySelectorAll(".g-pokemon-effect").forEach(function (el) { el.remove(); });
      var fx = document.createElement("span");
      fx.className = "g-pokemon-effect g-crossout";
      fx.setAttribute("aria-hidden", "true");
      fx.innerHTML = poke("pikachu");
      var bounds = choice.getBoundingClientRect();
      if (bounds.bottom < 160 || bounds.top > window.innerHeight) {
        var field = selected.getBoundingClientRect(), box = cardEl.getBoundingClientRect();
        fx.style.inset = "auto";
        fx.style.top = (field.top - box.top) + "px"; fx.style.left = (field.left - box.left) + "px";
        fx.style.width = field.width + "px"; fx.style.height = field.height + "px";
        cardEl.appendChild(fx);
      } else choice.appendChild(fx);
      setTimeout(function () { fx.remove(); }, 850);
    }
  });
}
function syncAll() { document.querySelectorAll(".g-q").forEach(function (el) { syncChoices(el); }); }

/* ---------- Eventos ---------- */
function record(n, s, m) { S.res[n] = { s: s, m: m }; save(); }
function rerender(n) {
  var el = document.getElementById("q" + n);
  if (el) { el.outerHTML = card(QM[n]); syncChoices(document.getElementById("q" + n)); }
  renderNav();
  var p = PH.filter(function (x) { return x.id === cur; })[0], b = document.querySelector(".f-bar");
  if (p && b && !p.review) b.outerHTML = bar(phaseNs(p));
}
function applyToggles() {
  document.body.classList.toggle("nohint", !!S.nohint);
  var hb = document.getElementById("hintBtn"), mb = document.getElementById("mixBtn");
  hb.setAttribute("aria-pressed", !!S.nohint); hb.textContent = S.nohint ? "👀 Mostrar pistas" : "🙈 Ocultar pistas";
  mb.setAttribute("aria-pressed", !!S.mix); mb.textContent = S.mix ? "🔀 Orden mezclado" : "🔀 Mezclar preguntas";
}

document.addEventListener("click", function (ev) {
  var t = ev.target.closest("[data-o],[data-check],[data-show],[data-redo],[data-dud],[data-f],#rm,#reset,#mYes,#mNo,#hintBtn,#mixBtn");
  if (!t) return;
  if (t.id === "hintBtn") { S.nohint = !S.nohint; save(); applyToggles(); render(); return; }
  if (t.id === "mixBtn") { S.mix = !S.mix; mixed = {}; save(); applyToggles(); render(); return; }
  if (t.id === "rm") { readMode = !readMode; render(); return; }
  if (t.dataset.f) { filt = t.dataset.f; render(); return; }
  if (t.id === "reset") { document.getElementById("modal").classList.add("on"); return; }
