<script id="data" type="application/json">{"qs":[{"n":1,"t":"rel","m":["Tema 1","1.1 Definición de calidad de software","Diaps. 5, 7"],"d":1,"s":["Relacionad cada modelo o concepto con su descripción. Escribid la letra de la definición junto a cada número (sobran 2 definiciones)."],"a":["D","E","A","B","I","G","C"],"w":["La tabla de la diapositiva 7 resume cada modelo con su pregunta central. Las dos definiciones que sobran describen cosas que no son modelos de calidad del producto: la primera es ISO 9001 (Tema 3) y la segunda contradice la idea de calidad multidimensional."],"c":["McCall (1977)","Boehm (1978)","Garvin (1987)","ISO/IEC 9126","ISO/IEC 25010:2023","SQuaRE","Trade-off"],"df":[{"l":"A","h":"Ocho dimensiones desde las que se percibe la calidad de un producto (performance, durability, aesthetics…)."},{"l":"B","h":"Primer intento de normalizar internacionalmente la descripción de la calidad, con seis características."},{"l":"C","h":"Conflicto entre atributos de calidad: mejorar uno puede degradar otro."},{"l":"D","h":"Once factores que afectan a la operación, la revisión y la transición del software."},{"l":"E","h":"Relación jerárquica y causal entre propiedades como utility, portability o understandability."},{"l":"F","h":"Norma que certifica el sistema de gestión de calidad de una organización."},{"l":"G","h":"Familia de normas Software product Quality Requirements and Evaluation, en la que se integra la 25010."},{"l":"H","h":"Métrica única de 0 a 100 que resume toda la calidad de un producto."},{"l":"I","h":"Marco vigente para especificar, medir y evaluar la calidad del producto, con nueve características."}],"k":7,"e":1},{"n":2,"t":"rel","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diaps. 70–71"],"d":1,"s":["Relacionad cada subcaracterística de la capacidad de interacción con su definición. Escribid la letra de la definición junto a cada número (sobran 2 definiciones)."],"a":["D","E","B","G","I","H","C"],"w":["Las definiciones son las de las diapositivas 70–71. Las que sobran son la coexistencia (compatibilidad) y el comportamiento fail- safe (seguridad operacional)."],"c":["Appropriateness recognizability","Learnability","Operability","User error protection","User engagement","Inclusivity","Self-descriptiveness"],"df":[{"l":"A","h":"Capacidad de ejecutarse en el mismo entorno que otros sistemas sin interferencias."},{"l":"B","h":"Facilidad para controlar e interactuar mecánicamente con la interfaz."},{"l":"C","h":"El sistema se explica a sí mismo y muestra su estado actual con claridad."},{"l":"D","h":"El usuario puede identificar si el sistema es la herramienta apropiada para su necesidad."},{"l":"E","h":"Rapidez y facilidad con la que un usuario nuevo asimila el funcionamiento."},{"l":"F","h":"Transición obligatoria a un estado inerte o seguro ante un fallo catastrófico."},{"l":"G","h":"Diseño preventivo que evita que el usuario cometa equivocaciones."},{"l":"H","h":"Puede ser utilizado por personas con diversas capacidades y contextos."},{"l":"I","h":"Nivel de compromiso, motivación e implicación que logra el sistema."}],"k":7,"e":1},{"n":3,"t":"rel","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diaps. 74–75"],"d":1,"s":["Relacionad cada concepto de seguridad operacional con su definición. Escribid la letra de la definición junto a cada número (sobran 2 definiciones)."],"a":["G","C","D","E","I","B","F"],"w":["Las cinco subcaracterísticas y la distinción safety/security están en las diapositivas 74–75. Las que sobran son la capacidad de recuperación (confiabilidad) y la instalabilidad (flexibilidad)."],"c":["Operational constraint","Risk identification","Fail-safe","Hazard warning","Safe integration","Safety","Security"],"df":[{"l":"A","h":"Capacidad de reiniciarse solo y sin pérdida de datos tras una caída."},{"l":"B","h":"Protege a personas, activos y entorno frente a los errores del propio sistema."},{"l":"C","h":"Monitoriza el entorno y su estado para detectar anomalías antes de que haya daño."},{"l":"D","h":"Ante un fallo catastrófico, la transición obligatoria es hacia un estado inerte o seguro."},{"l":"E","h":"Alerta a tiempo y con claridad a operadores humanos u otros sistemas sobre un riesgo."},{"l":"F","h":"Protege al software frente a ataques o robos de datos."},{"l":"G","h":"El software impone barreras lógicas para no salir de parámetros seguros."},{"l":"H","h":"Facilidad para desplegar o desinstalar limpiamente el producto."},{"l":"I","h":"Se conecta con sensores, actuadores y otros sistemas sin introducir nuevos riesgos."}],"k":7,"e":1},{"n":4,"t":"test","m":["Tema 1","1.1 Definición de calidad de software","Diap. 5"],"d":0,"s":["Según el Tema 1, ¿cuál de estas definiciones de calidad de software es la correcta?"],"o":["El grado en que un sistema cumple los requisitos funcionales del cliente, medido con una única métrica global.","La ausencia total de defectos en el código fuente una vez desplegado.","La velocidad con la que el sistema responde a las peticiones de los usuarios.","El grado en que un sistema, componente o proceso satisface los requisitos especificados y las expectativas razonables de sus interesados, considerando a la vez múltiples atributos."],"a":3,"w":["La definición del tema tiene tres piezas: requisitos especificados, expectativas razonables de los interesados y múltiples atributos a la vez. El distractor plausible falla en dos puntos: reduce la calidad a lo funcional y a «una única métrica», justo lo que la diapositiva descarta. (Distractor plausible: a)."],"e":1},{"n":5,"t":"test","m":["Tema 1","1.1 Definición de calidad de software","Diap. 5"],"d":0,"s":["Dos sistemas de reservas ofrecen exactamente las mismas funciones y los dos «funcionan». ¿Qué afirmación es correcta según el Tema 1?"],"o":["Pueden tener niveles de calidad radicalmente distintos, porque la calidad es un constructo multidimensional.","Tendrán la misma calidad si superan las mismas pruebas funcionales.","Tendrá más calidad el que tenga más líneas de código.","Solo se puede comparar su calidad si ambos tienen la certificación ISO 9001."],"a":0,"w":["La diapositiva 5 lo dice literalmente: dos sistemas pueden «funcionar» igual de bien y tener calidades muy distintas, porque cuentan también el desempeño, la seguridad, la mantenibilidad, etc. Superar las mismas pruebas funcionales solo iguala una de las dimensiones. (Distractor plausible: b)."],"e":1},{"n":6,"t":"test","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diap. 64"],"d":0,"s":["En la edición 2023 de ISO/IEC 25010, ¿hacia qué característica evoluciona la antigua portabilidad?"],"o":["Hacia la compatibilidad (compatibility), que incorpora la interoperabilidad.","Hacia la capacidad de interacción (interaction capability).","Hacia la flexibilidad (flexibility), que incorpora de forma explícita la escalabilidad.","Hacia la seguridad operacional (safety)."],"a":2,"w":["La diapositiva 64 recoge los tres cambios conceptuales; el tercero es portabilidad → flexibilidad, pensada para la nube y los sistemas distribuidos. La compatibilidad ya existía y no sustituye a la portabilidad. (Distractor plausible: a)."],"e":1},{"n":7,"t":"test","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diap. 74"],"d":2,"s":["El software de un ascensor recibe una actualización. ¿Cuál de estas situaciones es un problema de seguridad operacional (safety) y no de seguridad (security)?"],"o":["Un atacante entra en el panel remoto y cambia la planta de destino de la cabina.","Un error de cálculo permite que las puertas se abran entre dos plantas con la cabina en movimiento.","El panel tarda tres segundos en mostrar la planta actual.","El registro de mantenimiento no indica qué técnico hizo la última revisión."],"a":1,"w":["La safety protege a personas, activos y entorno frente a los errores del propio sistema; la security lo protege de ataques. El distractor tiene consecuencias físicas, pero su origen es un ataque: es un problema de security. El retraso del panel es de desempeño y el registro, de rendición de cuentas. (Distractor plausible: a)."],"e":1},{"n":8,"t":"test","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diaps. 67–68"],"d":0,"s":["En el sistema de nóminas del tema, el cálculo de las horas extras es perfecto, pero el analista debe sumar a mano las horas de las tarjetas físicas antes de introducirlas. ¿Qué subcaracterística falla?"],"o":["La adecuación funcional (functional appropriateness).","La corrección funcional (functional correctness).","La coexistencia (co-existence).","La disponibilidad (availability)."],"a":0,"w":["El cálculo es exacto (corrección alta) y el módulo existe (completitud alta), pero la función no sirve para el objetivo real del usuario: le obliga a hacer trabajo manual. Es el principio de la diapositiva 68: ejecutar bien una función no implica que sea la adecuada. (Distractor plausible: b)."],"e":1},{"n":9,"t":"test","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diap. 66"],"d":0,"s":["El cliente pidió exportar los informes a PDF y a CSV, pero la aplicación solo exporta a PDF. ¿Qué subcaracterística se ve afectada?"],"o":["La corrección funcional (functional correctness).","La autenticidad (authenticity).","La instalabilidad (installability).","La completitud funcional (functional completeness)."],"a":3,"w":["Falta una función que estaba en los requisitos: eso mide la completitud. La corrección se refiere a si los resultados de las funciones que existen son exactos; aquí la exportación a PDF no tiene por qué estar mal. (Distractor plausible: a)."],"e":1},{"n":10,"t":"test","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diap. 72"],"d":1,"s":["Un usuario introduce una tarjeta caducada. El sistema bloquea el botón «Pagar» y resalta la fecha en rojo con el mensaje «La fecha de la tarjeta ha expirado; introducid un método de pago vigente». ¿Qué dos subcaracterísticas se aplican, en este orden?"],"o":["Integridad y no repudio.","Tolerancia a fallos y disponibilidad.","Protección frente a errores del usuario y asistencia al usuario.","Protección frente a errores del usuario y autodescriptividad."],"a":3,"w":["Bloquear «Pagar» evita que el error tenga efecto (protección frente a errores); el mensaje claro sobre la fecha muestra el estado del sistema y cómo resolverlo (autodescriptividad), como en la diapositiva 72. La asistencia al usuario se refiere a mecanismos de ayuda y soporte integrados, no al mensaje del propio campo. (Distractor plausible: c)."],"e":1},{"n":11,"t":"test","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diap. 75"],"d":2,"s":["El sistema de señalización de una línea de tren pierde la comunicación con el centro de control. Según el principio fail-safe, ¿qué debe hacer?"],"o":["Avisar por correo al responsable de mantenimiento y seguir con normalidad.","Mantener las señales en su último estado para no interrumpir el servicio.","Poner todas las señales en verde para evitar retrasos.","Poner todas las señales en rojo y detener la circulación hasta recuperar el control."],"a":3,"w":["Fail-safe significa que, ante un fallo grave, el sistema pasa a un estado inerte o seguro, nunca a uno que agrave el peligro (diapositiva 75). Mantener el último estado parece prudente, pero deja trenes moviéndose con información que ya nadie controla; eso es continuidad del servicio, no seguridad. (Distractor plausible: b)."],"e":1},{"n":12,"t":"huecos","m":["Tema 1","1.1 Definición de calidad de software","1.6 La norma ISO/IEC 25010:2023","Diaps. 7, 62, 64"],"d":0,"s":["Completad el texto con las palabras del banco (sobran dos). ISO/IEC 9126 intentó {{1}} internacionalmente la descripción de la calidad del software. Hoy la norma vigente es la ISO/IEC 25010:2023, de la familia {{2}}, que contiene {{3}} características y sirve para especificar, {{4}} y evaluar la calidad del producto. La antigua usabilidad evoluciona hacia la capacidad de {{5}}, que incorpora el engagement y la {{6}}. Además, aparece como característica propia la seguridad {{7}} (safety)."],"a":["E","I","F","D","C","B","G"],"w":["Sobran: seis, física. «Seis» es el número de características de la 9126, no de la 25010:2023. «Física» es tentadora porque la safety protege del daño físico, pero la característica se llama seguridad operacional."],"b":[{"l":"A","w":"física"},{"l":"B","w":"inclusividad"},{"l":"C","w":"interacción"},{"l":"D","w":"medir"},{"l":"E","w":"normalizar"},{"l":"F","w":"nueve"},{"l":"G","w":"operacional"},{"l":"H","w":"seis"},{"l":"I","w":"SQuaRE"}],"k":7,"e":1},{"n":13,"t":"huecos","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diaps. 66–68"],"d":0,"s":["Completad el texto sobre la adecuación funcional (sobran dos palabras). Responder a «¿el sistema hace lo que {{1}} hacer?» exige ir más allá de comprobar que el código {{2}} sin errores. La completitud funcional evalúa si las funciones cubren todas las {{3}} y objetivos especificados; la corrección funcional, si los resultados son {{4}} y con la precisión requerida; y la adecuación funcional, si la función es realmente {{5}} para el objetivo del usuario. Principio: ejecutar {{6}} una función no implica que sea la adecuada; si construís la herramienta {{7}}, el software fracasa."],"a":["D","A","H","F","I","B","E"],"w":["Sobran: rápidos, costosa. «Rápidos» pertenece a la eficiencia de desempeño, no a la corrección. «Costosa» no aparece en el principio de la diapositiva 67: el fracaso viene de construir la herramienta equivocada, no la cara."],"b":[{"l":"A","w":"compile"},{"l":"B","w":"correctamente"},{"l":"C","w":"costosa"},{"l":"D","w":"debe"},{"l":"E","w":"equivocada"},{"l":"F","w":"exactos"},{"l":"G","w":"rápidos"},{"l":"H","w":"tareas"},{"l":"I","w":"útil"}],"k":7,"e":1},{"n":14,"t":"huecos","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diaps. 64, 70–72"],"d":0,"s":["Completad el texto sobre la capacidad de interacción (sobran dos palabras). La capacidad de interacción es la evolución moderna de la {{1}}. Una interfaz no debe limitarse a permitir ejecutar una acción técnica: debe ayudar al usuario a {{2}} el sistema de forma continua. Un sistema con mala capacidad de interacción muestra un error {{3}} («Error 500») y deja al usuario sin saber cómo {{4}}; uno bueno muestra un texto claro y {{5}}. Además, la edición 2023 incorpora la {{6}}, para que puedan usarlo personas con diversas capacidades, y el {{7}} o compromiso del usuario."],"a":["I","A","D","G","B","E","C"],"w":["Sobran: portabilidad, rendimiento. La portabilidad evoluciona hacia la flexibilidad, no hacia la interacción; el rendimiento pertenece a la eficiencia de desempeño."],"b":[{"l":"A","w":"comprender"},{"l":"B","w":"comprensible"},{"l":"C","w":"engagement"},{"l":"D","w":"genérico"},{"l":"E","w":"inclusividad"},{"l":"F","w":"portabilidad"},{"l":"G","w":"recuperarse"},{"l":"H","w":"rendimiento"},{"l":"I","w":"usabilidad"}],"k":7,"e":1},{"n":15,"t":"huecos","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diaps. 74–75"],"d":0,"s":["Completad el texto sobre la seguridad operacional (sobran dos palabras). La seguridad operacional (safety) evalúa cómo el software protege a las {{1}}, los activos materiales y el medio ambiente frente a los {{2}} del propio sistema. El impacto de un error se mide por sus consecuencias {{3}}, no por la cantidad de código defectuoso. Las restricciones operacionales imponen barreras {{4}} a lo que pueden hacer el hardware o el operador; la identificación de riesgos detecta anomalías {{5}} de que el daño se materialice; el comportamiento fail-safe lleva al sistema a un estado {{6}} o seguro; y las advertencias de peligro alertan a los {{7}} humanos."],"a":["I","D","E","G","A","F","H"],"w":["Sobran: después, atacantes. «Atacantes» corresponde a la security, no a la safety. «Después» contradice la identificación de riesgos, que actúa de forma proactiva, antes del daño."],"b":[{"l":"A","w":"antes"},{"l":"B","w":"atacantes"},{"l":"C","w":"después"},{"l":"D","w":"errores"},{"l":"E","w":"físicas"},{"l":"F","w":"inerte"},{"l":"G","w":"lógicas"},{"l":"H","w":"operadores"},{"l":"I","w":"personas"}],"k":7,"e":1},{"n":16,"t":"diag","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diap. 62"],"d":0,"s":["Completad el mapa de ISO/IEC 25010:2023. Ya se dan dos características; colocad las siete que faltan."],"a":["A","E","C","B","D","F","H"],"w":["Sobran: Portabilidad, Usabilidad. Son las nueve de la diapositiva 62. Sobran «Portabilidad» y «Usabilidad», porque en 2023 evolucionan hacia flexibilidad y capacidad de interacción. Admitid cualquier orden dentro de las casillas: lo que se evalúa es que estén las siete y que no entren las dos clásicas."],"b":[{"l":"A","w":"Adecuación funcional"},{"l":"B","w":"Capacidad de interacción"},{"l":"C","w":"Compatibilidad"},{"l":"D","w":"Confiabilidad"},{"l":"E","w":"Eficiencia de desempeño"},{"l":"F","w":"Flexibilidad"},{"l":"G","w":"Portabilidad"},{"l":"H","w":"Seguridad operacional (safety)"},{"l":"I","w":"Usabilidad"}],"k":7,"unordered":true,"e":1},{"n":17,"t":"diag","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diaps. 66–67"],"d":0,"s":["Completad el árbol de la adecuación funcional con el nombre en inglés de cada subcaracterística."],"a":["C","D","B"],"w":["Sobran: Operability, Faultlessness. Cada subcaracterística responde a una pregunta (diapositivas 66–67). Operability pertenece a la capacidad de interacción y faultlessness, a la confiabilidad."],"b":[{"l":"A","w":"Faultlessness"},{"l":"B","w":"Functional appropriateness"},{"l":"C","w":"Functional completeness"},{"l":"D","w":"Functional correctness"},{"l":"E","w":"Operability"}],"k":3,"e":1},{"n":18,"t":"diag","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diaps. 75–76"],"d":1,"s":["El robot quirúrgico del tema aplica la seguridad operacional. Escribid en cada hueco la subcaracterística que demuestra cada hecho."],"a":["F","C","A","B","D"],"w":["Sobran: Tolerancia a fallos, Resistencia. Es el ejemplo de la diapositiva 76, en el mismo orden. La tolerancia a fallos es de confiabilidad (seguir dando servicio) y la resistencia es de security (aguantar ataques): ninguna habla del daño físico."],"b":[{"l":"A","w":"Advertencias de peligro"},{"l":"B","w":"Comportamiento a prueba de fallos (fail-safe)"},{"l":"C","w":"Identificación de riesgos"},{"l":"D","w":"Integración segura"},{"l":"E","w":"Resistencia"},{"l":"F","w":"Restricciones operacionales"},{"l":"G","w":"Tolerancia a fallos"}],"k":5,"e":1},{"n":19,"t":"ord","m":["Tema 1","1.1 Definición de calidad de software","Diap. 7"],"d":0,"s":["Ordenad estos modelos de calidad del más antiguo al más reciente. Escribid las letras en el orden correcto."],"a":["F","D","A","B","C","E"],"w":["McCall es de 1977, Boehm de 1978, Garvin de 1987, la 9126 de 2001–2004 y la 25010 de 2011, revisada en 2023. La idea de fondo: de modelos académicos y de consultoría se pasa a una norma internacional."],"it":[{"l":"A","h":"Garvin: ocho dimensiones de percepción de la calidad."},{"l":"B","h":"ISO/IEC 9126: seis características normalizadas."},{"l":"C","h":"ISO/IEC 25010:2011, dentro de la familia SQuaRE."},{"l":"D","h":"Boehm: árbol jerárquico y causal de propiedades."},{"l":"E","h":"ISO/IEC 25010:2023, con nueve características."},{"l":"F","h":"McCall: once factores de operación, revisión y transición."}],"k":6,"e":1},{"n":20,"t":"ord","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diap. 70"],"d":0,"s":["Un sistema con buena capacidad de interacción responde de forma continua a cinco preguntas del usuario. Ordenadlas tal como se las va planteando quien usa el sistema. Escribid las letras en el orden correcto."],"a":["C","A","E","B","D"],"w":["Es el recorrido natural de uso: descubrir, hacer, ver el resultado y, si algo falla, entenderlo y recuperarse (diapositiva 70)."],"it":[{"l":"A","h":"¿Cómo hacerlo correctamente?"},{"l":"B","h":"¿Qué ha salido mal en caso de error?"},{"l":"C","h":"¿Qué se puede hacer con el sistema?"},{"l":"D","h":"¿Cómo recuperarse de ese error?"},{"l":"E","h":"¿Qué ha ocurrido tras realizar una acción?"}],"k":5,"e":1},{"n":21,"t":"rel","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diaps. 78–79, 82"],"d":1,"s":["Relacionad cada concepto de eficiencia de desempeño y de compatibilidad con su definición. Escribid la letra de la definición junto a cada número (sobran 2 definiciones)."],"a":["B","I","D","G","A","C","E"],"w":["Son las definiciones de las diapositivas 78–79 y 82. Las dos que sobran son la reconocibilidad de la adecuación (interacción) y la disponibilidad (confiabilidad)."],"c":["Time behavior","Resource utilization","Capacity","Throughput","Patrón de degradación bajo carga","Co-existence","Interoperability"],"df":[{"l":"A","h":"Cómo se comporta el sistema al acercarse o superar sus límites."},{"l":"B","h":"Tiempos de respuesta y de procesamiento en condiciones normales."},{"l":"C","h":"Compartir el mismo entorno con otros sistemas sin competir destructivamente por los recursos."},{"l":"D","h":"Límites máximos de usuarios, datos o ancho de banda cumpliendo el rendimiento exigido."},{"l":"E","h":"Intercambiar datos útiles con otros sistemas mediante protocolos y API estándar."},{"l":"F","h":"Grado en que el usuario identifica si el sistema es la herramienta adecuada."},{"l":"G","h":"Tasa de rendimiento: trabajo que el sistema procesa por unidad de tiempo."},{"l":"H","h":"Porcentaje de tiempo en que el sistema está operativo y accesible."},{"l":"I","h":"Cantidad y tipo de CPU, memoria, disco y red que consume el sistema."}],"k":7,"e":2},{"n":22,"t":"rel","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diaps. 86–87, 90"],"d":2,"s":["Relacionad cada subcaracterística con su definición. Atención: hay dos definiciones muy parecidas. Escribid la letra de la definición junto a cada número (sobran 2 definiciones)."],"a":["I","C","F","A","H","G","E"],"w":["La trampa está en la primera definición que sobra: describe la rendición de cuentas (accountability), que no está en la lista de conceptos. El no repudio es una prueba que impide negar un acto concreto; la rendición de cuentas es la trazabilidad de todas las acciones. La segunda que sobra es la analizabilidad."],"c":["Faultlessness","Availability","Fault tolerance","Recoverability","Confidentiality","Integrity","Non-repudiation"],"df":[{"l":"A","h":"Tras una falla crítica, se recupera (idealmente solo) y sin perder datos."},{"l":"B","h":"Rastrea de forma unívoca y auditable las acciones de una entidad hasta un responsable."},{"l":"C","h":"Porcentaje de tiempo en que el sistema está operativo y accesible."},{"l":"D","h":"Facilidad para diagnosticar las causas de un fallo."},{"l":"E","h":"Aporta evidencia que impide a un actor negar falsamente una acción."},{"l":"F","h":"Absorbe errores y mantiene un servicio aceptable, aunque sea degradado."},{"l":"G","h":"Previene y detecta la alteración no autorizada de la información o del estado."},{"l":"H","h":"Solo acceden a los datos quienes tienen la autorización adecuada."},{"l":"I","h":"¿Con qué frecuencia falla el sistema? Comportamiento libre de defectos."}],"k":7,"e":2},{"n":23,"t":"rel","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diaps. 90, 94"],"d":1,"s":["Relacionad cada subcaracterística de seguridad y de mantenibilidad con su definición. Escribid la letra de la definición junto a cada número (sobran 2 definiciones)."],"a":["H","E","F","B","G","I","A"],"w":["Definiciones de las diapositivas 90 y 94. Sobran la reemplazabilidad (flexibilidad) y el engagement (interacción)."],"c":["Authenticity","Accountability","Resistance","Modularity","Reusability","Analyzability","Modifiability"],"df":[{"l":"A","h":"Cambiar el código de forma eficiente sin introducir nuevos defectos."},{"l":"B","h":"Componentes independientes: un cambio en uno apenas afecta al resto."},{"l":"C","h":"Grado de compromiso y motivación que genera el sistema en el usuario."},{"l":"D","h":"Grado en que se puede sustituir un producto preexistente con el mínimo impacto."},{"l":"E","h":"Todo cambio queda vinculado de forma auditable a un responsable identificable."},{"l":"F","h":"Se mantiene operativo frente a ataques activos (fuerza bruta, inyecciones, DoS)."},{"l":"G","h":"Un componente se puede usar en otro sistema o función sin reescribirlo."},{"l":"H","h":"Se puede verificar que la identidad de un sujeto o recurso es la que afirma ser."},{"l":"I","h":"Facilidad para diagnosticar fallos y saber qué partes hay que cambiar."}],"k":7,"e":2},{"n":24,"t":"rel","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diaps. 95, 98–99"],"d":0,"s":["Relacionad cada concepto con su definición. Escribid la letra de la definición junto a cada número (sobran 2 definiciones)."],"a":["G","H","I","C","B","A","F"],"w":["La última definición que sobra describe la antigua portabilidad, que la flexibilidad abandona por estática. La otra es la coexistencia (compatibilidad)."],"c":["Testability","Adaptability","Scalability","Installability","Replaceability","Flexibility","Maintainability"],"df":[{"l":"A","h":"Característica que evalúa la capacidad de mutar, crecer y sobrevivir en entornos dinámicos."},{"l":"B","h":"Puede sustituir a otro producto en el mismo entorno con mínima fricción."},{"l":"C","h":"Se despliega o desinstala de forma limpia; hoy, con CI/CD y contenedores."},{"l":"D","h":"Mover código de un ordenador a otro sin cambios, entendido de forma estática."},{"l":"E","h":"Ejecutarse en el mismo entorno que otros sistemas sin interferencias."},{"l":"F","h":"Característica que evalúa la resistencia del diseño al paso del tiempo y a los cambios."},{"l":"G","h":"El sistema permite aislar componentes y ejecutar pruebas automáticas rápidas."},{"l":"H","h":"Se ajusta a cambios de hardware, sistema operativo o red sin modificar a fondo el código."},{"l":"I","h":"Maneja aumentos o descensos de carga pidiendo y liberando recursos de forma elástica."}],"k":7,"e":2},{"n":25,"t":"test","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diap. 80"],"d":0,"s":["En el portal de matrícula, la confirmación aparece en 1,5 s, pero cada clic consume el 90 % de la CPU del servidor. ¿Qué subcaracterística de la eficiencia de desempeño falla?"],"o":["La coexistencia (co-existence).","La reemplazabilidad (replaceability).","La utilización de recursos (resource utilization).","El comportamiento temporal (time behavior)."],"a":2,"w":["El tiempo de respuesta es bueno (comportamiento temporal correcto); lo que falla es el consumo de CPU para lograrlo. En palabras del tema: un sistema rápido que consume todos los recursos no es eficiente y no escalará. (Distractor plausible: d)."],"e":2},{"n":26,"t":"test","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diap. 80"],"d":0,"s":["Cuando el estudiante número 5 001 intenta matricularse, ¿qué hace un sistema con alta eficiencia de desempeño según el ejemplo del tema?"],"o":["Rechaza su petición con un mensaje de error y le pide que lo intente más tarde.","Muestra «Error 504 Gateway Timeout» a todos los usuarios conectados.","Amplía sin límite la base de datos para aceptar cualquier número de inscripciones.","Desactiva funciones secundarias para liberar RAM y lo coloca en una sala de espera virtual."],"a":3,"w":["El sistema detecta que ha llegado al límite y se degrada de forma inteligente: se ralentiza o restringe funciones, pero nunca deja de funcionar. Rechazar la petición no colapsa el sistema, pero tampoco atiende al estudiante; la sala de espera sí lo hace. (Distractor plausible: a)."],"e":2},{"n":27,"t":"test","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diaps. 83–84"],"d":2,"s":["Instaláis un software de BI en un servidor local donde ya funciona MariaDB. Primero comprobáis que los dos conviven sin bloquearse; después, que el BI envía las ventas al CRM en JSON y el CRM las entiende. ¿Qué habéis comprobado, en este orden?"],"o":["La utilización de recursos y después la interoperabilidad.","La interoperabilidad y después la coexistencia.","La coexistencia y después la interoperabilidad.","La adaptabilidad y después la instalabilidad."],"a":2,"w":["Convivir en el mismo entorno sin interferir es coexistencia, aunque se manifieste como consumo de recursos; lo que se evalúa es el efecto sobre el otro sistema, no la eficiencia propia. Intercambiar datos que el otro entiende es interoperabilidad. El tema insiste en el orden: una vez que conviven, entra en juego la interoperabilidad. (Distractor plausible: a)."],"e":2},{"n":28,"t":"test","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diap. 86"],"d":0,"s":["¿Qué subcaracterística de la confiabilidad responde a la pregunta «¿puede seguir funcionando, aunque sea de forma degradada, cuando falla uno de sus componentes?»?"],"o":["La coexistencia (co-existence).","La capacidad de recuperación (recoverability).","La resistencia (resistance).","La tolerancia a fallos (fault tolerance)."],"a":3,"w":["La tolerancia a fallos absorbe el error mientras ocurre y mantiene un servicio aceptable. La capacidad de recuperación actúa después de la caída (¿se recupera solo?, ¿pierde datos?). La resistencia es de security y trata de ataques. (Distractor plausible: b)."],"e":2},{"n":29,"t":"test","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diap. 91"],"d":0,"s":["La receta de un opioide se firma con el certificado digital del médico. Un mes después, el médico niega haberla emitido y el sistema aporta la firma como prueba. ¿Qué subcaracterística se demuestra?"],"o":["La rendición de cuentas (accountability).","El no repudio (non-repudiation).","La inclusividad (inclusivity).","La disponibilidad (availability)."],"a":1,"w":["La firma es una prueba que impide negar el acto: eso es no repudio. La rendición de cuentas sería el registro de quién hizo qué, cuándo y desde dónde, que veremos en la siguiente pregunta. (Distractor plausible: a)."],"e":2},{"n":30,"t":"test","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diap. 92"],"d":0,"s":["Los auditores extraen un registro inmutable con qué médico, a qué hora, desde qué ordenador y para qué paciente se emitió cada receta. ¿Qué subcaracterística es?"],"o":["El no repudio (non-repudiation).","La escalabilidad (scalability).","La rendición de cuentas (accountability).","La facilidad de aprendizaje (learnability)."],"a":2,"w":["Es trazabilidad completa de las acciones hasta un responsable identificable (diapositiva 92). El no repudio es parecido, pero se centra en impedir que alguien niegue un acto concreto con una prueba (la firma). (Distractor plausible: a)."],"e":2},{"n":31,"t":"test","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diap. 100"],"d":1,"s":["En Black Friday el tráfico se multiplica por cincuenta; la plataforma despliega automáticamente cien instancias más y las destruye al terminar. ¿Qué subcaracterística se demuestra?"],"o":["La escalabilidad (scalability), dentro de la flexibilidad.","La coexistencia (co-existence).","La capacidad (capacity), dentro de la eficiencia de desempeño.","La instalabilidad (installability)."],"a":0,"w":["La capacidad mide un límite máximo fijo; aquí lo que se demuestra es la elasticidad: pedir y liberar recursos según la demanda. Eso es escalabilidad (diapositiva 100). (Distractor plausible: c)."],"e":2},{"n":32,"t":"huecos","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diaps. 82–84"],"d":0,"s":["Completad el texto sobre la compatibilidad (sobran dos palabras). Ninguna aplicación empresarial vive {{1}}; cada {{2}} entre sistemas es un punto crítico donde la calidad puede quebrar, por lo que la integración debe diseñarse y evaluarse {{3}}. Si, al arrancar el software de informes, MariaDB se queda sin memoria {{4}} y se bloquea, hay un fallo de {{5}}. Si los datos llegan al CRM en un formato {{6}} que este no sabe leer, hay un problema de {{7}}."],"a":["A","F","E","I","B","H","G"],"w":["Sobran: escalabilidad, estándar. Un formato «estándar» (JSON, XML) es justo lo que resuelve el problema, no lo que lo causa. La escalabilidad es de flexibilidad."],"b":[{"l":"A","w":"aislada"},{"l":"B","w":"coexistencia"},{"l":"C","w":"escalabilidad"},{"l":"D","w":"estándar"},{"l":"E","w":"explícitamente"},{"l":"F","w":"frontera"},{"l":"G","w":"interoperabilidad"},{"l":"H","w":"propietario"},{"l":"I","w":"RAM"}],"k":7,"e":2},{"n":33,"t":"huecos","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diaps. 90–92"],"d":0,"s":["Completad el texto sobre la seguridad del hospital (sobran dos palabras). La seguridad no debe tratarse como una actividad {{1}} que se hace justo antes de producción, sino incorporarse desde el diseño (security by {{2}}). Pedir contraseña y huella al médico demuestra la {{3}}; impedir que un enfermero de otra planta lea el historial es {{4}}; bloquear la receta para que nadie cambie «10 mg» por «100 mg» es {{5}}; firmarla con certificado digital aporta {{6}}; y bloquear las IP de un ataque masivo para que urgencias siga recetando es {{7}}."],"a":["I","C","A","B","F","G","H"],"w":["Sobran: disponibilidad, escalabilidad. El ataque masivo podría hacer pensar en la disponibilidad, pero la característica de security que aguanta los ataques activos es la resistencia (diapositiva 92). La escalabilidad es de flexibilidad."],"b":[{"l":"A","w":"autenticidad"},{"l":"B","w":"confidencialidad"},{"l":"C","w":"design"},{"l":"D","w":"disponibilidad"},{"l":"E","w":"escalabilidad"},{"l":"F","w":"integridad"},{"l":"G","w":"no repudio"},{"l":"H","w":"resistencia"},{"l":"I","w":"separada"}],"k":7,"e":2},{"n":34,"t":"huecos","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diaps. 94–95"],"d":0,"s":["Completad el texto sobre la mantenibilidad (sobran dos palabras). El mayor coste de un sistema no está en su desarrollo {{1}}, sino en los años que pasa en {{2}}. La modularidad asegura que un cambio en un módulo tenga un impacto mínimo gracias al bajo {{3}}. La analizabilidad depende de la legibilidad del código, la calidad de los {{4}} y la trazabilidad. La modificabilidad permite cambiar el código sin introducir nuevos {{5}}. La testabilidad permite {{6}} componentes y ejecutar las pruebas de forma {{7}} y constante."],"a":["D","G","A","E","C","B","H"],"w":["Sobran: manual, requisitos. «Manual» contradice la testabilidad, que habla de verificación automatizada. «Requisitos» no aparece en la definición de analizabilidad (código, logs y trazabilidad)."],"b":[{"l":"A","w":"acoplamiento"},{"l":"B","w":"aislar"},{"l":"C","w":"defectos"},{"l":"D","w":"inicial"},{"l":"E","w":"logs"},{"l":"F","w":"manual"},{"l":"G","w":"producción"},{"l":"H","w":"rápida"},{"l":"I","w":"requisitos"}],"k":7,"e":2},{"n":35,"t":"huecos","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diaps. 98–99"],"d":0,"s":["Completad el texto sobre la flexibilidad (sobran dos palabras). La flexibilidad abandona la noción estática de {{1}} para evaluar la capacidad de un sistema de mutar y crecer en ecosistemas como la {{2}} y los sistemas distribuidos. La adaptabilidad permite ajustarse a cambios del entorno sin modificaciones {{3}} del código. La escalabilidad maneja subidas y bajadas de carga de forma {{4}} y es un requisito del {{5}}, no solo del servidor físico. La instalabilidad se asocia hoy al CI/CD y a la {{6}}. La reemplazabilidad mide si un componente puede {{7}} a otro preexistente con mínima fricción."],"a":["F","E","G","C","A","B","H"],"w":["Sobran: usabilidad, manual. La usabilidad evoluciona hacia la capacidad de interacción, no hacia la flexibilidad. «Manual» contradice la escalabilidad elástica y automática."],"b":[{"l":"A","w":"código"},{"l":"B","w":"contenedorización"},{"l":"C","w":"elástica"},{"l":"D","w":"manual"},{"l":"E","w":"nube"},{"l":"F","w":"portabilidad"},{"l":"G","w":"profundas"},{"l":"H","w":"sustituir"},{"l":"I","w":"usabilidad"}],"k":7,"e":2},{"n":36,"t":"diag","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diaps. 79–80"],"d":1,"s":["La figura muestra cómo responde el portal de matrícula al aumentar los estudiantes concurrentes. Completad los huecos con el concepto que describe cada zona."],"a":["C","A","D","E"],"w":["Sobran: Coexistencia, Interoperabilidad. El tramo bajo el límite muestra el comportamiento temporal (1,5 s). La línea vertical es la capacidad máxima medida en las pruebas de estrés. Por encima, el sistema bien diseñado se degrada de forma controlada; el mal diseñado cae de golpe con un 504 (diapositivas 79–80). Coexistencia e interoperabilidad son de compatibilidad."],"b":[{"l":"A","w":"Capacidad"},{"l":"B","w":"Coexistencia"},{"l":"C","w":"Comportamiento temporal"},{"l":"D","w":"Degradación controlada"},{"l":"E","w":"Fallo abrupto"},{"l":"F","w":"Interoperabilidad"}],"k":4,"e":2},{"n":37,"t":"diag","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diaps. 86–88"],"d":0,"s":["Completad la figura con la subcaracterística de confiabilidad que demuestra (o que falla en) cada hecho del caso de la aerolínea."],"a":["A","F","C","D"],"w":["Sobran: Resistencia, Capacidad. Es el caso de las diapositivas 87–88: errores frecuentes → ausencia de fallos (faultlessness); seguir funcionando degradado → tolerancia a fallos; volver solo y sin perder datos → capacidad de recuperación; porcentaje de tiempo operativo → disponibilidad. La resistencia es de security y la capacidad, de eficiencia de desempeño."],"b":[{"l":"A","w":"Ausencia de fallos"},{"l":"B","w":"Capacidad"},{"l":"C","w":"Capacidad de recuperación"},{"l":"D","w":"Disponibilidad"},{"l":"E","w":"Resistencia"},{"l":"F","w":"Tolerancia a fallos"}],"k":4,"e":2},{"n":38,"t":"ord","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diaps. 95–96"],"d":1,"s":["Ordenad los hechos del ejemplo de mantenibilidad (sistema de RR. HH. ante una nueva ley de impuestos). Escribid las letras en el orden correcto."],"a":["B","A","E","D","C"],"w":["El orden sigue el ejemplo de las diapositivas 95–96: analizabilidad → reusabilidad → modularidad y modificabilidad → testabilidad. Primero se entiende, luego se reutiliza, después se cambia y, por último, se verifica."],"it":[{"l":"A","h":"Gracias a los logs y al código legible, localizan en pocas horas el archivo de las retenciones."},{"l":"B","h":"Se aprueba una ley nueva y un equipo que no escribió el código debe actualizar las retenciones."},{"l":"C","h":"Ejecutan 500 cálculos simulados en un segundo antes de subir a producción."},{"l":"D","h":"Cambian las fórmulas fiscales sin romper los pagos al banco, porque el motor está separado."},{"l":"E","h":"Reutilizan la función de porcentajes que ya existía para otros bonos."}],"k":5,"e":2},{"n":39,"t":"ord","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diaps. 99–100"],"d":0,"s":["Ordenad los hechos del ejemplo de flexibilidad de la tienda online. Escribid las letras en el orden correcto."],"a":["B","D","A","C"],"w":["Es la secuencia de las diapositivas 99–100: adaptabilidad → instalabilidad → escalabilidad → reemplazabilidad."],"it":[{"l":"A","h":"En Black Friday despliegan cien instancias más y las destruyen al terminar."},{"l":"B","h":"Llevan el sistema a la nube con otro sistema operativo sin reescribir su lógica."},{"l":"C","h":"Sustituyen el proveedor de correos de confirmación en un solo día."},{"l":"D","h":"Con contenedores y un único comando, la tienda arranca en tres minutos."}],"k":4,"e":2},{"n":40,"t":"calc","m":["Tema 1","1.6 La norma ISO/IEC 25010:2023","Diaps. 86–88"],"d":0,"s":["Un servicio de reservas acumula 105,12 minutos de caída en un año de 365 días. ¿Qué disponibilidad ha tenido ese año? Pista: Pasad el año a minutos antes de dividir."],"o":["98,00 %","99,76 %","99,90 %","99,98 %"],"a":3,"w":["1. ¿Qué pregunta responde? ¿Qué fracción del año estuvo el servicio operativo y accesible?","2. Datos con unidades Tiempo total T = 365 días × 24 h × 60 min = 525 600 min. Tiempo de caída = 105,12 min.","3. Fórmula y por qué Disponibilidad = 1 − tiempo de caída / tiempo total La disponibilidad es el porcentaje de tiempo en que el sistema funciona (diapositiva 86). Restar a 1 la fracción de tiempo caído da la fracción de tiempo útil.","4. Sustitución 105,12 / 525 600 = 0,0002 1 − 0,0002 = 0,9998 → 99,98 %","5. Comprobación de sentido Menos de dos horas de caída en un año debe dar una disponibilidad muy cercana al 100 %: encaja.","6. Interpretación y decisión Por tanto, el servicio está entre el 99,9 % y el 99,99 %, a 0,01 puntos del objetivo de 99,99 % del ejemplo de la aerolínea.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora b) 99,76 %: 99,76 % sale de dividir entre los minutos de un mes (43 200) en lugar de los de un año: se mezclan periodos."],"e":2},{"n":41,"t":"rel","m":["Tema 1","1.7 Dilemas y prácticas en la calidad de software","Diaps. 104–110"],"d":1,"s":["Relacionad cada práctica con lo que hace para gestionar los dilemas de calidad. Escribid la letra de la definición junto a cada número (sobran 2 definiciones)."],"a":["B","F","D","I","A","C","E"],"w":["Las organizaciones maduras han abandonado la idea de probar «todo al 100 %» (diapositiva 109), y dejar la calidad para el final es justo lo contrario del shift-left: por eso sobran esas dos."],"c":["Feature toggles","Canary release","Seguridad adaptativa","MVP con deuda registrada","Verificación formal","Risk-Based Testing","SRE con observabilidad"],"df":[{"l":"A","h":"Modelos matemáticos que prueban la corrección del algoritmo antes de programarlo."},{"l":"B","h":"Lanzamientos ocultos: se despliega a diario sin exponer aún la función."},{"l":"C","h":"Concentra los recursos de calidad donde hay más probabilidad o impacto de fallo."},{"l":"D","h":"Se añade fricción solo cuando el riesgo de la acción lo justifica."},{"l":"E","h":"Asume que el sistema fallará e invierte en logs, métricas y trazas para bajar el MTTR."},{"l":"F","h":"Se despliega primero a un pequeño porcentaje de usuarios (p. ej., el 1 %)."},{"l":"G","h":"Dejar las pruebas para el final del proyecto para no frenar el desarrollo."},{"l":"H","h":"Probar todo al 100 % antes de cada entrega."},{"l":"I","h":"Deuda deliberada para validar una hipótesis, anotada en el backlog."}],"k":7,"e":3},{"n":42,"t":"rel","m":["Tema 1","1.8 El costo de la calidad del software","Diaps. 112–116"],"d":1,"s":["Relacionad cada tipo de coste con su descripción. Escribid la letra de la definición junto a cada número (sobran 2 definiciones)."],"a":["E","D","H","A","F","I","B"],"w":["Son las categorías de las diapositivas 112–116. Las dos que sobran describen el ROI y los spikes técnicos, que aparecen en el tema, pero no están en la lista de conceptos."],"c":["Costes de prevención","Costes de evaluación","Costes de falla interna","Costes de falla externa","CapEx","OpEx","Costes hundidos (sunk costs)"],"df":[{"l":"A","h":"Errores en producción: quejas, devoluciones, penalizaciones de SLA, churn."},{"l":"B","h":"Gasto que consume presupuesto sin añadir nuevo valor al producto."},{"l":"C","h":"Retorno de una inversión: beneficio obtenido dividido entre su coste."},{"l":"D","h":"Auditar el sistema antes de que llegue al usuario (CI, revisiones, pruebas)."},{"l":"E","h":"Inversión para evitar que los defectos se introduzcan (TDD, ADR, formación)."},{"l":"F","h":"Gasto capitalizable que añade valor estructural a largo plazo al activo."},{"l":"G","h":"Tareas de investigación previas a la implementación, registradas en el backlog."},{"l":"H","h":"Errores detectados antes del envío: repeticiones y efectos colaterales."},{"l":"I","h":"Gasto operativo y recurrente, como la ejecución continua de QA."}],"k":7,"e":3},{"n":43,"t":"rel","m":["Tema 1","1.9 La orquestación de la calidad","Diaps. 122–125"],"d":0,"s":["Relacionad cada elemento de la orquestación con su propósito. Escribid la letra de la definición junto a cada número (sobran 2 definiciones)."],"a":["C","G","A","F","H","D","I"],"w":["Las definiciones resumen las diapositivas 122–125. Las dos que sobran describen precisamente lo que la orquestación intenta evitar."],"c":["Análisis de requisitos","Diseño arquitectónico","Estimación de tiempos","Gestión del camino crítico","Planificación del riesgo","Control de calidad (QC)","Aseguramiento de la calidad (QA)"],"df":[{"l":"A","h":"Comprobar que las fechas son viables y evitar los despliegues heroicos."},{"l":"B","h":"Dejar que el cliente encuentre los defectos en producción."},{"l":"C","h":"Traducir necesidades ambiguas en especificaciones precisas y comprobables."},{"l":"D","h":"Inspeccionar el producto: revisar modelos y código y medir para mejorar."},{"l":"E","h":"Desplegar el viernes por la noche para cumplir la fecha comprometida."},{"l":"F","h":"Entender las dependencias para no bloquear a un equipo por otro."},{"l":"G","h":"Aplicar patrones para garantizar mantenibilidad, seguridad y eficiencia."},{"l":"H","h":"Responder qué puede salir mal y cuál es el plan de contingencia."},{"l":"I","h":"Dar gobernanza, herramientas y visibilidad para que QC e ingeniería funcionen."}],"k":7,"e":3},{"n":44,"t":"test","m":["Tema 1","1.7 Dilemas y prácticas en la calidad de software","Diap. 103"],"d":1,"s":["Una startup de cinco personas quiere lanzar su primera versión con defectos conocidos para ganar mercado y corregirlos en la 2.0. Según el tema, ¿qué valoración es la más adecuada?"],"o":["Es aceptable, porque el software «suficientemente bueno» es una práctica normalizada en toda la industria.","Es indiferente, porque los defectos conocidos no afectan a la calidad percibida.","Típicamente no es aceptable: sin una posición consolidada, la mala reputación puede hundir la empresa antes de la 2.0.","Es obligatorio, porque ISO/IEC 25010 exige publicar una versión 1.0 antes de medir la calidad."],"a":2,"w":["El éxito del enfoque good enough depende de la posición en el mercado (diapositiva 103). Una multinacional puede absorber las críticas; una startup puede quebrar. El distractor generaliza una práctica que solo es válida para quien domina el mercado. (Distractor plausible: a)."],"e":3},{"n":45,"t":"test","m":["Tema 1","1.7 Dilemas y prácticas en la calidad de software","Diap. 106"],"d":0,"s":["¿Cuándo es una buena práctica adquirir deuda técnica de forma deliberada según el tema?"],"o":["Al validar hipótesis de mercado (prototipos, MVP), siempre que quede registrada en el backlog para refactorizarla.","Nunca: cualquier deuda técnica es negligencia.","Al validar hipótesis de mercado, aunque no se registre, porque el MVP se va a tirar.","En el motor de facturación, para entregar antes las funciones críticas."],"a":0,"w":["La deuda deliberada en MVP es buena práctica; sin registro en el backlog se convierte en negligencia técnica. En los sistemas core, como la facturación, la mantenibilidad no es negociable (diapositiva 106). (Distractor plausible: c)."],"e":3},{"n":46,"t":"test","m":["Tema 1","1.7 Dilemas y prácticas en la calidad de software","Diap. 105"],"d":0,"s":["¿Cómo resuelve la industria el dilema entre usabilidad sin fricción y seguridad estricta?"],"o":["Con seguridad adaptativa: más fricción (p. ej., biometría) solo cuando el riesgo de la acción lo justifica.","Exigiendo autenticación multifactor en todas las pantallas, incluida la lectura del catálogo.","Dejando que cada usuario decida si quiere seguridad o no.","Quitando la autenticación de los pagos para no perder clientes."],"a":0,"w":["La usabilidad se favorece en la navegación pública; la seguridad rígida se impone en momentos críticos (perfil, pagos, historiales médicos). La seguridad adaptativa ajusta la fricción al riesgo. (Distractor plausible: b)."],"e":3},{"n":47,"t":"test","m":["Tema 1","1.8 El costo de la calidad del software","Diap. 114"],"d":0,"s":["Si el coste de evaluación de una empresa es nulo, ¿qué significa según el tema?"],"o":["Que todos los costes se han capitalizado como CapEx.","Que el cliente está actuando como departamento de calidad, un escenario catastrófico.","Que la prevención es tan buena que ya no hace falta evaluar.","Que la empresa ha alcanzado la máxima eficiencia."],"a":1,"w":["Sin evaluación, nadie busca los defectos antes de la entrega: los encuentra el cliente (diapositiva 114). Una buena prevención reduce los defectos, pero no elimina la necesidad de comprobarlo. (Distractor plausible: c)."],"e":3},{"n":48,"t":"test","m":["Tema 1","1.9 La orquestación de la calidad","Diap. 123"],"d":0,"s":["Según el tema, ¿qué es lo que protege una estimación realista de tiempos?"],"o":["Evita que un equipo quede bloqueado porque la infraestructura no está lista.","Sustituye a la integración continua.","Elimina la necesidad de documentar los requisitos.","Evita los «despliegues heroicos» de última hora, principal fuente de inyección de defectos críticos."],"a":3,"w":["La diapositiva 123 dice que la estimación realista protege de los despliegues heroicos. El distractor describe la gestión del camino crítico, otra técnica de administración distinta. (Distractor plausible: a)."],"e":3},{"n":49,"t":"huecos","m":["Tema 1","1.7 Dilemas y prácticas en la calidad de software","Diaps. 107–108"],"d":1,"s":["Completad el texto sobre los sistemas críticos (sobran dos palabras). El software «suficientemente bueno» colapsa cuando el software interactúa con el mundo {{1}}: allí liberar código con errores puede constituir {{2}} o delito. Se aplican normas como DO-178C en {{3}} o IEC 62304 en dispositivos {{4}}. Las prácticas exigidas incluyen la verificación {{5}} con modelos matemáticos, la cobertura estructural {{6}}, que prueba cada condición de forma independiente, y la redundancia de N-versiones, que decide por {{7}} mayoritaria."],"a":["C","G","A","F","D","E","I"],"w":["Sobran: virtual, ferrocarril. DO-178C es la norma de aviación (el tema no cita normas ferroviarias). «Virtual» es lo opuesto al mundo físico donde las reglas cambian a tolerancia cero."],"b":[{"l":"A","w":"aviación"},{"l":"B","w":"ferrocarril"},{"l":"C","w":"físico"},{"l":"D","w":"formal"},{"l":"E","w":"MC/DC"},{"l":"F","w":"médicos"},{"l":"G","w":"negligencia"},{"l":"H","w":"virtual"},{"l":"I","w":"votación"}],"k":7,"e":3},{"n":50,"t":"huecos","m":["Tema 1","1.8 El costo de la calidad del software","Diaps. 113–115"],"d":1,"s":["Completad el texto sobre la economía de la calidad (sobran dos palabras). Las actividades de prevención tienen el mayor {{1}}. Se registran en el backlog como tareas de análisis, de diseño o como {{2}} técnicos. Fiscalmente, la prevención tributa como {{3}}, mientras que la ejecución continua de pruebas y el tiempo de QA tributan como {{4}}. Las fallas internas son costes {{5}}: destruyen la {{6}} del equipo y se miden con el porcentaje de tiempo dedicado a retrabajo, que debería quedar por debajo del {{7}}."],"a":["G","H","C","F","E","I","A"],"w":["Sobran: 50 %, churn. El churn (fuga de clientes) es una consecuencia de las fallas externas, no de las internas. El umbral de retrabajo del tema es el 15 %."],"b":[{"l":"A","w":"15 %"},{"l":"B","w":"50 %"},{"l":"C","w":"CapEx"},{"l":"D","w":"churn"},{"l":"E","w":"hundidos"},{"l":"F","w":"OpEx"},{"l":"G","w":"ROI"},{"l":"H","w":"spikes"},{"l":"I","w":"velocidad"}],"k":7,"e":3},{"n":51,"t":"huecos","m":["Tema 1","1.9 La orquestación de la calidad","Diaps. 124–125"],"d":1,"s":["Completad el texto sobre QC y QA (sobran dos palabras). El control de calidad (QC) es la inspección del {{1}}: revisa modelos como los diagramas UML antes de {{2}} y aplica mediciones con {{3}} para mejorar el proceso; si una métrica indica alta densidad de defectos en un módulo, alerta para refactorizar. El aseguramiento de la calidad (QA) es la auditoría del {{4}}: proporciona la {{5}}, las herramientas y la visibilidad, define los estándares de codificación, configura los entornos de {{6}} continua y traduce métricas técnicas en indicadores de {{7}} del proyecto."],"a":["G","C","H","F","B","D","I"],"w":["Sobran: cliente, marketing. La clave es la dicotomía producto/proceso: QC inspecciona el producto; QA audita el proceso y da la gobernanza."],"b":[{"l":"A","w":"cliente"},{"l":"B","w":"gobernanza"},{"l":"C","w":"implementarlos"},{"l":"D","w":"integración"},{"l":"E","w":"marketing"},{"l":"F","w":"proceso"},{"l":"G","w":"producto"},{"l":"H","w":"retroalimentación"},{"l":"I","w":"salud"}],"k":7,"e":3},{"n":52,"t":"huecos","m":["Tema 1","1.9 La orquestación de la calidad","Diap. 122"],"d":0,"s":["Completad el texto sobre las prácticas de ingeniería (sobran dos palabras). El análisis de {{1}} sigue hoy la norma IEEE {{2}}, que reemplaza a la IEEE 830:1998. Consiste en traducir necesidades {{3}} del negocio en especificaciones precisas, {{4}} y libres de contradicciones; un fallo aquí {{5}} cualquier esfuerzo posterior. Después, el diseño {{6}} aplica patrones para garantizar los atributos de calidad exigidos por estándares como ISO/IEC {{7}}."],"a":["I","B","E","G","H","F","A"],"w":["Sobran: 9001, 730. ISO 9001 es la norma del sistema de gestión (Tema 3) e IEEE 730, la de los planes de SQA. Ninguna de las dos regula los requisitos ni los atributos del producto."],"b":[{"l":"A","w":"25010"},{"l":"B","w":"29148:2018"},{"l":"C","w":"730"},{"l":"D","w":"9001"},{"l":"E","w":"ambiguas"},{"l":"F","w":"arquitectónico"},{"l":"G","w":"comprobables"},{"l":"H","w":"invalida"},{"l":"I","w":"requisitos"}],"k":7,"e":3},{"n":53,"t":"diag","m":["Tema 1","1.8 El costo de la calidad del software","Diaps. 112–116"],"d":1,"s":["Completad el mapa de costes de calidad."],"a":["G","C","E","D","A","B"],"w":["Sobran: OpEx, Velocity. Prevención y evaluación son «construir bien»; las fallas interna y externa, «arreglar». La prevención tributa como CapEx; la falla interna es un coste hundido. OpEx es tentador para la casilla 5, pero corresponde a la ejecución continua de la evaluación y a las fallas externas (diapositivas 113–116)."],"b":[{"l":"A","w":"CapEx"},{"l":"B","w":"Costes hundidos"},{"l":"C","w":"Evaluación"},{"l":"D","w":"Falla externa"},{"l":"E","w":"Falla interna"},{"l":"F","w":"OpEx"},{"l":"G","w":"Prevención"},{"l":"H","w":"Velocity"}],"k":6,"e":3},{"n":54,"t":"diag","m":["Tema 1","1.9 La orquestación de la calidad","Diaps. 121–125"],"d":0,"s":["Completad el mapa de la orquestación de la calidad."],"a":["G","I","H","D","E","C","A"],"w":["Sobran: Marketing de producto, Atención al cliente. Son los tres frentes de la diapositiva 121 y sus elementos (122–125). Las siete respuestas se admiten en cualquier orden dentro de las casillas, siempre que estén todas y no entren los dos distractores."],"b":[{"l":"A","w":"Aseguramiento de la calidad (QA)"},{"l":"B","w":"Atención al cliente"},{"l":"C","w":"Control de calidad (QC)"},{"l":"D","w":"Diseño arquitectónico"},{"l":"E","w":"Gestión del camino crítico"},{"l":"F","w":"Marketing de producto"},{"l":"G","w":"Prácticas de ingeniería de software"},{"l":"H","w":"QC frente a QA"},{"l":"I","w":"Técnicas de administración de proyectos"}],"k":7,"unordered":true,"e":3},{"n":55,"t":"ord","m":["Tema 1","1.8 El costo de la calidad del software","Diaps. 112–116"],"d":0,"s":["Ordenad las cuatro categorías de coste de calidad desde la que actúa antes (cuando el defecto aún no existe) hasta la que actúa más tarde. Escribid las letras en el orden correcto."],"a":["C","B","D","A"],"w":["La prevención evita el defecto; la evaluación lo busca antes de entregar; la falla interna se paga cuando se encuentra antes del envío, y la externa, cuando ya está en producción."],"it":[{"l":"A","h":"Falla externa"},{"l":"B","h":"Evaluación"},{"l":"C","h":"Prevención"},{"l":"D","h":"Falla interna"}],"k":4,"e":3},{"n":56,"t":"ord","m":["Tema 1","1.8 El costo de la calidad del software","Diap. 117"],"d":0,"s":["Ordenad las fases del ciclo de vida de menor a mayor coste de corrección de un defecto. Escribid las letras en el orden correcto."],"a":["A","D","E","C","B"],"w":["La curva de la diapositiva 117 crece de forma geométrica: 139 $ → 455 $ → 977 $ → 7 136 $ → 14 102 $."],"it":[{"l":"A","h":"Requisitos"},{"l":"B","h":"Mantenimiento (producción)"},{"l":"C","h":"Pruebas"},{"l":"D","h":"Diseño"},{"l":"E","h":"Codificación"}],"k":5,"e":3},{"n":57,"t":"calc","m":["Tema 1","1.8 El costo de la calidad del software","Diap. 117"],"d":0,"s":["Según la curva de costes del tema, corregir un defecto cuesta 139 $ en requisitos y 7 136 $ si se detecta en pruebas. ¿Cuántas veces más cuesta corregirlo en pruebas?"],"o":["≈ 7,3 veces","≈ 15,7 veces","≈ 51 veces","≈ 6 997 veces"],"a":2,"w":["1. ¿Qué pregunta responde? ¿Cuántas veces se multiplica el coste al pasar de requisitos a pruebas?","2. Datos con unidades Coste en requisitos = 139 $. Coste en pruebas = 7 136 $.","3. Fórmula y por qué Factor = coste tardío / coste temprano «Cuántas veces más» es una razón entre dos cantidades, así que se divide.","4. Sustitución 7 136 / 139 = 51,34 → unas 51 veces","5. Comprobación de sentido 7 136 está entre 50 y 52 veces 139 (139 × 50 = 6 950): encaja.","6. Interpretación y decisión Por tanto, cada defecto de requisitos que llega a pruebas cuesta unas 51 veces más: invertir en revisar requisitos se paga solo.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora d) ≈ 6 997 veces: 6 997 es la resta (7 136 − 139): eso son dólares de diferencia, no «veces». 15,7 y 7,3 usan como base el diseño (455 $) o la codificación (977 $)."],"e":3},{"n":58,"t":"calc","m":["Tema 1","1.8 El costo de la calidad del software","Diaps. 117–118"],"d":2,"s":["Un equipo detecta 8 defectos en la fase de requisitos, pero decide no corregirlos todavía. Si llegan a mantenimiento (producción), ¿cuánto dinero adicional costará corregirlos frente a hacerlo ahora? Usad la curva del tema."],"o":["13 963 $","55 976 $","111 704 $","112 816 $"],"a":2,"w":["1. ¿Qué pregunta responde? ¿Cuánto se paga de más por corregir 8 defectos en mantenimiento en vez de en requisitos?","2. Datos con unidades n = 8 defectos. Coste en requisitos = 139 $/defecto. Coste en mantenimiento = 14 102 $/defecto.","3. Fórmula y por qué Sobrecoste = n × (coste en mantenimiento − coste en requisitos) Piden el dinero «adicional», no el total: hay que restar lo que costaría corregirlos ahora.","4. Sustitución 14 102 − 139 = 13 963 $ por defecto 8 × 13 963 = 111 704 $","5. Comprobación de sentido Debe ser algo menos que 8 × 14 102 = 112 816 $, porque se descuenta el coste que se pagaría igualmente.","6. Interpretación y decisión Por tanto, aplazar esos defectos tiene un sobrecoste de unos 112 000 $: corregidlos ahora.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora d) 112 816 $: 112 816 $ es el coste total en mantenimiento (8 × 14 102), sin restar lo que habría costado corregirlos en requisitos. 13 963 $ es el sobrecoste de un solo defecto y 55 976 $ usa el coste de pruebas."],"e":3},{"n":59,"t":"calc","m":["Tema 1","1.8 El costo de la calidad del software","Diap. 115"],"d":1,"s":["En un sprint, un equipo dedica 960 horas de ingeniería; de ellas, 192 se van en rehacer trabajo por defectos internos. ¿Qué porcentaje de retrabajo tiene y cumple la referencia del tema?"],"o":["3,3 %; cumple la referencia","12 %; cumple la referencia","20 %; no cumple la referencia","25 %; no cumple la referencia"],"a":2,"w":["1. ¿Qué pregunta responde? ¿Qué parte del tiempo de ingeniería se pierde en retrabajo y está por debajo del 15 %?","2. Datos con unidades Horas totales = 960 h. Horas de retrabajo = 192 h. Referencia: retrabajo < 15 %.","3. Fórmula y por qué % de retrabajo = horas de retrabajo / horas totales de ingeniería × 100 El tema mide las fallas internas con el porcentaje de tiempo de ingeniería dedicado a retrabajo (diapositiva 115); la base es el tiempo total.","4. Sustitución 192 / 960 = 0,20 → 20 %","5. Comprobación de sentido 192 es la quinta parte de 960, así que el 20 % encaja.","6. Interpretación y decisión Por tanto, el retrabajo supera el 15 %: hay un fallo sistémico en la prevención.","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora d) 25 %; no cumple la referencia: 25 % sale de dividir entre las horas «productivas» (960 − 192 = 768) en lugar de entre el total."],"e":3},{"n":60,"t":"calc","m":["Tema 1","1.8 El costo de la calidad del software","Diaps. 112–116"],"d":2,"s":["En un año, una empresa gasta 400 000 € en calidad: 60 000 € en prevención, 40 000 € en evaluación, 90 000 € en fallas internas y 210 000 € en fallas externas. ¿Qué porcentaje del gasto se va en fallas?"],"o":["22,5 %","25 %","52,5 %","75 %"],"a":3,"w":["1. ¿Qué pregunta responde? ¿Qué parte del presupuesto de calidad se dedica a arreglar lo que salió mal?","2. Datos con unidades Prevención = 60 000 €; evaluación = 40 000 €. Falla interna = 90 000 €; falla externa = 210 000 €. Total = 400 000 €.","3. Fórmula y por qué % de fallas = (falla interna + falla externa) / total × 100 Las fallas son las dos categorías de «arreglar las cosas que salieron mal»; prevención y evaluación son «construir bien» (diapositiva 112).","4. Sustitución 90 000 + 210 000 = 300 000 € 300 000 / 400 000 = 0,75 → 75 %","5. Comprobación de sentido Las fallas son tres veces lo invertido en prevención y evaluación (100 000 €), así que deben ser tres cuartas partes del total.","6. Interpretación y decisión Por tanto, la empresa paga sobre todo la no calidad: debe trasladar presupuesto a prevención (shift-left).","TRAMPA DE LA OPCIÓN CONFUSORA Opción confusora c) 52,5 %: 52,5 % solo cuenta las fallas externas (210 000 / 400 000). 22,5 % solo cuenta las internas y 25 % es la parte de prevención y evaluación."],"e":3},{"n":61,"t":"rel","m":["Tema 2","2.i Introducción","2.0 El proceso de revisión","Diaps. 7, 10–12"],"d":0,"s":["Relacionad cada concepto con su definición. Escribid la letra de la definición junto a cada número (sobran 2 definiciones)."],"a":["C","A","D","F","G","B","E"],"w":["Las definiciones salen de las diapositivas 7 y 10–12. La primera que sobra describe el cierre (fase 6), que no está en la lista de conceptos; la segunda es el rubber-stamping."],"c":["Error","Defecto","Planificación","Preparación","Revisión o examen","Registro de defectos","Corrección y seguimiento"],"df":[{"l":"A","h":"Problema detectado después de entregar, o propagado de una actividad del proceso a otra."},{"l":"B","h":"Comentarios trazables sobre la línea de código, clasificados por severidad."},{"l":"C","h":"Problema de calidad detectado durante el desarrollo, antes de la entrega."},{"l":"D","h":"Decidir qué cambio se revisa, sus riesgos, las partes críticas y quién debe revisarlo."},{"l":"E","h":"El autor corrige, se repiten las comprobaciones y se verifica que no hay fallos nuevos."},{"l":"F","h":"El autor deja el PR pequeño y explicado; el revisor estudia el contexto antes de juzgar."},{"l":"G","h":"Inspección real del producto: revisión de pares, análisis estático, pruebas, CI/CD."},{"l":"H","h":"Aprobar un PR sin leerlo realmente."},{"l":"I","h":"Confirmar el despliegue, vigilar métricas y mejorar la checklist después del merge."}],"k":7,"e":4},{"n":62,"t":"rel","m":["Tema 2","2.1 Métricas de revisión: Cycle Time, Lead Time, tasa de rechazo","Diaps. 18–19"],"d":0,"s":["Relacionad cada métrica o concepto de flujo con su definición. Escribid la letra de la definición junto a cada número (sobran 2 definiciones)."],"a":["F","A","H","G","B","C","I"],"w":["Definiciones de las diapositivas 18–19. Sobran el MTTR (que DORA añade al marco) y el tamaño del PR, que se mide junto al Cycle Time, pero no es una de estas métricas."],"c":["Lead Time","Cycle Time","Idle Time","Tasa de rechazo","Value Stream","WIP","Milestone"],"df":[{"l":"A","h":"Desde el primer commit hasta que el código está fusionado y desplegado."},{"l":"B","h":"Todos los pasos, de la idea al usuario final, que generan valor de negocio."},{"l":"C","h":"Número de tareas abiertas y sin terminar en un momento dado."},{"l":"D","h":"Número de líneas modificadas en un PR."},{"l":"E","h":"Tiempo medio de recuperación del servicio tras un fallo."},{"l":"F","h":"Desde que el cliente pide una funcionalidad hasta que está en producción."},{"l":"G","h":"Porcentaje de PR devueltos con peticiones de cambio significativas."},{"l":"H","h":"Tramo del Cycle Time con el PR abierto y listo, pero sin que nadie lo revise."},{"l":"I","h":"Agrupa issues y PR bajo un objetivo y una fecha para limitar el trabajo en curso."}],"k":7,"e":4},{"n":63,"t":"rel","m":["Tema 2","2.1 Métricas de revisión: Cycle Time, Lead Time, tasa de rechazo","Diaps. 16, 19, 21"],"d":0,"s":["Relacionad cada antipatrón o ley con su descripción. Escribid la letra de la definición junto a cada número (sobran 2 definiciones)."],"a":["B","I","G","A","H","C","E"],"w":["Los antipatrones están en la tabla de errores frecuentes (diapositiva 21). Las dos frases que sobran describen buenas prácticas (micro-PR y Draft PR), no antipatrones."],"c":["Rubber-stamping","Optimización local ciega","Ignorar el tamaño del lote","Confundir Lead Time con Cycle Time","Fatiga de métricas","Ley de Goodhart","Ley de Little"],"df":[{"l":"A","h":"Decir «vamos rápido» con 3 días de ciclo cuando el cliente lleva 14 esperando."},{"l":"B","h":"Aprobar un PR de forma mecánica, sin leerlo."},{"l":"C","h":"Si una métrica se convierte en objetivo, deja de ser una buena métrica."},{"l":"D","h":"Abrir un PR en borrador para validar el enfoque antes de escribir los tests."},{"l":"E","h":"El trabajo en curso es igual a la tasa de llegada por el tiempo de permanencia."},{"l":"F","h":"Limitar los PR a 200–400 líneas modificadas."},{"l":"G","h":"Medir el Cycle Time sin controlar cuántas líneas tiene cada PR."},{"l":"H","h":"Instalar quince métricas a la vez sin que el equipo entienda para qué sirven."},{"l":"I","h":"Presionar para bajar el Cycle Time a toda costa: «aprobad más rápido»."}],"k":7,"e":4},{"n":64,"t":"test","m":["Tema 2","2.i Introducción","Diap. 7"],"d":0,"s":["Según el Tema 2, ¿cuál es la diferencia entre un error y un defecto?"],"o":["El error lo comete el usuario y el defecto, la máquina.","El error se detecta antes de entregar el software; el defecto, después de entregarlo o al propagarse de una actividad del proceso a otra.","Son sinónimos: los dos se refieren a cualquier fallo del código.","El error es un fallo de sintaxis y el defecto, un fallo de lógica de negocio."],"a":1,"w":["La distinción es temporal, no técnica: depende de cuándo se detecta el problema. Encontrar errores se celebra (los filtros funcionan); un defecto es carísimo. (Distractor plausible: d)."],"e":4},{"n":65,"t":"test","m":["Tema 2","2.i Introducción","Diap. 7"],"d":0,"s":["¿Cómo reparten las revisiones los equipos modernos según el tema?"],"o":[
