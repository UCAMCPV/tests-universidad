citamente en otro espacio de características.","src":"nueva","ref":"Tema 2.2 · SVM","note":""},{"id":"q0199","s":"2.2","q":"Un KNN de clasificación utiliza K=5 y tres vecinos votan «rojo» frente a dos «azul». ¿Qué predice en votación uniforme?","o":["Promedio 2,5","No puede clasificar","Azul","Rojo"],"a":[3],"why":"La mayoría de los cinco vecinos determina rojo.","src":"nueva","ref":"Tema 2.2 · KNN","note":""},{"id":"q0201","s":"2.2","q":"En KNN de regresión los tres vecinos tienen objetivos 10, 20 y 30. ¿Qué predicción resulta con promedio uniforme?","o":["60","20","3","10"],"a":[1],"why":"La media es (10+20+30)/3=20.","src":"nueva","ref":"Tema 2.2 · KNN","note":""},{"id":"q0202","s":"2.2","q":"Un K-Means con K=4, ¿qué número de centros debe mantener?","o":["1","Número desconocido sin parámetros","4","16"],"a":[2],"why":"K-Means mantiene exactamente K centroides en su formulación habitual.","src":"nueva","ref":"Tema 2.2 · K-Means","note":""},{"id":"q0203","s":"2.2","q":"¿Qué operación se repite durante el funcionamiento de K-Means?","o":["Asignar puntos a centroides y recalcular centroides","Aplicar SMOTE a todas las variables","Generar falsas etiquetas","Calcular gradientes de una CNN"],"a":[0],"why":"K-Means alterna asignación al centro más próximo y actualización de centros.","src":"nueva","ref":"Tema 2.2 · K-Means","note":""},{"id":"q0204","s":"2.2","q":"Un algoritmo debe encontrar grupos de forma irregular y detectar ruido sin fijar K. ¿Cuál?","o":["DBSCAN","K-Means con K fijo","Regresión logística","Random Forest supervisado"],"a":[0],"why":"DBSCAN usa densidad de vecinos y puede marcar observaciones como ruido.","src":"nueva","ref":"Tema 2.2 · DBSCAN","note":""},{"id":"q0207","s":"2.2","q":"Un analista quiere visualizar cómo se van fusionando grupos en clustering jerárquico. ¿Qué representación utilizar?","o":["Gráfico ROC necesariamente","Dendrograma","Matriz de confusión","Curva de pérdida de CNN"],"a":[1],"why":"El dendrograma representa estructura jerárquica y fusiones.","src":"nueva","ref":"Tema 2.2 · Jerárquico","note":""},{"id":"q0208","s":"2.2","q":"¿Qué variante de clustering jerárquico empieza con cada registro como un grupo individual?","o":["Divisiva","Supervisada binaria","Regresión jerárquica","Aglomerativa"],"a":[3],"why":"El clustering aglomerativo une progresivamente grupos inicialmente individuales.","src":"nueva","ref":"Tema 2.2 · Jerárquico","note":""},{"id":"q0209","s":"2.2","q":"Una red densa recibe variables tabulares y posee capas ocultas completamente conectadas. ¿Qué arquitectura describe?","o":["MLP","K-Means","CNN necesariamente","DBSCAN"],"a":[0],"why":"Un perceptrón multicapa organiza capas densas de neuronas para aprendizaje supervisado.","src":"nueva","ref":"Tema 2.2 · MLP","note":""},{"id":"q0210","s":"2.2","q":"Una CNN aprende bordes y texturas de una fotografía. ¿Qué operación es la más característica?","o":["Convolución con filtros","Muestreo Bootstrap","Interpolación por medias","Dendrograma"],"a":[0],"why":"Filtros convolucionales responden a patrones locales en la imagen.","src":"nueva","ref":"Tema 2.2 · CNN","note":""},{"id":"q0211","s":"2.2","q":"¿Qué suele conseguir el pooling en una CNN?","o":["Convertir el modelo en SVM","Reducir dimensiones espaciales de mapas de características","Crear etiquetas de clase manuales","Calcular AUC"],"a":[1],"why":"Pooling realiza una reducción espacial de representaciones intermedias.","src":"nueva","ref":"Tema 2.2 · CNN","note":""},{"id":"q0214","s":"2.2","q":"¿Qué arquitectura se especializa en dependencias temporales y cuenta con puertas de memoria?","o":["PCA","LSTM","Regresión logística","K-Means"],"a":[1],"why":"LSTM utiliza una celda de memoria y puertas para manejar secuencias.","src":"nueva","ref":"Tema 2.2 · LSTM","note":""},{"id":"q0215","s":"2.2","q":"Una LSTM decide cuánta información nueva incorpora al estado de memoria. ¿Qué puerta participa?","o":["Índice de silueta","Softmax de clases","Puerta de olvido únicamente","Puerta de entrada (input gate)"],"a":[3],"why":"La puerta de entrada regula la incorporación de nueva información al estado de la celda.","src":"nueva","ref":"Tema 2.2 · LSTM","note":""},{"id":"q0216","s":"2.2","q":"En LSTM, ¿qué puerta interviene al determinar información que se expone como salida?","o":["Puerta de salida (output gate)","Puerta de codificación de categorías","Puerta de clustering","Muestreo con reemplazo"],"a":[0],"why":"Output gate modula la información del estado de celda utilizada en la salida.","src":"nueva","ref":"Tema 2.2 · LSTM","note":""},{"id":"q0217","s":"2.2","q":"¿Qué red recurrente usa una arquitectura de puertas relativamente más sencilla que LSTM?","o":["Regresión lineal","GRU","MLP sin memoria","CNN"],"a":[1],"why":"GRU es una alternativa recurrente con menos mecanismos de puerta que la arquitectura LSTM estándar.","src":"nueva","ref":"Tema 2.2 · GRU","note":""},{"id":"q0218","s":"2.2","q":"¿Qué dos partes forman un autoencoder?","o":["Train y test exclusivamente","Accuracy y Recall","Encoder y decoder","Kernel y gamma"],"a":[2],"why":"El encoder produce una representación latente y el decoder reconstruye la entrada.","src":"nueva","ref":"Tema 2.2 · Autoencoder","note":""},{"id":"q0219","s":"2.2","q":"Una tarea consiste en reconstruir una imagen deteriorada utilizando una representación comprimida aprendida. ¿Qué modelo sería razonable?","o":["K-Means exclusivamente","Autoencoder","SVR obligado","Clustering jerárquico"],"a":[1],"why":"Una variante de autoencoder puede aprender representaciones para reconstrucción y eliminación de ruido.","src":"nueva","ref":"Tema 2.2 · Autoencoder","note":""},{"id":"q0220","s":"2.2","q":"¿Qué característica tiene la función sigmoide?","o":["Solo devuelve números negativos","Su rango está entre 0 y 1","La suma de todas sus neuronas es necesariamente 1","Siempre produce enteros"],"a":[1],"why":"La función logística produce activaciones en (0,1).","src":"nueva","ref":"Tema 2.2 · Activaciones","note":""},{"id":"q0221","s":"2.2","q":"Una neurona recibe valor −3 y usa ReLU. ¿Qué salida produce?","o":["0,95","3","0","−3"],"a":[2],"why":"ReLU(x)=max(0,x), por lo que ReLU(−3)=0.","src":"nueva","ref":"Tema 2.2 · Activaciones","note":""},{"id":"q0222","s":"2.2","q":"¿Qué función permite una pendiente pequeña para entradas negativas y mitiga neuronas muertas?","o":["Lineal exclusivamente","Leaky ReLU","Softmax","PCA"],"a":[1],"why":"Leaky ReLU mantiene una pequeña pendiente en la región negativa.","src":"nueva","ref":"Tema 2.2 · Activaciones","note":""},{"id":"q0223","s":"2.2","q":"¿Qué activación transforma varias puntuaciones en probabilidades que suman uno?","o":["ReLU","Softmax","Tanh por sí sola","Lineal"],"a":[1],"why":"Softmax normaliza exponenciales entre categorías mutuamente excluyentes.","src":"nueva","ref":"Tema 2.2 · Activaciones","note":""},{"id":"q0224","s":"2.2","q":"Una red clasifica cada imagen en exactamente cinco clases y sus etiquetas son enteros 0–4. ¿Qué pérdida es adecuada?","o":["Silhouette","Binary Cross-Entropy exclusivamente","Sparse Categorical Cross-Entropy","MAE de regresión obligatoria"],"a":[2],"why":"Con etiquetas enteras y Softmax se usa entropía cruzada categórica dispersa.","src":"nueva","ref":"Tema 2.2 · Pérdidas","note":""},{"id":"q0225","s":"2.2","q":"Una red pronostica una temperatura numérica. ¿Qué activación y coste constituyen una combinación habitual?","o":["Softmax + Categorical Cross-Entropy","Lineal + MSE","Sigmoide + IoU","ReLU + F1"],"a":[1],"why":"Regresión continua: salida lineal con función de pérdida numérica como MSE.","src":"nueva","ref":"Tema 2.2 · Combinaciones","note":""},{"id":"q0226","s":"2.2","q":"Una red decide «fraude/no fraude» con un único logit. ¿Qué combinación de activación y pérdida es habitual?","o":["Softmax + MSE","Lineal + Categorical Cross-Entropy","ReLU + Silhouette","Sigmoide + Binary Cross-Entropy"],"a":[3],"why":"Para una salida binaria se usa sigmoide y entropía cruzada binaria, o directamente BCE con logits.","src":"nueva","ref":"Tema 2.2 · Combinaciones","note":""},{"id":"q0227","s":"2.2","q":"En un detector multietiqueta, cada foto puede tener simultáneamente gato y perro. ¿Qué activación final tiene sentido?","o":["Sigmoide independiente por etiqueta","Softmax excluyente obligatoriamente","Pooling como salida","Lineal sin pérdida"],"a":[0],"why":"Las etiquetas no son excluyentes: cada clase se predice con su propia probabilidad.","src":"nueva","ref":"Tema 2.2 · Multietiqueta","note":""},{"id":"q0228","s":"2.2","q":"Se quiere penalizar más errores grandes en predicción numérica. ¿Qué función de coste encaja?","o":["MSE","Accuracy","MAE necesariamente de la misma forma","Índice de silueta"],"a":[0],"why":"Elevar el error al cuadrado incrementa el coste relativo de desviaciones grandes.","src":"nueva","ref":"Tema 2.2 · Pérdidas","note":""},{"id":"q0229","s":"2.2","q":"Se desea una pérdida de regresión menos sensible a valores extremos. ¿Cuál suele ser preferible?","o":["MSE siempre","Hinge Loss exclusivamente","MAE","Categorical Cross-Entropy"],"a":[2],"why":"El error absoluto evita elevar al cuadrado desviaciones grandes.","src":"nueva","ref":"Tema 2.2 · Pérdidas","note":""},{"id":"q0230","s":"2.2","q":"¿Qué pérdida se asocia a modelos de clasificación basados en margen, como SVM?","o":["MAPE","Silhouette","Hinge Loss","Mean Absolute Error exclusivamente"],"a":[2],"why":"Hinge penaliza márgenes insuficientes o clasificaciones incorrectas.","src":"nueva","ref":"Tema 2.2 · Pérdidas","note":""},{"id":"q0231","s":"2.2","q":"Un modelo genera una distribución de probabilidad y se compara con otra distribución objetivo. ¿Qué medida podría utilizarse?","o":["Divergencia Kullback-Leibler","PCA","SSW de K-Means","max_depth"],"a":[0],"why":"KL cuantifica discrepancia entre distribuciones probabilísticas.","src":"nueva","ref":"Tema 2.2 · Pérdidas","note":""},{"id":"q0234","s":"2.2","q":"¿Qué mecanismo desactiva aleatoriamente unidades durante entrenamiento para ayudar a regularizar?","o":["Softmax","Dropout","Min-Max","DBSCAN"],"a":[1],"why":"Dropout desactiva unidades de manera aleatoria en entrenamiento para reducir coadaptación y sobreajuste.","src":"nueva","ref":"Tema 2.2 · Regularización","note":""},{"id":"q0235","s":"2.2","q":"En una clasificación multiclase con etiquetas One-Hot, ¿qué par es correcto?","o":["Softmax + Categorical Cross-Entropy","Lineal + MAE","Tanh + Silhouette","Sigmoide + MAPE"],"a":[0],"why":"Softmax modela clases excluyentes y entropía cruzada categórica evalúa la probabilidad correcta.","src":"nueva","ref":"Tema 2.2 · Combinaciones","note":""},{"id":"q0236","s":"2.3","q":"Un modelo acaba de ajustarse con train y validación. ¿Dónde debe calcular su rendimiento final?","o":["Validación usada para elegir hiperparámetros exclusivamente","Test independiente","Train de nuevo","Datos inventados"],"a":[1],"why":"El test debe mantenerse aislado para medir el comportamiento final del modelo.","src":"nueva","ref":"Tema 2.3 · Introducción","note":""},{"id":"q0237","s":"2.3","q":"Una empresa dispone de 2.000 muestras y utiliza Holdout 60/20/20. ¿Cuántas muestras son de entrenamiento?","o":["600","400","200","1.200"],"a":[3],"why":"0,60×2.000=1.200 muestras de entrenamiento.","src":"nueva","ref":"Tema 2.3 · Holdout","note":""},{"id":"q0238","s":"2.3","q":"En el mismo Holdout con 2.000 muestras y 60/20/20, ¿cuántas van a test?","o":["400","1.200","800","200"],"a":[0],"why":"El 20 % de 2.000 equivale a 400.","src":"nueva","ref":"Tema 2.3 · Holdout","note":""},{"id":"q0239","s":"2.3","q":"Un dataset tiene 700 casos positivos y 300 negativos. Si se reserva 10 % estratificado para test, ¿cuántos positivos van a test?","o":["100","700","70","30"],"a":[2],"why":"La estratificación mantiene proporciones: el 10 % de 700 positivos es 70.","src":"nueva","ref":"Tema 2.3 · Holdout","note":""},{"id":"q0240","s":"2.3","q":"¿Para qué sirve la estratificación al dividir datos de clasificación?","o":["Convertir etiquetas en números","Reducir el número de features a la mitad","Preservar proporciones de las clases","Garantizar 100 % de Accuracy"],"a":[2],"why":"Evita divisiones con proporciones de clase muy diferentes a las del conjunto original.","src":"nueva","ref":"Tema 2.3 · Holdout","note":""},{"id":"q0241","s":"2.3","q":"Se divide un dataset de 1.200 muestras en 4 folds. ¿Cuántos registros hay por fold?","o":["1.200","900","300","400"],"a":[2],"why":"1.200/4=300 muestras por fold.","src":"nueva","ref":"Tema 2.3 · K-Fold","note":""},{"id":"q0242","s":"2.3","q":"En K-Fold con 1.200 muestras y K=4, ¿cuántas se usan para entrenar por iteración?","o":["600","1.200","300","900"],"a":[3],"why":"Se entrenan K−1=3 folds, 3×300=900.","src":"nueva","ref":"Tema 2.3 · K-Fold","note":""},{"id":"q0243","s":"2.3","q":"En K-Fold con K=10, ¿cuántos entrenamientos/evaluaciones se realizan?","o":["10","5","1","100"],"a":[0],"why":"Cada uno de los diez folds se utiliza una vez para validación.","src":"nueva","ref":"Tema 2.3 · K-Fold","note":""},{"id":"q0244","s":"2.3","q":"Una organización tiene muy pocos ejemplos etiquetados. ¿Qué técnica suele aprovecharlos mejor para estimar rendimiento?","o":["Eliminar 90 % de datos","Entrenar solo sobre test","Validación cruzada","Un único Holdout con test inmenso"],"a":[2],"why":"K-Fold permite que todos los datos participen en entrenamiento y validación en distintas iteraciones.","src":"nueva","ref":"Tema 2.3 · K-Fold","note":""},{"id":"q0245","s":"2.3","q":"¿Cuál es el principal coste de una validación cruzada de muchos folds?","o":["Mayor tiempo de cómputo","No usar datos para validar","No poder medir varianza","Transformar regresión en clustering"],"a":[0],"why":"Se entrena el modelo repetidamente, aumentando coste computacional.","src":"nueva","ref":"Tema 2.3 · K-Fold","note":""},{"id":"q0246","s":"2.3","q":"¿Qué variante de validación cruzada utiliza una observación como validación y el resto para entrenamiento?","o":["Bootstrap siempre","Grid Search","Leave One Out","Holdout 60/20/20"],"a":[2],"why":"LOOCV toma sucesivamente cada observación como validación.","src":"nueva","ref":"Tema 2.3 · Variantes","note":""},{"id":"q0247","s":"2.3","q":"Un modelo pronostica demanda eléctrica futura. ¿Qué validación conviene para evitar entrenar con datos posteriores a lo predicho?","o":["Mezcla aleatoria sin restricciones","Holdout sin fechas siempre","One-Hot","Time Series Cross Validation"],"a":[3],"why":"La validación temporal conserva la relación pasado→futuro.","src":"nueva","ref":"Tema 2.3 · Variantes","note":""},{"id":"q0248","s":"2.3","q":"¿Qué variante hace repetidamente nuevas particiones aleatorias de train y validación?","o":["K-Means","Data augmentation","Monte Carlo Cross Validation","PCA"],"a":[2],"why":"Monte Carlo CV repite divisiones aleatorias para estimar variabilidad del resultado.","src":"nueva","ref":"Tema 2.3 · Variantes","note":""},{"id":"q0249","s":"2.3","q":"¿Qué significa muestreo Bootstrap con reemplazo?","o":["Todo el dataset se convierte en test","Cada ejemplo debe aparecer exactamente una vez","La muestra no contiene duplicados nunca","Una muestra puede contener observaciones repetidas y excluir otras"],"a":[3],"why":"Se repone una observación antes de extraer la siguiente, permitiendo repeticiones.","src":"nueva","ref":"Tema 2.3 · Bootstrap","note":""},{"id":"q0250","s":"2.3","q":"¿La validación cruzada es un algoritmo que aprende directamente pesos de una red?","o":["No, es un esquema de evaluación/selección","Sí, sustituye a backpropagation","Sí, crea neuronas","Solo con clustering"],"a":[0],"why":"K-Fold define cómo estimar rendimiento, no cómo se actualizan parámetros.","src":"nueva","ref":"Tema 2.3 · K-Fold","note":""},{"id":"q0251","s":"2.3","q":"Un clasificador etiqueta correctamente 90 de 100 registros. ¿Cuál es su Accuracy?","o":["0,90","90","0,01","0,10"],"a":[0],"why":"Accuracy=aciertos/total=90/100=0,90 (90 %).","src":"nueva","ref":"Tema 2.3 · Accuracy","note":""},{"id":"q0252","s":"2.3","q":"Una prueba tiene TP=40, TN=50, FP=5 y FN=5. ¿Qué Accuracy obtiene?","o":["0,80","0,90","0,40","0,50"],"a":[1],"why":"(TP+TN)/(TP+TN+FP+FN)=90/100=0,90.","src":"nueva","ref":"Tema 2.3 · Accuracy","note":""},{"id":"q0253","s":"2.3","q":"Un detector predice 80 positivos, de los que 60 son verdaderos. ¿Cuál es su Precision?","o":["0,25","0,80","0,75","0,60"],"a":[2],"why":"Precision=TP/(TP+FP)=60/80=0,75.","src":"nueva","ref":"Tema 2.3 · Precision","note":""},{"id":"q0254","s":"2.3","q":"Hay 100 pacientes enfermos y el modelo detecta 85. ¿Cuál es su Recall?","o":["0,15","0,50","1,00","0,85"],"a":[3],"why":"Recall=TP/(TP+FN)=85/100=0,85.","src":"nueva","ref":"Tema 2.3 · Recall","note":""},{"id":"q0255","s":"2.3","q":"Una empresa no quiere bloquear transacciones legítimas por sospecha de fraude. ¿Qué tipo de error pretende reducir?","o":["Verdaderos negativos","Verdaderos positivos","Falsos negativos","Falsos positivos"],"a":[3],"why":"Bloquear una transacción legítima significa predecir fraude cuando no lo hay: FP.","src":"nueva","ref":"Tema 2.3 · Matriz confusión","note":""},{"id":"q0256","s":"2.3","q":"Un hospital considera crítico que pacientes enfermos no se marquen como sanos. ¿Qué tipo de error minimiza?","o":["Falsos negativos","Verdaderos positivos","Verdaderos negativos","Falsos positivos"],"a":[0],"why":"Paciente enfermo clasificado sano es FN.","src":"nueva","ref":"Tema 2.3 · Matriz confusión","note":""},{"id":"q0257","s":"2.3","q":"¿Qué métrica priorizar si el coste de falsos positivos es especialmente alto?","o":["Precision","MSE","Recall exclusivamente","R²"],"a":[0],"why":"Precision alta significa pocos FP entre predicciones positivas.","src":"nueva","ref":"Tema 2.3 · Precision","note":""},{"id":"q0258","s":"2.3","q":"¿Qué métrica priorizar si el coste de falsos negativos es especialmente alto?","o":["Precision exclusivamente","R²","Recall","SSW"],"a":[2],"why":"Recall alta captura una gran proporción de positivos reales.","src":"nueva","ref":"Tema 2.3 · Recall","note":""},{"id":"q0259","s":"2.3","q":"Si Precision=1 y Recall=0,5, ¿cuál es el F1 Score?","o":["0,25","1,5","Aproximadamente 0,67","0"],"a":[2],"why":"F1=2×1×0,5/(1+0,5)=1/1,5≈0,667.","src":"nueva","ref":"Tema 2.3 · F1","note":""},{"id":"q0260","s":"2.3","q":"Un clasificador de fraude acierta el 99 % pero no detecta ningún fraude. ¿Qué métrica deja al descubierto el fallo?","o":["R²","Recall de la clase fraude","SSB","Accuracy global exclusivamente"],"a":[1],"why":"Si no detecta fraudes, Recall de positivos es 0 aunque Accuracy sea alta.","src":"nueva","ref":"Tema 2.3 · Desbalance","note":""},{"id":"q0261","s":"2.3","q":"¿Qué resume la métrica F1?","o":["Media armónica de Precision y Recall","Promedio de MSE y MAE","Número de árboles del modelo","Porcentaje de datos en train"],"a":[0],"why":"F1 combina precisión y sensibilidad de forma equilibrada.","src":"nueva","ref":"Tema 2.3 · F1","note":""},{"id":"q0262","s":"2.3","q":"Dos clasificadores tienen AUC-ROC de 0,91 y 0,68. ¿Qué interpretación es correcta?","o":["El primero discrimina mejor globalmente según AUC","El segundo es preferible por tener AUC menor","El segundo necesariamente tiene Precision de 68 %","El primero necesariamente tiene Accuracy de 91 %"],"a":[0],"why":"AUC-ROC resume discriminación entre clases a lo largo de umbrales y no equivale a otras métricas.","src":"nueva","ref":"Tema 2.3 · AUC","note":""},{"id":"q0263","s":"2.3","q":"Un detector de objetos predice una caja y debe medir cuánto se superpone con la caja real. ¿Qué métrica usar?","o":["SSB","MAPE","R²","IoU / Jaccard"],"a":[3],"why":"IoU=área de intersección/área de unión.","src":"nueva","ref":"Tema 2.3 · Jaccard","note":""},{"id":"q0264","s":"2.3","q":"Dos regiones tienen intersección 20 y unión 50. ¿Qué IoU resulta?","o":["0,7","20","2,5","0,4"],"a":[3],"why":"IoU=20/50=0,4.","src":"nueva","ref":"Tema 2.3 · Jaccard","note":""},{"id":"q0265","s":"2.3","q":"Una predicción probabilística incorrecta tiene confianza del 99 %. ¿Qué métrica la penaliza especialmente?","o":["Log Loss","K-Fold","Silhouette","MAE de agrupamiento"],"a":[0],"why":"Log Loss castiga fuertemente probabilidades muy seguras asignadas a la clase equivocada.","src":"nueva","ref":"Tema 2.3 · Log Loss","note":""},{"id":"q0266","s":"2.3","q":"Dos regresores presentan MSE 8 (A) y 3 (B), evaluados sobre el mismo test y variable. ¿Cuál es mejor en MSE?","o":["Empatan","B","No se puede elegir por ninguna métrica","A"],"a":[1],"why":"Menor error cuadrático medio es mejor: 3<8.","src":"nueva","ref":"Tema 2.3 · MSE","note":""},{"id":"q0267","s":"2.3","q":"El MSE de un modelo es 25. ¿Cuál es su RMSE?","o":["5","625","25","12,5"],"a":[0],"why":"RMSE=raíz cuadrada de 25=5.","src":"nueva","ref":"Tema 2.3 · RMSE","note":""},{"id":"q0268","s":"2.3","q":"En regresión los errores absolutos son 1, 2 y 3. ¿Cuál es el MAE?","o":["1","2","6","14"],"a":[1],"why":"MAE=(1+2+3)/3=2.","src":"nueva","ref":"Tema 2.3 · MAE","note":""},{"id":"q0269","s":"2.3","q":"Un regresor tiene R²=0,86 y otro R²=0,57 bajo la misma evaluación. ¿Cuál explica más variabilidad?","o":["El de 0,86","El de 0,57","No se puede utilizar R² en regresión","Ambos son equivalentes"],"a":[0],"why":"Un R² mayor indica una fracción mayor de variabilidad explicada respecto a la referencia.","src":"nueva","ref":"Tema 2.3 · R²","note":""},{"id":"q0270","s":"2.3","q":"Un modelo debe expresar el error de predicción numérica en términos porcentuales. ¿Qué métrica corresponde?","o":["Recall","Silhouette","MAPE","Precision"],"a":[2],"why":"MAPE es el error porcentual absoluto medio; exige precaución con objetivos iguales o próximos a cero.","src":"nueva","ref":"Tema 2.3 · MAPE","note":""},{"id":"q0271","s":"2.3","q":"Dos modelos tienen idéntico MSE pero distinto R² según sus informes. ¿Qué hay que verificar antes de concluir?","o":["Que se usaron los mismos datos y la misma definición de métricas","Que R² siempre coincide con MAE","Que uno tiene más capas","Que las predicciones son de clasificación"],"a":[0],"why":"Con mismo test, variable y definición convencional, R² y MSE están relacionados; resultados contradictorios exigen revisar comparación.","src":"nueva","ref":"Tema 2.3 · Interpretación","note":""},{"id":"q0272","s":"2.3","q":"Para comparar la cohesión de clústeres con igual dataset y K, ¿qué sentido se desea para SSW?","o":["Mayor sin límite","Exactamente 1","Menor","Negativo siempre"],"a":[2],"why":"SSW bajo significa puntos más próximos a sus centroides/grupos, con igual marco de comparación.","src":"nueva","ref":"Tema 2.3 · Clustering","note":""},{"id":"q0273","s":"2.3","q":"Para evaluar la separación de clústeres comparables, ¿qué sentido suele interesar para SSB?","o":["Menor","Mayor","Siempre cero","No puede calcularse"],"a":[1],"why":"SSB alto indica mayor dispersión entre centros/grupos en la configuración de referencia.","src":"nueva","ref":"Tema 2.3 · Clustering","note":""},{"id":"q0274","s":"2.3","q":"El índice de silueta es 0,88 para un agrupamiento y −0,2 para otro. ¿Cuál sugiere mejor asignación?","o":["−0,2","Ambos son necesariamente iguales","No puede aplicarse a clustering","0,88"],"a":[3],"why":"Silueta positiva cercana a uno indica buena cohesión y separación; negativa puede sugerir asignación deficiente.","src":"nueva","ref":"Tema 2.3 · Silhouette","note":""},{"id":"q0275","s":"2.3","q":"Para comparar etiquetas reales con clústeres predichos, ¿qué métrica de validación externa sirve?","o":["SSB","ARI","SSW","MSE"],"a":[1],"why":"Adjusted Rand Index compara dos particiones usando etiquetas de referencia.","src":"nueva","ref":"Tema 2.3 · ARI","note":""},{"id":"q0276","s":"2.3","q":"Para calcular ARI, ¿qué requisito debe cumplirse?","o":["Usar necesariamente CNN","Conocer etiquetas reales o una partición de referencia","Tener exclusivamente datos de vídeo","No conocer ninguna etiqueta"],"a":[1],"why":"ARI es validación externa y necesita una partición de referencia.","src":"nueva","ref":"Tema 2.3 · ARI","note":""},{"id":"q0277","s":"2.3","q":"¿Qué métrica de agrupamiento no necesita etiquetas reales?","o":["ARI exclusivamente","Silhouette Score","Recall","Accuracy"],"a":[1],"why":"Silhouette realiza validación interna mediante distancias a clústeres.","src":"nueva","ref":"Tema 2.3 · Silhouette","note":""},{"id":"q0278","s":"2.3","q":"Un test de modelo tiene TP=80, FP=20, FN=40. ¿Cuáles son Precision y Recall respectivamente?","o":["0,67 y 0,80","0,50 y 0,50","0,80 y 0,67 aprox.","1,00 y 1,00"],"a":[2],"why":"Precision=80/(80+20)=0,80; Recall=80/(80+40)=0,667.","src":"nueva","ref":"Tema 2.3 · Matriz confusión","note":""},{"id":"q0279","s":"2.4","q":"Una empresa ha entrenado una red neuronal. ¿Cuál de estas opciones describe mejor un hiperparámetro?","o":["Un peso aprendido durante el entrenamiento","Una configuración elegida antes o alrededor del proceso de entrenamiento","La predicción que devuelve el modelo","Una etiqueta real del dataset"],"a":[1],"why":"El hiperparámetro es una configuración externa del modelo; un peso es un parámetro aprendido.","src":"nueva","ref":"Tema 2.4 · Conceptos · p. 6","note":""},{"id":"q0280","s":"2.4","q":"Durante el entrenamiento, un modelo actualiza automáticamente los pesos de sus neuronas. ¿Qué son esos pesos?","o":["Hiperparámetros fijados siempre por el experto","Datos de test","Parámetros aprendidos del modelo","Resultados de Grid Search"],"a":[2],"why":"Los pesos son parámetros que el entrenamiento ajusta a partir de los datos; se distinguen de los hiperparámetros.","src":"nueva","ref":"Tema 2.4 · Conceptos · p. 6","note":""},{"id":"q0281","s":"2.4","q":"Un equipo prueba diferentes configuraciones para mejorar la calidad y generalización de un modelo. ¿Qué proceso está realizando?","o":["Hiperparametrización","Discretización","Codificación One-Hot","Clustering"],"a":[0],"why":"La hiperparametrización busca buenas configuraciones de hiperparámetros para mejorar el rendimiento y la generalización.","src":"nueva","ref":"Tema 2.4 · Conceptos · p. 8","note":""},{"id":"q0282","s":"2.4","q":"Se tienen definidos varios valores posibles para cada configuración de entrenamiento y se prueban TODAS las combinaciones. ¿Qué técnica se utiliza?","o":["Random Search","Bootstrap","Autoencoder","Grid Search"],"a":[3],"why":"Grid Search evalúa sistemáticamente todas las combinaciones de los valores definidos.","src":"nueva","ref":"Tema 2.4 · Grid Search · p. 13","note":""},{"id":"q0283","s":"2.4","q":"Un investigador selecciona al azar diferentes combinaciones de configuraciones y evalúa su rendimiento. ¿Qué método utiliza?","o":["Grid Search","Random Search","PCA","Leave One Out"],"a":[1],"why":"Random Search selecciona combinaciones de manera aleatoria, sin recorrer necesariamente todo el espacio.","src":"nueva","ref":"Tema 2.4 · Random Search · p. 14","note":""},{"id":"q0284","s":"2.4","q":"Una empresa dispone de un espacio de búsqueda muy grande y un presupuesto de cómputo limitado. ¿Cuál de estos enfoques suele ser más manejable que una búsqueda exhaustiva?","o":["Grid Search exhaustivo","Probar obligatoriamente todas las combinaciones","Random Search con un presupuesto acotado","Aumentar únicamente los datos de test"],"a":[2],"why":"Random Search puede evaluar un número limitado de combinaciones aleatorias y resultar más eficiente que probarlas todas.","src":"nueva","ref":"Tema 2.4 · Random Search · p. 14","note":""},{"id":"q0285","s":"2.4","q":"Solo existen unas pocas combinaciones posibles y el analista quiere comprobarlas todas. ¿Qué método encaja mejor?","o":["Grid Search","Random Search, que las prueba todas necesariamente","SMOTE","Regresión logística"],"a":[0],"why":"Grid Search recorre exhaustivamente el conjunto especificado de combinaciones.","src":"nueva","ref":"Tema 2.4 · Grid Search · p. 13","note":""},{"id":"q0286","s":"2.4","q":"Tras un Grid Search sobre un espacio amplio, la búsqueda tarda demasiado. ¿Cuál es una limitación típica de este método?","o":["Necesita etiquetas sin excepción","Siempre encuentra sobreajuste","No permite comparar configuraciones","Su coste computacional crece con las combinaciones"],"a":[3],"why":"Grid Search puede ser computacionalmente costoso porque evalúa todas las combinaciones definidas.","src":"nueva","ref":"Tema 2.4 · Grid Search · p. 13","note":""},{"id":"q0287","s":"2.4","q":"Un ingeniero cambia una configuración, entrena, revisa las métricas y vuelve a probar basándose en su experiencia. ¿Qué ajuste realiza?","o":["Aprendizaje no supervisado","Ajuste manual por ensayo y error","Ajuste exclusivo por AutoML","Discretización"],"a":[1],"why":"El método manual se basa en probar configuraciones guiándose por la experiencia y los resultados.","src":"nueva","ref":"Tema 2.4 · Manual · p. 12","note":""},{"id":"q0288","s":"2.4","q":"¿Cuál de estas estrategias se menciona en el temario para hacer un ajuste manual?","o":["Usar exclusivamente backpropagation","Eliminar el conjunto de validación","Ensayo y error o bucles for anidados","Aplicar PCA a todas las variables"],"a":[2],"why":"El PDF presenta como estrategias manuales el ensayo y error y los bucles for anidados en rangos definidos.","src":"nueva","ref":"Tema 2.4 · Manual · p. 12","note":""},{"id":"q0289","s":"2.4","q":"Un sistema utiliza un modelo probabilístico para decidir qué configuración probar a continuación basándose en resultados anteriores. ¿Qué técnica usa?","o":["Optimización bayesiana","Grid Search","One-Hot Encoding","K-Means"],"a":[0],"why":"La optimización bayesiana utiliza un modelo probabilístico que aprende de evaluaciones anteriores para orientar la búsqueda.","src":"nueva","ref":"Tema 2.4 · Optimización bayesiana · p. 15","note":""},{"id":"q0290","s":"2.4","q":"Tras probar varias configuraciones, el sistema actualiza sus estimaciones probabilísticas y dirige las nuevas pruebas hacia zonas prometedoras. ¿Qué método se está describiendo?","o":["Holdout","Bootstrap","Validación Leave One Out","Optimización bayesiana"],"a":[3],"why":"Esa actualización de un modelo probabilístico y búsqueda guiada es característica de la optimización bayesiana.","src":"nueva","ref":"Tema 2.4 · Optimización bayesiana · p. 15","note":""},{"id":"q0291","s":"2.4","q":"Un equipo quiere elegir las siguientes pruebas de forma inteligente, aprovechando la información de las configuraciones ya evaluadas. ¿Qué alternativa está más alineada con esa idea?","o":["Grid Search exhaustivo","Optimización bayesiana","Codificación ordinal","Matriz de confusión"],"a":[1],"why":"La búsqueda bayesiana utiliza información previa para proponer configuraciones potencialmente mejores.","src":"nueva","ref":"Tema 2.4 · Optimización bayesiana · p. 15","note":""},{"id":"q0292","s":"2.4","q":"Un procedimiento genera poblaciones de configuraciones, conserva las más prometedoras y crea otras nuevas por mutación. ¿Qué técnica es?","o":["Random Search","Validación cruzada","Optimización evolutiva","Regresión lineal"],"a":[2],"why":"La optimización evolutiva utiliza poblaciones, selección, recombinación y mutación.","src":"nueva","ref":"Tema 2.4 · Optimización evolutiva · p. 16","note":""},{"id":"q0293","s":"2.4","q":"En una búsqueda de hiperparámetros se habla de generaciones, selección y mutaciones. ¿De dónde toma su inspiración el método?","o":["Evolución biológica","Transformada de Fourier","Aprendizaje supervisado con etiquetas One-Hot","PCA"],"a":[0],"why":"Las técnicas evolutivas se inspiran en procesos de evolución biológica.","src":"nueva","ref":"Tema 2.4 · Optimización evolutiva · p. 16","note":""},{"id":"q0294","s":"2.4","q":"Un algoritmo combina dos configuraciones con buen rendimiento para producir nuevas configuraciones candidatas. ¿Qué método encaja?","o":["Time Series CV","Random Forest","Normalización Z-Score","Optimización evolutiva"],"a":[3],"why":"La combinación o recombinación de configuraciones y posterior mutación es típica de algoritmos evolutivos.","src":"nueva","ref":"Tema 2.4 · Optimización evolutiva · p. 16","note":""},{"id":"q0295","s":"2.4","q":"Un equipo decide optimizar configuraciones a través de gradientes calculados respecto a ellas. ¿Qué método de búsqueda describe?","o":["Bootstrap","Optimización mediante gradiente","Clustering jerárquico","Label Encoding"],"a":[1],"why":"La optimización por gradientes utiliza información derivativa para actualizar hiperparámetros; no debe confundirse con ajustar pesos de un modelo.","src":"nueva","ref":"Tema 2.4 · Optimización gradiente · p. 17","note":""},{"id":"q0296","s":"2.4","q":"¿Por qué puede ser difícil utilizar descenso de gradiente para buscar hiperparámetros discretos?","o":["Porque todos los hiperparámetros son etiquetas","Porque necesita grupos con centroides","Porque el espacio de búsqueda puede no ser suave ni diferenciable","Porque siempre existe un único mínimo global"],"a":[2],"why":"Los hiperparámetros discretos generan espacios no suaves; los gradientes no siempre son útiles.","src":"nueva","ref":"Tema 2.4 · Limitaciones optimización gradiente · p. 18","note":""},{"id":"q0297","s":"2.4","q":"La búsqueda por gradientes se queda en una configuración mediocre porque el espacio no es convexo. ¿Qué problema ilustra?","o":["Puede quedar atrapada en mínimos locales","Las etiquetas son One-Hot","El algoritmo se convierte automáticamente en DBSCAN","El modelo no contiene parámetros"],"a":[0],"why":"La no convexidad puede llevar a mínimos locales o dificultar la convergencia.","src":"nueva","ref":"Tema 2.4 · Limitaciones optimización gradiente · p. 18","note":""},{"id":"q0298","s":"2.4","q":"El profesor pregunta por una limitación de la optimización de hiperparámetros mediante gradiente. ¿Cuál es correcta según las diapositivas?","o":["Siempre es más barata que cualquier otra búsqueda","Prueba todas las combinaciones posibles","Selecciona grupos basados en densidad","Los espacios pueden ser no suaves y no convexos"],"a":[3],"why":"El material subraya que la optimización de hiperparámetros suele ser no suave y no convexa.","src":"nueva","ref":"Tema 2.4 · Limitaciones optimización gradiente · p. 18","note":""},{"id":"q0299","s":"2.4","q":"Una plataforma automatiza gran parte de la selección de configuraciones de un modelo sin que el analista programe cada búsqueda. ¿Qué enfoque usa?","o":["EDA","AutoML","PCA","SVC"],"a":[1],"why":"AutoML automatiza buena parte de la búsqueda y ajuste de modelos o hiperparámetros.","src":"nueva","ref":"Tema 2.4 · AutoML · p. 19","note":""},{"id":"q0300","s":"2.4","q":"¿Cuál de las siguientes herramientas se presenta como ejemplo de AutoML en el material?","o":["K-Means","Matplotlib","Auto-Sklearn","DBSCAN"],"a":[2],"why":"En la página 19 aparecen Auto-Sklearn, AutoKeras y Google AutoML como ejemplos de automatización.","src":"nueva","ref":"Tema 2.4 · AutoML · p. 19","note":""},{"id":"q0301","s":"2.4","q":"Una empresa utiliza AutoKeras para ahorrar trabajo en la búsqueda y selección de configuraciones. ¿Con qué categoría se relaciona?","o":["AutoML","Bootstrap","Algoritmos genéticos exclusivamente","Entrenamiento por refuerzo"],"a":[0],"why":"AutoKeras aparece entre las herramientas AutoML del temario.","src":"nueva","ref":"Tema 2.4 · AutoML · p. 19","note":""},{"id":"q0302","s":"2.4","q":"Se prueban varias configuraciones y se elige la que obtiene mejor F1 en el conjunto de validación. ¿Para qué se utiliza F1 en esta situación?","o":["Para convertir variables categóricas","Para definir K clústeres automáticamente","Para modificar las etiquetas de test","Para comparar el rendimiento de las configuraciones"],"a":[3],"why":"Las métricas de rendimiento permiten evaluar las configuraciones y seleccionar las más adecuadas.","src":"nueva","ref":"Tema 2.4 · Conceptos · p. 8","note":""},{"id":"q0303","s":"2.4","q":"Una empresa prueba configuraciones distintas y compara su MSE porque predice precios. ¿Es razonable este criterio?","o":["No, MSE solo sirve para clasificación","Sí, MSE es una métrica de regresión y permite comparar configuraciones","No, todas las técnicas exigen Accuracy","Solo si primero se realiza clustering"],"a":[1],"why":"El temario permite emplear métricas adaptadas al problema, como MSE en regresión.","src":"nueva","ref":"Tema 2.4 · Conceptos · p. 8","note":""},{"id":"q0304","s":"2.4","q":"Durante una búsqueda de hiperparámetros, el equipo usa repetidamente el conjunto de test para decidir qué configuración conservar. ¿Qué práctica sería mejor?","o":["Usar siempre test para cualquier decisión","Sustituir test por los datos de entrenamiento sin validar","Seleccionar con validación y reservar test para la evaluación final","Eliminar test de forma permanente"],"a":[2],"why":"La selección debe basarse en validación; el conjunto de prueba independiente se reserva para la evaluación final (relación con Tema 2.3).","src":"nueva","ref":"Tema 2.4 · Relación con Tema 2.3 · evaluación final","note":""},{"id":"q0305","s":"2.4","q":"Un compañero afirma que Grid Search y Random Search son técnicas exclusivamente para clasificación. ¿Qué respuesta es correcta?","o":["No: pueden ajustarse modelos de clasificación y de regresión","Sí: solo sirven para datos de imágenes","Sí: no pueden utilizarse en regresión","No: ambas son métricas de clustering"],"a":[0],"why":"Son procedimientos generales de búsqueda de hiperparámetros y pueden aplicarse a diferentes tipos de modelos y tareas.","src":"nueva","ref":"Tema 2.4 · Conceptos · p. 8","note":""},{"id":"q0306","s":"2.4","q":"¿Cuál de estas afirmaciones distingue correctamente Grid Search y Random Search?","o":["Ambos prueban siempre todas las combinaciones","Grid Search es una función de coste y Random Search un optimizador de pesos","Grid Search solo funciona con GPU","Grid Search recorre combinaciones definidas; Random Search muestrea combinaciones aleatorias"],"a":[3],"why":"Grid Search explora exhaustivamente un conjunto discretizado de combinaciones; Random Search selecciona configuraciones aleatorias.","src":"nueva","ref":"Tema 2.4 · Grid Search y Random Search · pp. 13–14","note":""},{"id":"q0307","s":"2.4","q":"Una docente quiere elegir entre ajuste manual, Grid Search y Random Search. ¿Cuál de las opciones es válida según el Tema 2.4?","o":["Solo manual","Las tres son técnicas válidas de ajuste","Solo Grid Search","Ninguna, porque no son algoritmos de predicción"],"a":[1],"why":"El tema presenta los tres métodos como técnicas de hiperparametrización.","src":"nueva","ref":"Tema 2.4 · Técnicas · pp. 9–14","note":""},{"id":"q0308","s":"2.4","q":"Una empresa propone usar K-Fold para seleccionar el mejor ajuste y Grid Search para explorar configuraciones. ¿Cuál es la interpretación correcta?","o":["Son dos nombres para la misma técnica","K-Fold genera configuraciones aleatorias y Grid Search mide Recall","Grid Search propone configuraciones y K-Fold puede evaluarlas","Ambas son métricas de regresión"],"a":[2],"why":"Grid Search busca configuraciones; la validación cruzada puede servir para estimar su rendimiento en cada candidato.","src":"nueva","ref":"Tema 2.4 · Relación con Tema 2.3 · validación cruzada","note":""}]</script>
<script>
(() => {
'use strict';
const BANK = JSON.parse(document.getElementById('questions-data').textContent);
const TOPICS = [
  {id:'1',name:'Tema 1',sub:'Ingeniería del Conocimiento'},
  {id:'1.1',name:'Tema 1.1',sub:'Preparación del entorno'},
  {id:'2',name:'Tema 2',sub:'Introducción a la IA'},
  {id:'2.1',name:'Tema 2.1',sub:'Adquisición y preprocesamiento'},
  {id:'2.2',name:'Tema 2.2',sub:'Desarrollo de modelos de IA'},
  {id:'2.3',name:'Tema 2.3',sub:'Evaluación de modelos'},
  {id:'2.4',name:'Tema 2.4',sub:'Técnicas de hiperparametrización'}
];
const MAP = Object.fromEntries(BANK.map(q => [q.id,q]));
const STORE = 'simulador_ic_ucam_2026_v6_literal';
const PREVIOUS_STORE = 'simulador_ic_ucam_2026_v5';
const app=document.getElementById('app');
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const unique=a=>[...new Set(a)];
const topicName=id=>TOPICS.find(t=>t.id===id)?.name||id;
const sourceName=x=>({examen:'Examen anterior',repaso:'Wooclap de clase',nueva:'Pregunta nueva'})[x]||x;
function retrieve(){try{const current=JSON.parse(localStorage.getItem(STORE)||'null');if(current&&current.version===6)return current;const previous=JSON.parse(localStorage.getItem(PREVIOUS_STORE)||'null');if(previous){const db={...(previous.db||{})};for(let i=1;i<=30;i++)delete db[`q${String(i).padStart(4,'0')}`];return {version:6,db,saved:previous.saved||[],session:null,settings:previous.settings||{}};}}catch(e){}return null;}
const old=retrieve();
let db=old?.db||{};
let saved=old?.saved||[];
let session=old?.session&&old.session.ids?.every(x=>MAP[x])?old.session:null;
let view=session ? (session.finished?'results':'quiz') : 'home';
let settings={topics:TOPICS.map(t=>t.id),source:'all',size:'30',mode:'study',onlyWrong:false,onlySaved:false,...(old?.settings||{})};
settings.topics=settings.topics.filter(x=>TOPICS.some(t=>t.id===x));delete settings.query;
let fullResults=false;
function persist(){try{localStorage.setItem(STORE,JSON.stringify({version:6,db,saved,session,settings}));}catch(e){}}
const wasAnswered=id=>!!(db[id]?.attempts);
const pool=()=>BANK.filter(q=>settings.topics.includes(q.s)&&(settings.source==='all'||q.src===settings.source)&&(!settings.onlyWrong||(db[q.id]?.wrong>0))&&(!settings.onlySaved||saved.includes(q.id)));
function shuffle(a){const out=[...a];for(let i=out.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
const isCorrect=(q,a)=>a!==undefined&&q.a.length===1&&q.a[0]===a;
function record(){if(!session||session.recorded)return;for(const id of session.ids){const q=MAP[id],a=session.answers[id];if(a===undefined)continue;const p=db[id]||{attempts:0,correct:0,wrong:0};p.attempts++;if(isCorrect(q,a))p.correct++;else p.wrong++;p.last=a;p.updated=Date.now();db[id]=p;}session.recorded=true;persist();}
function updateTop(){const n=Object.keys(db).filter(wasAnswered).length;document.getElementById('topStat').innerHTML=`<b>${n}</b> / ${BANK.length} preguntas practicadas`;}
function label(q){return `<span class="source-chip ${q.src}">${esc(sourceName(q.src))}</span>`;}
function renderHome(){view='home';updateTop();const active=pool();const size=settings.size==='all'?active.length:Math.min(Number(settings.size),active.length);const totalAsked=BANK.filter(q=>wasAnswered(q.id)).length;const totalHits=BANK.reduce((acc,q)=>acc+(db[q.id]?.correct||0),0);const totalTries=BANK.reduce((acc,q)=>acc+(db[q.id]?.attempts||0),0);const examCount=BANK.filter(x=>x.src==='examen').length, reviewCount=BANK.filter(x=>x.src==='repaso').length, newCount=BANK.filter(x=>x.src==='nueva').length;
app.innerHTML=`
<section class="hero"><div class="eyebrow">SIMULADOR DE EXAMEN · 100 % OFFLINE</div><h1>Practica con preguntas reales y casos nuevos de examen.</h1><p>Preguntas del examen anterior, repasos en clase y ejercicios basados en las diapositivas. Sin fechas, biografías ni descuento por fallos en este simulador. El Tema 2.4 se centra en técnicas de búsqueda, no en memorizar valores de hiperparámetros. Corrección razonada, simulacros mixtos y progreso local.</p><div class="hero-stats"><div class="hero-stat"><b>${BANK.length}</b><span>Preguntas totales</span></div><div class="hero-stat"><b>${examCount}</b><span>Examen anterior</span></div><div class="hero-stat"><b>${reviewCount}</b><span>Wooclap de clase</span></div><div class="hero-stat"><b>${newCount}</b><span>Nuevas preguntas</span></div></div></section>
<div class="layout"><section class="panel"><div class="panel-heading"><div><h2 class="section-title">1. Elige qué quieres estudiar</h2><p class="section-sub">Selecciona uno o varios apartados; por defecto están todos marcados.</p></div><button type="button" class="flat-link" data-action="toggle-topics">${settings.topics.length===TOPICS.length?'Desmarcar todos':'Marcar todos'}</button></div><div class="topic-grid">${TOPICS.map(t=>`<button type="button" class="topic ${settings.topics.includes(t.id)?'active':''}" data-action="topic" data-topic="${t.id}" aria-pressed="${settings.topics.includes(t.id)}"><span class="topic-dot"></span><span class="topic-text"><strong>${esc(t.name)}</strong><span>${esc(t.sub)}</span></span><small>${BANK.filter(q=>q.s===t.id).length}</small></button>`).join('')}</div>
<div class="filter-label">2. Origen de las preguntas</div><div class="segmented">${[{k:'all',l:'Todas'},{k:'examen',l:'Examen anterior'},{k:'repaso',l:'Wooclap de clase'},{k:'nueva',l:'Nuevas'}].map(o=>`<button class="seg ${settings.source===o.k?'active':''}" type="button" data-action="source" data-source="${o.k}" aria-pressed="${settings.source===o.k}">${o.l}</button>`).join('')}</div>

<div class="toggle-row"><label><input id="only-wrong" type="checkbox" ${settings.onlyWrong?'checked':''}> Solo preguntas falladas antes</label><label><input id="only-saved" type="checkbox" ${settings.onlySaved?'checked':''}> Solo marcadas ☆</label></div>
<div class="availability">Hay <b>${active.length} preguntas disponibles</b> con estos filtros. ${active.length===0?'Cambia algún filtro para comenzar.':`Comenzarás con <b>${size}</b> preguntas ${size<active.length?'aleatorias':'de este conjunto'}.`}</div>
<div class="two-cols"><label><span class="input-label">Cantidad de preguntas</span><select id="question-count" class="selector">${[['10','10 preguntas'],['20','20 preguntas'],['30','30 preguntas'],['50','50 preguntas'],['100','100 preguntas'],['all','Todas las disponibles']].map(([v,t])=>`<option value="${v}" ${settings.size===v?'selected':''}>${t}</option>`).join('')}</select></label><label><span class="input-label">Modalidad</span><select id="quiz-mode" class="selector"><option value="study" ${settings.mode==='study'?'selected':''}>Estudio: corrección inmediata</option><option value="exam" ${settings.mode==='exam'?'selected':''}>Examen: corrección al final</option></select></label></div>
<button class="btn btn-primary btn-wide" type="button" data-action="start" ${!active.length?'disabled':''}>Empezar práctica · ${size} preguntas <span aria-hidden="true">→</span></button>
<button class="btn btn-outline btn-wide" type="button" data-action="original-exam">📄 Examen anterior ORIGINAL · 30 preguntas en orden (1–30)</button>
<button class="btn btn-secondary btn-wide" type="button" data-action="quick-exam">Simulacro mixto de 30 preguntas</button>
${session&&!session.finished?`<button class="btn btn-outline btn-wide" type="button" data-action="resume">Continuar sesión anterior (${session.index+1}/${session.ids.length})</button>`:''}
<p class="mini-note">El examen original completo se presenta de la 1 a la 30. Los cuestionarios completos de Wooclap también mantienen su orden; los simulacros mixtos sí se mezclan. Por temas, los ejercicios encadenados muestran el contexto anterior cuando hace falta. Los enunciados originales con ambigüedades se explican al corregir.</p>
</section>
<aside class="panel"><h2 class="section-title">Tu progreso</h2><p class="section-sub">Los resultados se conservan en este dispositivo.</p><div class="hero-stats" style="margin-top:20px;gap:20px"><div class="hero-stat"><b style="color:var(--navy)">${totalAsked}</b><span style="color:var(--muted)">Preguntas practicadas</span></div><div class="hero-stat"><b style="color:var(--navy)">${totalTries?Math.round(100*totalHits/totalTries):0}%</b><span style="color:var(--muted)">Acierto acumulado</span></div><div class="hero-stat"><b style="color:var(--navy)">${saved.length}</b><span style="color:var(--muted)">Guardadas ☆</span></div></div>
<div class="stats-list">${TOPICS.map(t=>{const list=BANK.filter(q=>q.s===t.id);const seen=list.filter(q=>wasAnswered(q.id)).length;return `<div><div class="stat-top"><span>${esc(t.name)}</span><small>${seen} / ${list.length} practicadas</small></div><div class="track"><div class="fill" style="width:${list.length?Math.round(100*seen/list.length):0}%"></div></div></div>`}).join('')}</div>
<div class="quiet-block"><h3>Cómo estudiar mejor con este banco</h3><p>1) Empieza en modo Estudio por un tema. 2) Repite solo las falladas. 3) Haz un simulacro mixto de 30 sin consultar explicaciones. 4) Revisa especialmente el motivo de cada error.</p></div>
<div class="quiet-block" style="margin-top:12px;background:#fff9ed;border-color:#f5e7c9"><h3>Sobre preguntas originales</h3><p>Se conservan las 30 preguntas del examen fotografiado y las 37 de Wooclap, transcritas literalmente, sin sustituir enunciados ni opciones. Las preguntas relacionadas se muestran en orden en el modo «Examen anterior completo». Cada pregunta tiene exactamente una respuesta de referencia y todas cuentan como puntuables. En las preguntas originales con ambigüedades (como la 13), se conserva el texto literal y se explica por qué la respuesta asignada es la probablemente esperada, aunque el enunciado sea discutible.</p></div>
<div class="split-actions"><button class="btn btn-outline btn-small" type="button" data-action="export">Exportar progreso</button><button class="btn btn-danger btn-small" type="button" data-action="reset">Borrar estadísticas</button></div>
</aside></div>
<div class="footer">Material de estudio personal basado en los PDF de Temas 1, 1.1, 2, 2.1, 2.2, 2.3 y 2.4, y los cuestionarios aportados · Funciona sin conexión · Progreso local</div>`;
}
function renderQuiz(){if(!session){renderHome();return;}view='quiz';updateTop();const n=session.ids.length,i=session.index,id=session.ids[i],q=MAP[id],answer=session.answers[id],reveal=session.mode==='study'&&answer!==undefined,proportion=Math.round(100*(i+1)/n);const previousId=i>0?session.ids[i-1]:null;const ctxQuestion=q.ctx&&previousId!==q.ctx?MAP[q.ctx]:null;app.innerHTML=`
<div class="quiz-shell"><div class="quiz-head"><button class="subtle-back" type="button" data-action="home">← Volver al inicio</button><span class="runmode">${session.mode==='study'?'Modo estudio · solución inmediata':'Modo examen · sin penalización'}</span></div><div class="question-bar"><span class="counter">${q.examNo?`EXAMEN ORIGINAL Nº ${q.examNo} · `:''}PREGUNTA ${i+1} DE ${n}</span><div class="quiz-metas"><span class="source-chip">${esc(topicName(q.s))}</span>${label(q)}</div></div><div class="quiz-progress" aria-label="Progreso del cuestionario"><div style="width:${proportion}%"></div></div>
<section class="quiz-card"><div class="question-bar"><span class="small-muted">${esc(q.ref||'Pregunta adicional basada en los apuntes')}</span><button class="bookmark ${saved.includes(id)?'saved':''}" type="button" data-action="bookmark" aria-pressed="${saved.includes(id)}" title="Guardar esta pregunta">${saved.includes(id)?'★ Guardada':'☆ Guardar'}</button></div>${ctxQuestion?`<aside class="context-box"><strong>Contexto del ejercicio anterior · Pregunta ${ctxQuestion.examNo}</strong><p>${esc(ctxQuestion.q)}</p></aside>`:''}<h1 class="question-text">${esc(q.q)}</h1>
${q.note?'<div class="source-chip" style="margin-bottom:13px">ⓘ Enunciado original con matiz técnico</div>':''}
<div class="choices">${q.o.map((opt,j)=>{const chosen=answer===j,valid=q.a.includes(j);const cls=reveal?(valid?'correct':chosen?'wrong':''):chosen?'chosen':'';return `<button type="button" class="choice ${cls}" data-action="answer" data-option="${j}" ${reveal?'disabled':''} aria-pressed="${chosen}"><span class="key">${'ABCD'[j]}</span><span>${esc(opt)}</span>${reveal&&valid?'<span style="margin-left:auto">✓</span>':''}</button>`}).join('')}</div>
${reveal?`<div class="feedback ${isCorrect(q,answer)?'good':'bad'}" aria-live="polite"><strong>${isCorrect(q,answer)?'✓ ¡Correcta!':'✕ Incorrecta'}</strong>${!isCorrect(q,answer)?`<p class="right-answer">Respuesta de referencia: ${q.a.map(j=>`${'ABCD'[j]}. ${esc(q.o[j])}`).join('')}</p>`:''}<p>${esc(q.why)}</p>${q.note?`<div class="caveat"><b>Matiz importante:</b> ${esc(q.note)}</div>`:''}</div>`:''}
<div class="quiz-footer"><button class="btn btn-outline btn-small" type="button" data-action="prev" ${i===0?'disabled':''}>← Anterior</button><div class="right-actions">${answer===undefined?'<button class="btn btn-ghost" type="button" data-action="skip">Omitir</button>':''}<button class="btn btn-primary" type="button" data-action="next" ${session.mode==='study'&&answer===undefined?'disabled':''}>${i===n-1?'Finalizar y ver resultado':'Siguiente →'}</button></div></div></section><div class="under-quiz">Consejo: usa las teclas <b>1–4</b> para responder y <b>Enter</b> para avanzar.</div></div>`;
}
function detailed(q,a,idx){const status=a===undefined?'skip':isCorrect(q,a)?'good':'bad';return `<article class="review-card ${status}"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="source-chip">${esc(topicName(q.s))} · ${idx+1}</span>${label(q)}<span class="source-chip">${status==='good'?'✓ Correcta':status==='bad'?'✕ Incorrecta':'— Omitida'}</span></div><h3>${esc(q.q)}</h3><p>Tu respuesta: <span class="answer">${a===undefined?'Sin responder':`${'ABCD'[a]}. ${esc(q.o[a])}`}</span></p><p>Respuesta de referencia: <span class="answer">${q.a.map(j=>`${'ABCD'[j]}. ${esc(q.o[j])}`).join('')}</span></p><p>${esc(q.why)}</p>${q.note?`<div class="caveat"><b>Matiz:</b> ${esc(q.note)}</div>`:''}</article>`;}
function renderResults(){if(!session){renderHome();return;}view='results';record();updateTop();const ids=session.ids,marked=ids.map(id=>({q:MAP[id],a:session.answers[id]})),graded=marked,correct=graded.filter(x=>isCorrect(x.q,x.a)).length,skipped=graded.filter(x=>x.a===undefined).length,wrong=graded.length-correct-skipped,pct=graded.length?Math.round(100*correct/graded.length):0;const perTopic=TOPICS.map(t=>{const q=graded.filter(x=>x.q.s===t.id);return {name:t.name,count:q.length,good:q.filter(x=>isCorrect(x.q,x.a)).length}}).filter(t=>t.count);const filtered=fullResults?marked:marked.filter(x=>!isCorrect(x.q,x.a));app.innerHTML=`<div class="quiz-shell"><div class="quiz-head"><button class="subtle-back" type="button" data-action="home">← Volver al inicio</button><span class="runmode">Sesión finalizada</span></div>
<div class="result-hero"><div class="result-grid"><div class="score-ring" style="--score:${pct}%"><div><b>${pct}%</b><small>aciertos</small></div></div><div><h1 class="result-headline">${pct>=90?'Muy buen resultado':pct>=70?'Buen progreso':pct>=50?'Hay margen de mejora':'Conviene repasar el temario'}</h1><p class="result-sub">${session.mode==='study'?'Práctica con explicaciones':'Simulacro sin soluciones durante la realización'} · ${ids.length} preguntas en total.</p><div class="result-kpis"><div><b>${correct}</b><span>Correctas</span></div><div><b>${wrong}</b><span>Incorrectas</span></div><div><b>${skipped}</b><span>Omitidas</span></div></div><div class="split-actions"><button class="btn btn-primary btn-small" type="button" data-action="retry-wrong" ${wrong+skipped===0?'disabled':''}>Repetir falladas y omitidas</button><button class="btn btn-outline btn-small" type="button" data-action="home">Volver a elegir temas</button></div></div></div></div>
<section class="result-sections"><h2 class="section-title">Desglose por tema</h2><table class="breakdown"><thead><tr><th>Tema</th><th>Correctas</th><th>Resultado</th></tr></thead><tbody>${perTopic.map(x=>`<tr><td>${x.name}</td><td>${x.good} de ${x.count}</td><td><b>${Math.round(100*x.good/x.count)}%</b></td></tr>`).join('')}</tbody></table></section>
<section class="result-sections"><div class="panel-heading"><div><h2 class="section-title">${fullResults?'Revisión completa':'Revisa los errores y omisiones'}</h2><p class="section-sub">Puedes comparar tu respuesta con las soluciones justificadas.</p></div><button class="flat-link" type="button" data-action="review-toggle">${fullResults?'Solo errores':'Ver todas las preguntas'}</button></div>${filtered.length?filtered.map(x=>detailed(x.q,x.a,ids.indexOf(x.q.id))).join(''):'<div class="zero">No hay preguntas falladas ni omitidas. ¡Buen trabajo!</div>'}</section>
<div class="footer">Tus resultados quedan guardados de forma local en este navegador.</div></div>`;
}
function render(){if(view==='home')renderHome();else if(view==='quiz')renderQuiz();else renderResults();}
function start(ids=null,mode=null,originalExam=false){const candidates=ids?ids:pool().map(x=>x.id);const take=ids?ids.length:(settings.size==='all'?candidates.length:Math.min(Number(settings.size),candidates.length));if(!take){alert('No hay preguntas con los filtros actuales.');return;}const ordered=['examen','repaso'].includes(settings.source)&&(settings.size==='all'||take===candidates.length);const selected=ids?ids:ordered?[...candidates].sort((a,b)=>a.localeCompare(b)):shuffle(candidates).slice(0,take);session={ids:selected,index:0,answers:{},mode:mode||settings.mode,originalExam:!!originalExam,started:Date.now(),finished:false,recorded:false};fullResults=false;persist();renderQuiz();window.scrollTo({top:0,behavior:'auto'});}
function chooseAnswer(j){if(!session||session.finished)return;const id=session.ids[session.index];if(session.mode==='study'&&session.answers[id]!==undefined)return;session.answers[id]=j;persist();renderQuiz();}
function goNext(){if(!session)return;const id=session.ids[session.index];if(session.mode==='study'&&session.answers[id]===undefined)return;if(session.index===session.ids.length-1){session.finished=true;persist();renderResults();}else{session.index++;persist();renderQuiz();}window.scrollTo({top:0,behavior:'auto'});}
function goPrev(){if(session&&session.index>0){session.index--;persist();renderQuiz();}}
function toHome(){view='home';renderHome();window.scrollTo({top:0,behavior:'auto'});}
function exportData(){const data={exportedAt:new Date().toISOString(),totalQuestions:BANK.length,progress:db,bookmarked:saved};const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download='progreso_ingenieria_conocimiento.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;switch(action){case 'home':toHome();break;case 'topic':{const v=b.dataset.topic;settings.topics=settings.topics.includes(v)?settings.topics.filter(t=>t!==v):[...settings.topics,v];persist();renderHome();break;}case 'toggle-topics':settings.topics=settings.topics.length===TOPICS.length?[]:TOPICS.map(x=>x.id);persist();renderHome();break;case 'source':settings.source=b.dataset.source;persist();renderHome();break;case 'start':start();break;case 'original-exam':start(BANK.filter(q=>q.src==='examen').sort((a,b)=>a.examNo-b.examNo).map(q=>q.id),settings.mode,true);break;case 'quick-exam':settings.topics=TOPICS.map(t=>t.id);settings.source='all';settings.onlyWrong=false;settings.onlySaved=false;settings.size='30';settings.mode='exam';persist();start();break;case 'resume':if(session&&!session.finished){view='quiz';renderQuiz();}break;case 'answer':chooseAnswer(Number(b.dataset.option));break;case 'prev':goPrev();break;case 'next':goNext();break;case 'skip':if(session){delete session.answers[session.ids[session.index]];if(session.index===session.ids.length-1){session.finished=true;persist();renderResults();}else{session.index++;persist();renderQuiz();}}break;case 'bookmark':{const id=session.ids[session.index];saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];persist();renderQuiz();break;}case 'review-toggle':fullResults=!fullResults;renderResults();break;case 'retry-wrong':{const ids=session.ids.filter(id=>!isCorrect(MAP[id],session.answers[id]));if(ids.length)start(shuffle(ids),settings.mode);break;}case 'export':exportData();break;case 'reset':if(confirm('¿Borrar las estadísticas, preguntas guardadas y la sesión actual de este navegador?')){db={};saved=[];session=null;settings.onlyWrong=false;settings.onlySaved=false;persist();renderHome();}break;}});
app.addEventListener('change',e=>{const t=e.target;if(t.id==='question-count'){settings.size=t.value;}else if(t.id==='quiz-mode'){settings.mode=t.value;}else if(t.id==='only-wrong'){settings.onlyWrong=t.checked;}else if(t.id==='only-saved'){settings.onlySaved=t.checked;}else return;persist();renderHome();});


document.addEventListener('keydown',e=>{const tag=document.activeElement?.tagName||'';if(['INPUT','SELECT','TEXTAREA'].includes(tag)||e.ctrlKey||e.metaKey||e.altKey)return;if(view!=='quiz'||!session)return;if(['1','2','3','4'].includes(e.key)){e.preventDefault();chooseAnswer(Number(e.key)-1);}else if(e.key==='Enter'&&document.activeElement?.tagName!=='BUTTON'){e.preventDefault();goNext();}});
render();
})();
</script>
</body></html>
