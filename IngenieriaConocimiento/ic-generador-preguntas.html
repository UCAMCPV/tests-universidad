"2","q":"¿Para qué se utiliza el algoritmo de retropropagación en inteligencia artificial?","o":["Para reajustar los pesos de las neuronas y aumentar el error de salida del modelo","Para aumentar los pesos de las neuronas y disminuir el error de salida del modelo","Para eliminar neuronas de las capas intermedias y disminuir el error de salida del modelo","Para reajustar los pesos de las neuronas y disminuir el error de salida del modelo"],"a":[3],"why":"La retropropagación calcula gradientes de la función de pérdida; el optimizador los utiliza para ajustar los pesos buscando disminuirla.","src":"examen","ref":"Examen anterior · pregunta 6 · foto 1 · transcripción literal","note":"","examNo":6,"photo":1,"unscorable":false,"ctx":null},{"id":"q0007","s":"2.1","q":"El investigador del Mandril FC, David Mal Habas, está procesando los datos para realizar un estudio. Necesita convertir una variable continua en una variable cualitativa. ¿Qué proceso debe realizar?","o":["Reducción de la dimensionalidad","Discretización","Codificación categórica","Limpieza de texto"],"a":[1],"why":"Discretizar significa transformar valores continuos en categorías o intervalos discretos.","src":"examen","ref":"Examen anterior · pregunta 7 · foto 1 · transcripción literal","note":"","examNo":7,"photo":1,"unscorable":false,"ctx":null},{"id":"q0008","s":"2.1","q":"El investigador del Real Farsa, Juan Las Puertas, está procesando los datos para realizar un estudio. Necesita convertir una variable categórica en una variable numérica. ¿Qué proceso debe realizar?","o":["Reducción de la dimensionalidad","Discretización","Codificación categórica","Limpieza de texto"],"a":[2],"why":"La codificación categórica, como Label Encoding u One-Hot, representa categorías en formato numérico.","src":"examen","ref":"Examen anterior · pregunta 8 · foto 1 · transcripción literal","note":"","examNo":8,"photo":1,"unscorable":false,"ctx":null},{"id":"q0009","s":"2.1","q":"Juan Las Puertas se ha encontrado con algunos datos faltantes en su conjunto de entrenamiento, ¿qué puede hacer?","o":["Suspender el estudio ya que los datos no existen","Recopilar los datos de nuevo","Imputar los datos mediante la media, mediana o moda","Todas las anteriores son incorrectas"],"a":[2],"why":"La imputación permite tratar valores faltantes. La técnica adecuada depende de la variable y del patrón de ausencia.","src":"examen","ref":"Examen anterior · pregunta 9 · foto 1 · transcripción literal","note":"La C suele ser la respuesta de estudio; la B (volver a recopilar datos) también puede ser viable en determinadas circunstancias.","examNo":9,"photo":1,"unscorable":false,"ctx":null},{"id":"q0010","s":"2","q":"Un investigador de Tisnofónica está entrenando un modelo para estimar los metros de cable de fibra óptica que tienen que solicitar para el siguiente mes. De repente, ha medido la calidad de su modelo y se ha encontrado que este presenta un alto valor de error de entrenamiento y un alto valor de error de testeo. ¿Qué problema está teniendo?","o":["Está teniendo problema de sobreajuste (overfitting)","Está tenido problemas de bajo ajuste (underfitting)","Está entrenando perfectamente","Algo está haciendo mal. No se puede tener un alto valor de error de entrenamiento y test"],"a":[1],"why":"Errores elevados tanto en entrenamiento como en datos nuevos suelen indicar que el modelo no ha aprendido suficientemente la relación: underfitting.","src":"examen","ref":"Examen anterior · pregunta 10 · foto 2 · transcripción literal","note":"","examNo":10,"photo":2,"unscorable":false,"ctx":null},{"id":"q0011","s":"2.2","q":"El Farsa CF ha recibido varias ofertas por su jugador, Aluminio Mayal. El investigador Josep Maria Pereñiguez Negreira ha recopilado información de los clubes y quiere predecir si van a ser capaces de pagar o no. Para ello, ha utilizado una regresión logística. ¿Ha hecho bien?","o":["Sí, es un problema de clasificación y las regresiones logísticas se pueden utilizar para ello","No, nunca se puede utilizar una regresión logística para clasificación","No, debería haber utilizado una regresión lineal para clasificación","No, debería haber utilizado un k-means"],"a":[0],"why":"La regresión logística se utiliza para clasificación, especialmente binaria, aunque su nombre contenga «regresión».","src":"examen","ref":"Examen anterior · pregunta 11 · foto 2 · transcripción literal","note":"","examNo":11,"photo":2,"unscorable":false,"ctx":null},{"id":"q0012","s":"2.2","q":"En el caso de que el señor Pereñiguez Negreira quiera utilizar una red neuronal, ¿qué tipo de función de activación debe poner en la neurona de salida?","o":["Una lineal","Una ReLU","Una sigmoide","Una softmax"],"a":[2],"why":"Una salida sigmoide devuelve un valor entre 0 y 1 interpretable como probabilidad de la clase positiva.","src":"examen","ref":"Examen anterior · pregunta 12 · foto 2 · transcripción literal","note":"","examNo":12,"photo":2,"unscorable":false,"ctx":"q0011"},{"id":"q0013","s":"2.2","q":"El investigador del Mandril FC, Elber Limitado está diseñando un modelo para determinar si un jugador se va a lesionar con una determinada probabilidad (el 80%) en el siguiente partido en base a una serie de parámetros fisiológicos. Para ello, ha escogido una Support Vector Machine (SVM) de clasificación. ¿Ha hecho bien?","o":["No, las SVM solo se pueden utilizar en clustering","Sí, las SVM de clasificación se pueden usar en regresión","No, las SVM no se pueden utilizar en clasificación","No, solo las Support Vector Regression (SVR) se pueden utilizar en regresión"],"a":[3],"why":"Respuesta de referencia para practicar el examen: D. La distinción esperada es que una SVM de clasificación (SVC) se usa para clasificación y Support Vector Regression (SVR) es su variante para regresión. Sin embargo, el enunciado pide estimar si habrá una lesión y menciona una probabilidad del 80 %: eso también puede ser una clasificación probabilística, por lo que el uso de SVC puede ser adecuado.","src":"examen","ref":"Examen anterior · pregunta 13 · foto 2 · transcripción literal","note":"Respuesta D asignada como la opción más probable pretendida por el profesor, NO como conclusión técnica impecable. La pregunta original es ambigua: estimar una probabilidad de lesión no convierte por sí solo la tarea en regresión. Se conserva exactamente el enunciado y las cuatro opciones de la foto.","examNo":13,"photo":2,"unscorable":false,"ctx":null},{"id":"q0014","s":"2","q":"Elber Limitado está entrenando su modelo. Durante el entrenamiento del modelo, ha obtenido un bajo error de entrenamiento y un error de validación parecido. ¿Hay algún problema?","o":["Está teniendo problema de sobreajuste (overfitting)","Está tenido problemas de bajo ajuste (underfitting)","Está entrenando perfectamente","Está teniendo problemas de sobredimensionalidad del modelo"],"a":[2],"why":"Un error bajo y similar en entrenamiento y validación es un indicio favorable, aunque todavía debe evaluarse con test independiente.","src":"examen","ref":"Examen anterior · pregunta 14 · foto 2 · transcripción literal","note":"","examNo":14,"photo":2,"unscorable":false,"ctx":"q0013"},{"id":"q0015","s":"2.2","q":"Elber Limitado ha empezado a recopilar información historia de esas condiciones fisiológicas. Recientes estudios dicen que tener en cuenta la condición física de las últimas cinco semanas, puede ayudar a predecir si un jugador se va a lesionar esta semana. ¿Qué tipo de algoritmo le recomendarías para entrenar su modelo?","o":["Redes neuronales convolucionales (CNN)","Un perceptrón multicapa (MLP)","Una Long Short-Term Memory (LSTM)","Una regresión lineal"],"a":[2],"why":"La LSTM procesa secuencias y aprende relaciones temporales entre semanas.","src":"examen","ref":"Examen anterior · pregunta 15 · foto 2 · transcripción literal","note":"","examNo":15,"photo":2,"unscorable":false,"ctx":"q0013"},{"id":"q0016","s":"2.2","q":"En este caso, ¿qué tipo de función de activación puede poner Elber Limitado en la neurona de salida?","o":["Una lineal","Una ReLU","Una softmax","No hace falta ninguna neurona de salida"],"a":[2],"why":"Softmax transforma las dos salidas en probabilidades que suman 1. Para una sola neurona en clasificación binaria es más habitual utilizar sigmoide.","src":"examen","ref":"Examen anterior · pregunta 16 · foto 2 · transcripción literal","note":"La alternativa C (Softmax) es posible si se emplean dos neuronas de salida. Para una única neurona que modele la probabilidad de lesión, la opción habitual sería sigmoide, que no se ofrece.","examNo":16,"photo":2,"unscorable":false,"ctx":"q0015"},{"id":"q0017","s":"2.2","q":"Los investigadores de la clínica ASISAR quieren crear un modelo a través del cual se le pase una imagen de una rodilla y se determine si se ha producido la terrible lesión conocida como triada. ¿Qué modelo le recomendarías usar?","o":["Una Gated Recurrent Unit (GRU)","Una red neuronal convolucional (CNN)","Una Long Short-Term Memory (LSTM)","Una regresión logística"],"a":[1],"why":"Las CNN son adecuadas para extraer características espaciales de imágenes radiográficas.","src":"examen","ref":"Examen anterior · pregunta 17 · foto 3 · transcripción literal","note":"","examNo":17,"photo":3,"unscorable":false,"ctx":null},{"id":"q0018","s":"2.2","q":"¿Qué función de costo podría utilizar a los investigadores de ASISAR?","o":["Binary cross-entropy","Sparse Multiclass Cross-Entropy Loss","Mean Squared Error","Mean Absolute Error Loss"],"a":[0],"why":"Binary Cross-Entropy es una función de pérdida habitual para clasificación binaria.","src":"examen","ref":"Examen anterior · pregunta 18 · foto 3 · transcripción literal","note":"","examNo":18,"photo":3,"unscorable":false,"ctx":"q0017"},{"id":"q0019","s":"2.3","q":"En el estudio de ASISAR sobre si una rodilla tiene una lesión de triada, ¿qué tipo de métrica le interesa utilizar para evaluar el modelo?","o":["R²","MSE","Recall o sensibilidad","SSE"],"a":[2],"why":"Recall=TP/(TP+FN); maximizarla reduce falsos negativos en la clase de pacientes lesionados.","src":"examen","ref":"Examen anterior · pregunta 19 · foto 3 · transcripción literal","note":"","examNo":19,"photo":3,"unscorable":false,"ctx":"q0017"},{"id":"q0020","s":"2.3","q":"Un científico de datos del banco BMVA, se ha puesto a evaluar la calidad de un modelo con un 20% de datos de train, 60% de datos de validación y 20% de datos de test. ¿Ha cometido algún error?","o":["No, son unos porcentajes aceptables para entrenar y evaluar un modelo","Sí, siempre se debe utilizar validación cruzada","Sí, siempre se debe utilizar Bootstrap","Sí, el porcentaje de entrenamiento debe ser mayor"],"a":[3],"why":"Con solo 20 % para entrenar y 60 % para validar, se desperdician ejemplos de entrenamiento. Las proporciones habituales del material reservan más para train.","src":"examen","ref":"Examen anterior · pregunta 20 · foto 3 · transcripción literal","note":"La D es la respuesta aparentemente esperada por el profesor, pero las proporciones no están matemáticamente prohibidas; dependen del problema y de la cantidad de datos.","examNo":20,"photo":3,"unscorable":false,"ctx":null},{"id":"q0021","s":"2.3","q":"El científico de BMVA ha decidido utilizar una LSTM para predecir la evolución del precio de las acciones de bolsa de la empresa murciana de móviles Achofone. ¿Qué tipo de métrica le interesa utilizar para evaluar el modelo?","o":["R²","MSE","Recall o sensibilidad","A y B son correctas"],"a":[3],"why":"R² y MSE son métricas de regresión. Recall es de clasificación.","src":"examen","ref":"Examen anterior · pregunta 21 · foto 3 · transcripción literal","note":"","examNo":21,"photo":3,"unscorable":false,"ctx":null},{"id":"q0022","s":"2.2","q":"Señala la respuesta falsa relacionada con una CNN:","o":["Solo puede tener una sola capa convolucional","La función de activación de las capas intermedias suele ser la ReLu","Puede tener varias capas de pooling.","La función de activación de la capa de salida puede ser softmax si es un problema multiclase"],"a":[0],"why":"La afirmación A es falsa: una CNN puede tener múltiples capas convolucionales. Las otras tres afirmaciones son compatibles con las CNN.","src":"examen","ref":"Examen anterior · pregunta 22 · foto 3 · transcripción literal","note":"","examNo":22,"photo":3,"unscorable":false,"ctx":null},{"id":"q0023","s":"2.2","q":"El TUCAM CB ha perdido por lesión a sus pivot estrella, Matutes Bol. Para ello, el entrenador Pito Alfonso ha pedido a sus analistas de datos que analicen todos los pivots disponibles en el mercado y generen diferentes grupos para encontrar un pivot que se asemeje a él. ¿Qué algoritmo podría utilizar?","o":["DBScan","SVM","LSTM","Ninguno de los anteriores"],"a":[0],"why":"DBSCAN es un algoritmo de agrupamiento no supervisado basado en densidad.","src":"examen","ref":"Examen anterior · pregunta 23 · foto 3 · transcripción literal","note":"","examNo":23,"photo":3,"unscorable":false,"ctx":null},{"id":"q0024","s":"2.3","q":"¿Qué métrica pueden utilizar los analistas para evaluar el problema anterior?","o":["Área Bajo la Curva","MAE","Índice silueta","F1 Score"],"a":[2],"why":"El índice de silueta cuantifica cohesión y separación de grupos sin requerir etiquetas reales.","src":"examen","ref":"Examen anterior · pregunta 24 · foto 3 · transcripción literal","note":"","examNo":24,"photo":3,"unscorable":false,"ctx":"q0023"},{"id":"q0025","s":"2.4","q":"¿Qué método puedo utilizar para evaluar los hiperparámetros de un modelo de clasificación?","o":["GridSearch","RandomSearch","Método manual","Puedo utilizar todos los anteriores"],"a":[3],"why":"Todos ellos son procedimientos de búsqueda o ajuste de hiperparámetros.","src":"examen","ref":"Examen anterior · pregunta 25 · foto 3 · transcripción literal","note":"","examNo":25,"photo":3,"unscorable":false,"ctx":null},{"id":"q0026","s":"2.1","q":"Los analistas de datos de la red social Tuister quieren analizar los sentimientos (positivos o negativos) de la gente que publica sus mensajes. Al hacer un análisis exploratorio se dan cuenta que la gente está llena de odio y la mayor cantidad de datos son negativos. ¿Qué puede hacer con el conjunto de datos para balancearlo?","o":["Aumentar el número de comentarios positivos, repitiendo los existentes (oversampling)","Reducir el número de comentarios negativos (undersampling)","Inventarse comentarios positivos con un SMOTE","Todas las anteriores son válidas"],"a":[3],"why":"Puede realizarse oversampling de la minoritaria, undersampling de la mayoritaria o SMOTE sobre una representación numérica apropiada, evitando aplicarlo sin más sobre texto crudo.","src":"examen","ref":"Examen anterior · pregunta 26 · foto 3 · transcripción literal","note":"Sobremuestreo y submuestreo son viables. SMOTE opera sobre representaciones numéricas de características, no genera directamente comentarios lingüísticos coherentes.","examNo":26,"photo":3,"unscorable":false,"ctx":null},{"id":"q0027","s":"2.3","q":"Una vez balanceadas las clases, ¿qué métrica de evaluación del modelo aconsejas utilizar a los analistas de Tuister?","o":["Accuracy","Índice silueta","F1 Score","Error cuadrático medio"],"a":[0],"why":"Clave esperada por el contexto del examen: Accuracy. También F1 Score es una métrica posible; el enunciado no justifica una preferencia universal.","src":"examen","ref":"Examen anterior · pregunta 27 · foto 4 · transcripción literal","note":"Accuracy y F1 Score son métricas posibles para la clasificación de sentimientos. Balancear el dataset no basta para declarar una como única mejor sin especificar el objetivo.","examNo":27,"photo":4,"unscorable":false,"ctx":"q0026"},{"id":"q0028","s":"2.3","q":"Peter Lion preparador físico del Atlético de Bacon Bridge quiere determinar el número de kilómetros que pueden recorrer sus futbolistas en base a parámetros médicos que ha ido recopilando durante los partidos. Para ello, ha entrenado una SVR y un perceptrón multicapa. Si ha obtenido un MSE=0,5 y un R²= 0,75 para el perceptrón y un MSE= 0,5 y un R²=0,6 para el SVR, ¿qué modelo debería escoger?","o":["El SVR","El perceptrón","Da igual cuál coja tienen el mismo MSE","Ninguno de los dos ya que su MSE y R² es muy alto"],"a":[1],"why":"Respuesta probablemente pretendida: perceptrón, por su R² más alto; los valores publicados de MSE y R², sin embargo, resultan incoherentes si ambos se evaluaron en el mismo test.","src":"examen","ref":"Examen anterior · pregunta 28 · foto 4 · transcripción literal","note":"En el mismo conjunto de evaluación, MSE idéntico y R² diferente son incompatibles con las definiciones habituales: R² = 1−SSE/SST y MSE = SSE/n. El profesor probablemente esperaba la B por R² mayor.","examNo":28,"photo":4,"unscorable":false,"ctx":null},{"id":"q0029","s":"2.3","q":"A su vez, Peter Lion, quiere determinar si sus futbolistas están fatigados o no. Para ello, ha creado un modelo con una SVM, un Random Forest, una MLP y un KNN. Evaluando los modelos ha obtenido que el F-Score del SVM es 0.61. En el Random Forest un F-Score de 0.5. En el MLP un R² de 0.45 y en el KNN un accuracy de 0.1 ¿qué modelo debería escoger?","o":["El SVM","El RF","El KNN","El MLP"],"a":[0],"why":"Respuesta probablemente pretendida: SVM. No hay base técnica suficiente para comparar los cuatro modelos porque se aportan métricas diferentes.","src":"examen","ref":"Examen anterior · pregunta 29 · foto 4 · transcripción literal","note":"No se deben comparar numéricamente F1, R² y Accuracy como si fueran la misma métrica. Solo se puede afirmar con seguridad que SVM supera a Random Forest en F1; la A parece ser la respuesta esperada.","examNo":29,"photo":4,"unscorable":false,"ctx":"q0028"},{"id":"q0030","s":"2.3","q":"Para medir la calidad final de nuestro modelo...","o":["Comparo los outputs predichos de mi modelo (y_pred) con los outputs reales (y_test)","Comparo los outputs de entrenamiento (y_train) con los outputs estimados por mi modelo (y_pred)","Comparo los inputs de entrenamiento (x_train) con los outputs estimados por mi modelo (y_pred)","Comparo los inputs de entrenamiento (x_train) con los inputs de test (x_test)"],"a":[0],"why":"La evaluación final compara predicciones realizadas con el conjunto de test y sus etiquetas reales y_test.","src":"examen","ref":"Examen anterior · pregunta 30 · foto 4 · transcripción literal","note":"","examNo":30,"photo":4,"unscorable":false,"ctx":null},{"id":"q0031","s":"2.1","q":"Una empresa quiere predecir el abandono de clientes y ya ha recopilado los datos. ¿Cuál es la secuencia más adecuada?","o":["Entrenamiento → Preprocesamiento → EDA → Evaluación","Preprocesamiento → Entrenamiento → Adquisición → EDA","EDA → Preprocesamiento → Entrenamiento → Evaluación","Evaluación → EDA → Entrenamiento → Preprocesamiento"],"a":[2],"why":"Después de recopilar datos, se exploran para entenderlos, se preprocesan, se entrena el modelo y finalmente se evalúa.","src":"repaso","ref":"Repaso en clase 2.1 · pregunta 1 · Word","note":""},{"id":"q0032","s":"2.1","q":"Un dataset de 50.000 clientes tiene un 35 % de registros sin edad. ¿Qué harías primero?","o":["Sustituir automáticamente todos los nulos por cero","Eliminar automáticamente la columna","Entrenar ignorando el problema","Analizar distribución e importancia de los ausentes antes de tratarlos"],"a":[3],"why":"Antes de imputar o eliminar, hay que entender patrón de ausencia e importancia de la característica.","src":"repaso","ref":"Repaso en clase 2.1 · pregunta 2 · Word","note":""},{"id":"q0033","s":"2.1","q":"Una inmobiliaria investiga la relación entre superficie de vivienda y precio de venta. ¿Qué tipo de EDA es?","o":["Análisis univariante","Análisis bivariante","Análisis multivariante de todas las características","Análisis de clustering"],"a":[1],"why":"Relaciona dos variables: superficie y precio.","src":"repaso","ref":"Repaso en clase 2.1 · pregunta 3 · Word","note":""},{"id":"q0034","s":"2.1","q":"Para detectar fraudes hay 99.000 operaciones legítimas y 1.000 fraudulentas. ¿Qué conclusión es correcta?","o":["El dataset está desbalanceado y el modelo podría favorecer la clase mayoritaria","Todas las variables requieren Min-Max","Es obligatorio eliminar 98.000 operaciones legítimas","El dataset no sirve para clasificación"],"a":[0],"why":"Las clases son 99 % y 1 %; el desbalance puede ocultar un mal rendimiento en la clase minoritaria.","src":"repaso","ref":"Repaso en clase 2.1 · pregunta 4 · Word","note":""},{"id":"q0035","s":"2.1","q":"En una columna aparecen España, ESPAÑA, españa, Espana y Francia. ¿Qué debe hacerse antes de contar clientes por país?","o":["Eliminar todos los registros de España","Convertir los países a valores aleatorios","Estandarizar representaciones de la misma categoría","Calcular la media de la columna"],"a":[2],"why":"El mismo país no debe contarse como categorías diferentes por mayúsculas o tildes.","src":"repaso","ref":"Repaso en clase 2.1 · pregunta 5 · Word","note":""},{"id":"q0036","s":"2.1","q":"Métodos de pago: tarjeta 600 registros, efectivo 250 y transferencia 150. ¿Cuál es la moda?","o":["Efectivo","Transferencia","La media de los tres métodos","Tarjeta"],"a":[3],"why":"La moda es la categoría con mayor frecuencia: tarjeta, 600.","src":"repaso","ref":"Repaso en clase 2.1 · pregunta 6 · Word","note":""},{"id":"q0037","s":"2.1","q":"Una característica categórica «color» tiene Rojo, Verde y Azul. Se aplica One-Hot Encoding sin eliminar categorías. ¿Qué resulta?","o":["Tres columnas binarias, una por color","Una columna con valores 1, 2 y 3","Una sola columna con la media de los colores","Se elimina la característica"],"a":[0],"why":"One-Hot genera un indicador binario por categoría cuando no se descarta ninguna.","src":"repaso","ref":"Repaso en clase 2.1 · pregunta 7 · Word","note":""},{"id":"q0038","s":"2.1","q":"Se quiere representar una variable objetivo con categorías Bajo, Medio y Alto mediante identificadores numéricos de clase sin crear columnas adicionales. ¿Qué técnica usar?","o":["Normalización Z-Score","One-Hot Encoding","Label Encoding","Min-Max"],"a":[2],"why":"Label Encoding asigna etiquetas numéricas a las clases sin expandir columnas.","src":"repaso","ref":"Repaso en clase 2.1 · pregunta 8 · Word","note":""},{"id":"q0039","s":"2.1","q":"Una empresa agrupa mediciones eléctricas por mes y calcula el consumo mensual total. ¿Qué técnica aplica?","o":["One-Hot Encoding","Agregación de datos","Normalización Z-Score","Discretización de igual ancho"],"a":[1],"why":"Agrupar medidas y calcular totales resumidos constituye agregación.","src":"repaso","ref":"Repaso en clase 2.1 · pregunta 9 · Word","note":""},{"id":"q0040","s":"2.1","q":"Las variables antiguedad_vehiculo y edad_vehiculo representan exactamente los mismos años y tienen los mismos valores. ¿Qué es razonable?","o":["Mantener ambas obligatoriamente","Eliminar una por redundancia","Normalizar una con Min-Max y otra con Z-Score","Eliminar ambas por estar correlacionadas"],"a":[1],"why":"Una de las columnas aporta información duplicada y puede eliminarse.","src":"repaso","ref":"Repaso en clase 2.1 · pregunta 10 · Word","note":""},{"id":"q0041","s":"2.2","q":"Un club quiere predecir el precio numérico de los abonos de la próxima temporada. ¿Cuál de estos algoritmos usar?","o":["DBSCAN","Regresión logística","Support Vector Regression (SVR)","Support Vector Classifier"],"a":[2],"why":"SVR es una variante de SVM para predecir cantidades continuas.","src":"repaso","ref":"Repaso en clase 2.2 · pregunta 1 · Word","note":""},{"id":"q0042","s":"2.2","q":"Un banco debe decidir si concede o no una hipoteca a partir de características de sus clientes. ¿Qué algoritmo elegir entre estas opciones?","o":["Regresión lineal","DBSCAN","K-Means","KNN"],"a":[3],"why":"KNN puede realizar clasificación binaria; las otras tres opciones son regresión o clustering.","src":"repaso","ref":"Repaso en clase 2.2 · pregunta 2 · Word","note":""},{"id":"q0043","s":"2.2","q":"Una empresa de repartos quiere agrupar rutas similares para asignarlas a empleados. ¿Qué algoritmo debe utilizar?","o":["K-Means","SVM","KNN","Random Forest"],"a":[0],"why":"K-Means realiza agrupamiento no supervisado de observaciones similares.","src":"repaso","ref":"Repaso en clase 2.2 · pregunta 3 · Word","note":""},{"id":"q0044","s":"2.2","q":"Se instalan cámaras de reconocimiento facial y clasificación de empleados. ¿Qué arquitectura es idónea?","o":["Regresión logística","LSTM","DBSCAN","CNN"],"a":[3],"why":"Una CNN extrae patrones espaciales relevantes para identificar rostros en imágenes.","src":"repaso","ref":"Repaso en clase 2.2 · pregunta 4 · Word","note":""},{"id":"q0045","s":"2.2","q":"Un modelo recibe mamografías e intenta reconstruir una imagen de entrada. ¿Qué modelo utiliza?","o":["LSTM","CNN","Autoencoder","MLP"],"a":[2],"why":"Un autoencoder tiene codificador y decodificador para aprender a reconstruir entradas.","src":"repaso","ref":"Repaso en clase 2.2 · pregunta 5 · Word","note":""},{"id":"q0046","s":"2.2","q":"Una CNN clasifica fotografías en botijos, ceniceros y cuencos. ¿Qué activación usar en capas convolucionales?","o":["Softmax","Lineal","ReLU","Ninguna activación"],"a":[2],"why":"ReLU es una elección frecuente para capas intermedias y convolucionales.","src":"repaso","ref":"Repaso en clase 2.2 · pregunta 6 · Word","note":""},{"id":"q0047","s":"2.2","q":"En la CNN anterior con tres clases excluyentes, ¿qué activación corresponde a la capa de salida?","o":["Softmax","Sigmoide","ReLU","Lineal"],"a":[0],"why":"Softmax convierte las puntuaciones en probabilidades de tres clases mutuamente excluyentes.","src":"repaso","ref":"Repaso en clase 2.2 · pregunta 7 · Word","note":""},{"id":"q0048","s":"2.2","q":"En la misma CNN de tres clases excluyentes, ¿qué función de coste corresponde?","o":["Binary Cross-Entropy","Mean Squared Error","R²","Multi-Class Cross-Entropy Loss"],"a":[3],"why":"La entropía cruzada multiclase es adecuada para clasificar entre tres categorías excluyentes.","src":"repaso","ref":"Repaso en clase 2.2 · pregunta 8 · Word","note":""},{"id":"q0049","s":"2.2","q":"Una inmobiliaria predice el precio de viviendas a partir de variables con una relación aproximadamente lineal. ¿Qué modelo inicial usar?","o":["Regresión logística","K-Means","DBSCAN","Regresión lineal"],"a":[3],"why":"Es regresión con relación aproximadamente lineal.","src":"repaso","ref":"Repaso en clase 2.2 · pregunta 9 · Word","note":""},{"id":"q0050","s":"2.2","q":"Una universidad quiere estimar la probabilidad de que un estudiante abandone los estudios. ¿Qué algoritmo encaja?","o":["Regresión logística","Regresión lineal","K-Means","Clustering jerárquico"],"a":[0],"why":"La regresión logística estima probabilidades de una variable objetivo binaria.","src":"repaso","ref":"Repaso en clase 2.2 · pregunta 10 · Word","note":""},{"id":"q0051","s":"2.2","q":"Coordenadas GPS forman grupos irregulares con puntos aislados que deben identificarse como ruido. No se conoce K. ¿Qué algoritmo elegir?","o":["DBSCAN","CNN","LSTM","SVM"],"a":[0],"why":"DBSCAN detecta clústeres por densidad, permite formas irregulares y señala ruido.","src":"repaso","ref":"Repaso en clase 2.2 · pregunta 11 · Word","note":""},{"id":"q0052","s":"2.2","q":"Una fábrica detecta grietas en fotografías, aprendiendo bordes, texturas y formas. ¿Qué arquitectura es la más adecuada?","o":["LSTM","CNN","GRU","MLP"],"a":[1],"why":"Las CNN explotan información espacial y filtros convolucionales para visión artificial.","src":"repaso","ref":"Repaso en clase 2.2 · pregunta 12 · Word","note":""},{"id":"q0053","s":"2.2","q":"Una LSTM considera que información antigua dejó de ser relevante para predecir la siguiente acción. ¿Qué componente interviene?","o":["Puerta de entrada","Capa de salida Softmax","Función de pérdida","Puerta de olvido"],"a":[3],"why":"La puerta de olvido regula qué parte del estado de memoria debe conservarse o descartarse.","src":"repaso","ref":"Repaso en clase 2.2 · pregunta 13 · Word","note":""},{"id":"q0054","s":"2.2","q":"Una CNN clasifica manzana, pera, plátano y naranja, con una sola clase verdadera por imagen y etiquetas One-Hot. ¿Qué combinación es adecuada?","o":["Softmax + Categorical Cross-Entropy","Sigmoid + Binary Cross-Entropy","Lineal + MSE","ReLU + MAE"],"a":[0],"why":"Para cuatro clases excluyentes y etiquetas One-Hot: Softmax + Categorical Cross-Entropy.","src":"repaso","ref":"Repaso en clase 2.2 · pregunta 14 · Word","note":""},{"id":"q0055","s":"2.2","q":"Se deben detectar simultáneamente personas, bicicletas y coches; una imagen puede contener las tres clases. ¿Qué activación de salida utilizar?","o":["Softmax, porque todas deben sumar 1","Lineal, porque es regresión","ReLU, porque permite múltiples clases","Sigmoide independiente en cada salida"],"a":[3],"why":"Es clasificación multietiqueta, no multiclase excluyente. Cada salida puede tener una sigmoide independiente.","src":"repaso","ref":"Repaso en clase 2.2 · pregunta 15 · Word","note":""},{"id":"q0056","s":"2.3","q":"Un clasificador alcanza 98 % en entrenamiento y 94 % en validación. Antes de desplegarlo quiere estimar su generalización. ¿Qué debe hacer?","o":["Evaluarlo otra vez con train","Elegir el resultado más alto","Evaluarlo sobre test independiente","Entrenar hasta alcanzar 100 %"],"a":[2],"why":"Test independiente ofrece una estimación no sesgada por el entrenamiento y ajuste previo.","src":"repaso","ref":"Repaso en clase 2.3 · pregunta 1 · Word","note":""},{"id":"q0057","s":"2.3","q":"Un club desea predecir numéricamente el precio de sus abonos. ¿Qué métrica corresponde?","o":["R²","F-Score","Sensibilidad","Índice de silueta"],"a":[0],"why":"R² mide calidad de modelos de regresión.","src":"repaso","ref":"Repaso en clase 2.3 · pregunta 2 · Word","note":""},{"id":"q0058","s":"2.3","q":"Un banco clasifica si concede o deniega hipotecas. ¿Qué métrica de estas es adecuada?","o":["R²","MSE","Accuracy","Índice de silueta"],"a":[2],"why":"Accuracy es una métrica de clasificación. Su utilidad depende del equilibrio entre clases y costes de error.","src":"repaso","ref":"Repaso en clase 2.3 · pregunta 3 · Word","note":""},{"id":"q0059","s":"2.3","q":"Si las clases del problema de hipotecas están desbalanceadas, ¿qué métrica general puede ser preferible?","o":["Sensibilidad","F1 Score","Índice de silueta","Precisión"],"a":[1],"why":"F1 combina Precision y Recall y resulta útil cuando ambas son importantes y hay desbalance.","src":"repaso","ref":"Repaso en clase 2.3 · pregunta 4 · Word","note":"La selección real de métrica depende del coste de FP y FN; no siempre F1 es la mejor."},{"id":"q0060","s":"2.3","q":"Una empresa quiere evaluar el agrupamiento de rutas de reparto. ¿Qué métrica corresponde?","o":["R²","MSE","F1 Score","Índice de silueta"],"a":[3],"why":"Silhouette Score evalúa cohesión y separación de clusters.","src":"repaso","ref":"Repaso en clase 2.3 · pregunta 5 · Word","note":""},{"id":"q0061","s":"2.3","q":"El analista detecta mucho sobreajuste. ¿Qué técnica de evaluación ayuda a estimar mejor la generalización?","o":["Holdout","Cross Validation","K-Means","MSE"],"a":[1],"why":"La validación cruzada ayuda a detectar problemas de generalización y a seleccionar configuraciones, pero por sí sola no elimina el sobreajuste.","src":"repaso","ref":"Repaso en clase 2.3 · pregunta 6 · Word","note":"El Wooclap original dice «eliminar el sobreajuste». Esa afirmación es técnicamente incorrecta: Cross Validation puede detectar y estimar problemas de generalización, no eliminarlos por sí sola."},{"id":"q0062","s":"2.3","q":"10.000 transacciones: 9.000 legítimas y 1.000 fraudulentas. En Holdout estratificado con 20 % test, ¿cuántos fraudes van a test?","o":["200","1.000","600","2.000"],"a":[0],"why":"Se conserva el 20 % de la clase fraudulenta: 0,20 × 1.000 = 200.","src":"repaso","ref":"Repaso en clase 2.3 · pregunta 7 · Word","note":""},{"id":"q0063","s":"2.3","q":"Se aplica K-Fold con K=5 a 1.000 muestras. ¿Cuántas se utilizan para entrenar y validar en cada iteración?","o":["200 entrenar y 800 validar","500 entrenar y 500 validar","1.000 entrenar y 200 validar","800 entrenar y 200 validar"],"a":[3],"why":"Cada fold tiene 1.000/5=200 registros; cuatro folds (800) entrenan y uno (200) valida.","src":"repaso","ref":"Repaso en clase 2.3 · pregunta 8 · Word","note":""},{"id":"q0064","s":"2.3","q":"Un hospital quiere evitar que enfermos sean clasificados como sanos, aunque aumenten las pruebas de falsos positivos. ¿Qué métrica prioriza?","o":["Precision","Accuracy","Recall","MSE"],"a":[2],"why":"Se prioriza detectar enfermos reales: maximizar Recall reduce los falsos negativos.","src":"repaso","ref":"Repaso en clase 2.3 · pregunta 9 · Word","note":""},{"id":"q0065","s":"2.3","q":"Dos clasificadores tienen AUC-ROC 0,94 (A) y 0,70 (B). ¿Qué afirmación es correcta?","o":["A tiene mayor capacidad global de discriminación","B necesariamente comete menos falsos positivos","A tiene un Accuracy del 94 %","B tiene un Recall del 70 %"],"a":[0],"why":"AUC-ROC compara discriminación a lo largo de distintos umbrales; no equivale a Accuracy ni Recall.","src":"repaso","ref":"Repaso en clase 2.3 · pregunta 10 · Word","note":""},{"id":"q0066","s":"2.3","q":"Dos configuraciones de K-Means con igual K presentan SSW de 400 (A) y 650 (B). ¿Cuál tiene mejor cohesión interna?","o":["Modelo A","Modelo B","Ambos tienen cohesión idéntica","SSW no puede utilizarse en clustering"],"a":[0],"why":"SSW suma variaciones intraclúster; menor valor indica mayor compacidad cuando es comparable.","src":"repaso","ref":"Repaso en clase 2.3 · pregunta 11 · Word","note":""},{"id":"q0067","s":"2.3","q":"Se comparan agrupamientos del mismo dataset y K: SSB 450 (A) y 670 (B). ¿Cuál tiene mayor separación?","o":["Modelo A, un SSB bajo significa mayor separación","Ambos igual","SSB no sirve para estudiar separación","Modelo B, porque SSB es mayor"],"a":[3],"why":"SSB cuantifica variación entre clústeres; en una comparación pertinente, mayor suele indicar más separación.","src":"repaso","ref":"Repaso en clase 2.3 · pregunta 12 · Word","note":""},{"id":"q0068","s":"1","q":"Un hospital quiere incorporar criterios de especialistas a un programa que resuelva diagnósticos complejos. ¿Qué disciplina describe este proyecto?","o":["Diseño gráfico","Administración de redes","Compresión de datos","Ingeniería del Conocimiento"],"a":[3],"why":"La IC transforma conocimiento experto en estructuras y sistemas informáticos para resolver problemas complejos.","src":"nueva","ref":"Tema 1 · Introducción","note":""},{"id":"q0069","s":"1","q":"Un experto conoce reglas de diagnóstico, pero solo puede describirlas verbalmente. ¿Qué tarea corresponde al ingeniero del conocimiento?","o":["Sustituir al experto por fuerza bruta","Borrar las reglas subjetivas","Convertir lenguaje natural en representación formal","Aplicar únicamente filtros de imagen"],"a":[2],"why":"La IC obtiene, estructura y formaliza las reglas y relaciones comunicadas por los expertos.","src":"nueva","ref":"Tema 1 · Metodología","note":""},{"id":"q0070","s":"1","q":"Una empresa entrevista a especialistas para construir una base de conocimiento. ¿Qué etapa está realizando?","o":["Compresión de la base de datos","Adquisición de conocimiento","Despliegue web","Validación externa de hardware"],"a":[1],"why":"Entrevistar expertos es un método de captación/adquisición de conocimiento.","src":"nueva","ref":"Tema 1 · Fases","note":""},{"id":"q0071","s":"1","q":"Se organizan conceptos y reglas para que una máquina pueda interpretarlos. ¿Qué fase de IC es?","o":["Representación del conocimiento","Diseño de logotipos","Backpropagation","Recuperación de contraseñas"],"a":[0],"why":"La representación codifica formalmente hechos, conceptos y reglas.","src":"nueva","ref":"Tema 1 · Fases","note":""},{"id":"q0072","s":"1","q":"Un sistema aplica reglas y obtiene una nueva conclusión no escrita explícitamente como hecho inicial. ¿Qué proceso ejecuta?","o":["Compresión de vídeo","Codificación One-Hot","Inferencia","Normalización"],"a":[2],"why":"La inferencia permite derivar conclusiones a partir de conocimiento y hechos disponibles.","src":"nueva","ref":"Tema 1 · Fases","note":""},{"id":"q0073","s":"1","q":"Un experto pide saber por qué el sistema recomendó una acción. ¿Qué capacidad se necesita?","o":["Explicación del razonamiento","Balance de clases","Entrenamiento por refuerzo","Muestreo bootstrap"],"a":[0],"why":"El módulo de explicación permite justificar cómo el motor llegó a una conclusión.","src":"nueva","ref":"Tema 1 · SBC","note":""},{"id":"q0074","s":"1","q":"En un sistema basado en reglas, ¿dónde se almacenan las reglas y los hechos del dominio?","o":["En la GPU","En el historial del navegador","En la base de conocimiento","En el motor de inferencia"],"a":[2],"why":"La base de conocimiento conserva reglas y hechos generales del dominio.","src":"nueva","ref":"Tema 1 · Arquitectura","note":""},{"id":"q0075","s":"1","q":"Un programa consulta las reglas para deducir un diagnóstico. ¿Qué componente realiza el razonamiento?","o":["Interfaz gráfica","Motor de inferencia","Memoria USB","Pantalla de inicio"],"a":[1],"why":"El motor de inferencia aplica mecanismos de razonamiento sobre hechos y reglas.","src":"nueva","ref":"Tema 1 · Arquitectura","note":""},{"id":"q0076","s":"1","q":"¿Dónde se almacenan los hechos temporales de un caso y conclusiones intermedias durante el razonamiento?","o":["Kernel CUDA","Catálogo de licencias","Memoria de trabajo","Módulo visual"],"a":[2],"why":"La memoria de trabajo contiene información específica del caso que evoluciona durante la inferencia.","src":"nueva","ref":"Tema 1 · Arquitectura","note":""},{"id":"q0077","s":"1","q":"Una persona introduce síntomas en un sistema experto. ¿Qué componente facilita esa interacción?","o":["SMOTE","Descenso de gradiente","Función de coste","Interfaz de usuario"],"a":[3],"why":"La interfaz permite que usuarios introduzcan datos y reciban resultados.","src":"nueva","ref":"Tema 1 · Arquitectura","note":""},{"id":"q0078","s":"1","q":"Una empresa debe conservar saber técnico aunque se jubile un empleado experto. ¿Qué ventaja de los SBC aprovecha?","o":["Sobrecarga de hardware","Destrucción de registros","Reutilización y mantenimiento del conocimiento","Imposibilidad de explicar decisiones"],"a":[2],"why":"Un SBC puede preservar conocimiento organizado para usarlo posteriormente.","src":"nueva","ref":"Tema 1 · Ventajas","note":""},{"id":"q0079","s":"1","q":"Dos especialistas discrepan sobre una regla y uno no está seguro de su respuesta. ¿Qué dificultad típica de la IC aparece?","o":["Escalado decimal","Etiquetas perfectamente balanceadas","Exceso de núcleos de CPU","Fuentes contradictorias e incertidumbre"],"a":[3],"why":"El conocimiento puede ser contradictorio, incompleto, impreciso e incierto.","src":"nueva","ref":"Tema 1 · Retos","note":""},{"id":"q0080","s":"1","q":"Se descubre información predictiva oculta en una colección de datos de clientes. ¿Qué herramienta se está usando?","o":["Minería de datos","Interfaz de usuario","Rendering 3D","Pooling"],"a":[0],"why":"La minería de datos obtiene patrones y relaciones útiles a partir de conjuntos de datos.","src":"nueva","ref":"Tema 1 · Herramientas","note":""},{"id":"q0081","s":"1","q":"Un SBC resuelve problemas mediante experiencias anteriores similares. ¿De qué tipo es?","o":["Clasificación de imágenes","Normalización","Basado en casos","Basado exclusivamente en GUI"],"a":[2],"why":"El razonamiento basado en casos adapta soluciones empleadas en casos previos.","src":"nueva","ref":"Tema 1 · Tipos de SBC","note":""},{"id":"q0082","s":"1","q":"Un sistema reúne contribuciones de múltiples fuentes sobre una pizarra compartida de conocimiento. ¿Qué arquitectura describe?","o":["Min-Max","Red convolucional","Blackboard","Regresión logística"],"a":[2],"why":"Los sistemas de pizarra permiten integrar aportaciones de diversas fuentes para resolver un problema.","src":"nueva","ref":"Tema 1 · Tipos de SBC","note":""},{"id":"q0083","s":"1","q":"Una administración formula preguntas y verifica si un ciudadano cumple los requisitos de una ayuda. ¿Qué tipo de SBC es?","o":["Sistema sin conocimiento","Análisis de elegibilidad","Autoencoder","Reducción PCA"],"a":[1],"why":"Los sistemas de elegibilidad determinan si se cumplen criterios para un servicio.","src":"nueva","ref":"Tema 1 · Tipos de SBC","note":""},{"id":"q0084","s":"1","q":"Un programa utiliza condiciones «SI temperatura alta Y presión baja, ENTONCES alarma». ¿Qué tipo de SBC representa?","o":["Sistema basado en reglas","Regresión lineal","Clustering jerárquico","Compresión lossless"],"a":[0],"why":"La representación SI-ENTONCES es propia de sistemas basados en reglas.","src":"nueva","ref":"Tema 1 · Tipos de SBC","note":""},{"id":"q0085","s":"1","q":"Un software educativo adapta preguntas y retroalimentación al avance de un estudiante. ¿Qué tipo de SBC puede ser?","o":["Sistema de pizarra obligatoriamente","Únicamente control de versiones","Clasificador de spam exclusivamente","Tutoría inteligente"],"a":[3],"why":"La tutoría inteligente usa conocimiento del dominio y del aprendiz para orientar su aprendizaje.","src":"nueva","ref":"Tema 1 · Tipos de SBC","note":""},{"id":"q0086","s":"1","q":"Un problema está mal definido y requiere reglas prácticas basadas en experiencia humana. ¿Qué enfoque suele resultar adecuado?","o":["Sistema basado en conocimiento","Algoritmo fijo de ordenación sin contexto","Conversor de formatos","Visor de imágenes sin lógica"],"a":[0],"why":"Los SBC se orientan a dominios complejos donde el conocimiento heurístico aporta valor.","src":"nueva","ref":"Tema 1 · SBC vs SI","note":""},{"id":"q0087","s":"1","q":"Un proceso empresarial está completamente especificado y admite un algoritmo fijo. ¿Qué sistema se ajusta mejor a ese enfoque del temario?","o":["Sistema de información convencional","Sistema experto obligatorio","Clustering difuso","Autoencoder"],"a":[0],"why":"Los sistemas de información convencionales se asocian en la comparación del tema a procedimientos bien definidos.","src":"nueva","ref":"Tema 1 · SBC vs SI","note":""},{"id":"q0088","s":"1","q":"¿Qué relación describe mejor a un sistema experto (SE) y un sistema basado en conocimiento (SBC)?","o":["Son conceptos siempre idénticos","Todo SBC es necesariamente SE","Todo SE es una forma de SBC, pero no todo SBC es SE","Un SE no contiene conocimiento"],"a":[2],"why":"El SE es un tipo de SBC que emula razonamiento experto en un dominio.","src":"nueva","ref":"Tema 1 · SBC vs SE","note":""},{"id":"q0089","s":"1","q":"Un investigador almacena en una tabla «39 °C». ¿Qué representa ese número sin más contexto?","o":["Hipótesis demostrada","Regla de inferencia","Dato","Conocimiento experto completo"],"a":[2],"why":"El número aislado es un dato; procesarlo e interpretarlo genera información.","src":"nueva","ref":"Tema 1 · Datos vs información","note":""},{"id":"q0090","s":"1","q":"Un sistema transforma 39 °C en «temperatura corporal elevada». ¿Qué ha obtenido?","o":["Un algoritmo de clustering","Un hiperparámetro","Información","Una función de activación"],"a":[2],"why":"Se interpreta el dato y se añade significado: información.","src":"nueva","ref":"Tema 1 · Datos vs información","note":""},{"id":"q0091","s":"1","q":"Un médico combina fiebre, síntomas y experiencia para recomendar pruebas. ¿Qué utiliza especialmente?","o":["Escalado decimal","Pooling","Conocimiento","Datos sin procesar únicamente"],"a":[2],"why":"Conocimiento combina información, experiencia y saber práctico para orientar decisiones.","src":"nueva","ref":"Tema 1 · Datos vs conocimiento","note":""},{"id":"q0092","s":"1","q":"Una organización recopila tantos datos que requiere tecnologías especiales de almacenamiento y análisis. ¿Qué concepto aparece?","o":["Hinge Loss","Big Data","Underfitting","Kernel polinómico"],"a":[1],"why":"Big Data se refiere a datos masivos o complejos que necesitan herramientas de procesamiento especiales.","src":"nueva","ref":"Tema 1 · ""},{"id":"q0155","s":"2.1","q":"Un proyecto descarga sin coste un dataset del repositorio UCI. ¿Qué fuente utiliza?","o":["Datos necesariamente simulados","Libre","Exclusivamente interna","De pago"],"a":[1],"why":"UCI aparece entre las fuentes libres del tema.","src":"nueva","ref":"Tema 2.1 · Fuentes","note":""},{"id":"q0156","s":"2.1","q":"Un proveedor cobra a una empresa por datos especializados y anotados. ¿Qué fuente es?","o":["Interna por definición","Libre pública","De pago","Sin origen"],"a":[2],"why":"Los proveedores externos que venden datasets son fuentes de pago.","src":"nueva","ref":"Tema 2.1 · Fuentes","note":""},{"id":"q0157","s":"2.1","q":"¿Cuál es un riesgo principal de utilizar datasets gratuitos encontrados en Internet?","o":["No ajustarse a requisitos, calidad o actualidad","Estar siempre perfectamente etiquetados","Carecer obligatoriamente de licencia","Ser imposibles de abrir con Python"],"a":[0],"why":"Los datos gratuitos pueden no ser relevantes o estar desactualizados y pueden tener licencias restrictivas.","src":"nueva","ref":"Tema 2.1 · Fuentes","note":""},{"id":"q0158","s":"2.1","q":"Se analiza individualmente la distribución del salario de empleados. ¿Qué EDA es?","o":["Aprendizaje por refuerzo","Univariante","Multivariante","Bivariante"],"a":[1],"why":"Una sola característica = EDA univariante.","src":"nueva","ref":"Tema 2.1 · EDA","note":""},{"id":"q0159","s":"2.1","q":"Se estudian conjuntamente edad, ingresos, antigüedad y número de compras. ¿Qué EDA es?","o":["Exclusivamente univariante","EDA sin variables","Multivariante","Normalización"],"a":[2],"why":"Más de dos variables consideradas conjuntamente = multivariante.","src":"nueva","ref":"Tema 2.1 · EDA","note":""},{"id":"q0160","s":"2.1","q":"Una columna tiene 3, 4, 5, 300 y 6. ¿Qué debe investigar primero el analista?","o":["Que el modelo sea necesariamente CNN","Posible outlier 300","Que se trate de One-Hot","Que todos sean negativos"],"a":[1],"why":"El 300 se aleja notablemente de los demás, aunque antes de eliminarlo hay que investigar si es real.","src":"nueva","ref":"Tema 2.1 · EDA","note":""},{"id":"q0161","s":"2.1","q":"Un dataset de emails tiene 98 % «normal» y 2 % «spam». ¿Cuál es el principal riesgo?","o":["Que no admita métricas","Que no sea un problema de clasificación","Sesgo de aprendizaje hacia la clase mayoritaria","Que haya que usar PCA obligatoriamente"],"a":[2],"why":"Un modelo trivial puede obtener Accuracy alta ignorando correos spam.","src":"nueva","ref":"Tema 2.1 · Desbalance","note":""},{"id":"q0162","s":"2.1","q":"¿Qué técnica aumenta la frecuencia de la clase minoritaria duplicando ejemplos existentes?","o":["Undersampling","Discretización","Escalado decimal","Oversampling"],"a":[3],"why":"Oversampling aumenta ejemplos de la clase minoritaria, mediante repetición u otras estrategias.","src":"nueva","ref":"Tema 2.1 · Balanceo","note":""},{"id":"q0163","s":"2.1","q":"¿Qué técnica reduce registros de la clase mayoritaria para equilibrar el conjunto?","o":["Min-Max","Undersampling","Holdout","One-Hot"],"a":[1],"why":"Undersampling disminuye muestras de una clase mayoritaria.","src":"nueva","ref":"Tema 2.1 · Balanceo","note":""},{"id":"q0164","s":"2.1","q":"¿Qué técnica crea ejemplos sintéticos de una clase minoritaria a partir de vecinos numéricos?","o":["SMOTE","Regresión lineal de salida","Z-Score","Leaky-ReLU"],"a":[0],"why":"SMOTE sintetiza muestras entre puntos de la clase minoritaria en un espacio de características apropiado.","src":"nueva","ref":"Tema 2.1 · Balanceo","note":""},{"id":"q0165","s":"2.1","q":"La variable «edad» contiene valores numéricos faltantes y outliers importantes. ¿Qué imputación suele ser más robusta?","o":["Cero arbitrario siempre","Mediana","Categoría «naranja»","Moda de una columna no relacionada"],"a":[1],"why":"La mediana es menos sensible a valores extremos que la media.","src":"nueva","ref":"Tema 2.1 · Limpieza","note":""},{"id":"q0166","s":"2.1","q":"Una columna «país» tiene valores ausentes. ¿Qué imputación puede aplicarse si resulta apropiado?","o":["RMSE","Moda o categoría «Desconocido»","Media aritmética de nombres","ReLU"],"a":[1],"why":"En variables categóricas puede utilizarse moda o una categoría explícita de desconocido.","src":"nueva","ref":"Tema 2.1 · Limpieza","note":""},{"id":"q0167","s":"2.1","q":"En mediciones temporales falta el dato de las 14:00 entre valores de 13:00 y 15:00. ¿Qué técnica estima el intermedio?","o":["One-Hot","Bootstrap","Clustering","Interpolación"],"a":[3],"why":"La interpolación estima valores faltantes a partir de observaciones cercanas, especialmente en series temporales.","src":"nueva","ref":"Tema 2.1 · Limpieza","note":""},{"id":"q0168","s":"2.1","q":"Se usa la media de toda la base, incluido test, para rellenar nulos antes de dividir datos. ¿Qué riesgo aparece?","o":["Sustitución de etiquetas","Mejora garantizada de generalización","Menor necesidad de validación","Fuga de información (data leakage)"],"a":[3],"why":"Las estadísticas de preprocesamiento deben calcularse en train y después aplicarse a validación/test.","src":"nueva","ref":"Tema 2.1 · Buenas prácticas","note":""},{"id":"q0169","s":"2.1","q":"La columna ingreso tiene mínimo 100 y máximo 1.100. ¿Qué Min-Max corresponde al valor 600?","o":["1.100","0,05","600","0,5"],"a":[3],"why":"(600−100)/(1.100−100)=500/1.000=0,5.","src":"nueva","ref":"Tema 2.1 · Transformación","note":""},{"id":"q0170","s":"2.1","q":"En una variable con media 50 y desviación estándar 10, ¿qué Z-Score tiene el valor 70?","o":["0,2","7","−2","2"],"a":[3],"why":"Z=(70−50)/10=2.","src":"nueva","ref":"Tema 2.1 · Transformación","note":""},{"id":"q0171","s":"2.1","q":"¿Qué técnica transforma el mínimo a 0 y el máximo a 1 cuando los valores no son constantes?","o":["Interpolación","Min-Max","Label Encoding","Z-Score"],"a":[1],"why":"La normalización Min-Max lineal permite escalar al rango [0,1].","src":"nueva","ref":"Tema 2.1 · Transformación","note":""},{"id":"q0172","s":"2.1","q":"¿Qué técnica usa la media y desviación estándar en lugar de los extremos de la distribución?","o":["PCA en exclusiva","SMOTE","Z-Score","One-Hot"],"a":[2],"why":"Z-Score centra por media y divide por la desviación estándar.","src":"nueva","ref":"Tema 2.1 · Transformación","note":""},{"id":"q0173","s":"2.1","q":"La edad en años se transforma a los grupos 0–17, 18–64 y 65+. ¿Qué técnica es?","o":["Muestreo Bootstrap","Discretización","Agregación temporal","Generación de etiquetas"],"a":[1],"why":"Se transforma un valor continuo en intervalos/categorías.","src":"nueva","ref":"Tema 2.1 · Discretización","note":""},{"id":"q0174","s":"2.1","q":"Una discretización divide el rango de 0 a 100 en intervalos [0,25), [25,50), [50,75) y [75,100]. ¿Cuál es?","o":["Igual frecuencia obligatoria","PCA","Data augmentation","Igual ancho"],"a":[3],"why":"Cada intervalo tiene amplitud 25, por lo que se trata de igual ancho.","src":"nueva","ref":"Tema 2.1 · Discretización","note":""},{"id":"q0175","s":"2.1","q":"Una discretización busca que cada intervalo tenga aproximadamente el mismo número de registros. ¿Cuál es?","o":["Igual ancho siempre","One-Hot","Igual frecuencia o igual altura","Regresión logística"],"a":[2],"why":"La técnica de igual frecuencia agrupa un número similar de observaciones por intervalo.","src":"nueva","ref":"Tema 2.1 · Discretización","note":""},{"id":"q0176","s":"2.1","q":"En una columna «estado civil» no hay orden entre las categorías y se usarán modelos sensibles a distancias. ¿Qué codificación evita introducir un orden arbitrario?","o":["Eliminar todas las filas","Sustituir por media de códigos","Label Encoding como magnitud continua","One-Hot Encoding"],"a":[3],"why":"One-Hot crea indicadores binarios sin imponer proximidad numérica entre categorías.","src":"nueva","ref":"Tema 2.1 · Codificación","note":""},{"id":"q0177","s":"2.1","q":"La variable objetivo es «aprobado», «suspenso», y se desea un ID de clase. ¿Qué codificación encaja?","o":["Z-Score","Bootstrap","Label Encoding","PCA"],"a":[2],"why":"Label Encoding asigna identificadores enteros de clase.","src":"nueva","ref":"Tema 2.1 · Codificación","note":""},{"id":"q0178","s":"2.1","q":"Un análisis detecta tres columnas idénticas. ¿Qué opción ayuda a reducir redundancia?","o":["Conservar una y eliminar duplicadas","Poner todas a cero sin estudiar","Aplicarles Softmax","Duplicar las tres de nuevo"],"a":[0],"why":"Las columnas idénticas aportan información redundante.","src":"nueva","ref":"Tema 2.1 · Reducción","note":""},{"id":"q0179","s":"2.1","q":"¿Qué técnica resume muchas variables correlacionadas mediante nuevas componentes ortogonales?","o":["Holdout","Binary Cross-Entropy","PCA","Interpolación"],"a":[2],"why":"PCA encuentra componentes principales ortogonales que recogen variabilidad.","src":"nueva","ref":"Tema 2.1 · Reducción","note":""},{"id":"q0180","s":"2.1","q":"En un proyecto se reúnen ventas por día y se transforman en ventas por trimestre. ¿Qué proceso realiza?","o":["Hinge Loss","Codificación categórica","Transformación Softmax","Agregación"],"a":[3],"why":"Se combinan observaciones individuales para obtener una serie resumida por periodo.","src":"nueva","ref":"Tema 2.1 · Agregación","note":""},{"id":"q0181","s":"2.1","q":"Un texto tiene «Zaragoza», «zaragoza» y «ZARAGOZA» como tres categorías. ¿Qué primer paso es razonable?","o":["Imputar todos los países como 0","Normalizar escritura/capitalización","Aplicar SVM directamente sin mirar datos","Discretizar edades"],"a":[1],"why":"La limpieza reduce duplicidades producidas por diferencias ortográficas.","src":"nueva","ref":"Tema 2.1 · Limpieza","note":""},{"id":"q0182","s":"2.1","q":"¿Cuál de estas preguntas pertenece al EDA antes de entrenar una CNN de clasificación de imágenes?","o":["¿Qué URL tendrá el despliegue?","¿Cuál es la contraseña del servidor?","¿Qué icono llevará la app?","¿Hay suficientes ejemplos variados de cada clase?"],"a":[3],"why":"El material pide revisar representatividad y
